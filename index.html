<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자소서·이력서 첨삭</title>
<style>
  :root{
    --bg:#ffffff;
    --text:#1a2130;
    --muted:#6b7280;
    --green:#1b4332;
    --green-light:#e8f0ec;
    --navy:#1c2c54;
    --navy-light:#eef1f8;
    --border:#e2e5ea;
    --warn:#b45309;
    --warn-bg:#fef3e2;
    --ok:#1b4332;
    --ok-bg:#e8f0ec;
    --miss:#b91c1c;
    --miss-bg:#fdecec;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'맑은 고딕','Malgun Gothic',-apple-system,sans-serif;
    line-height:1.6;
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  header h1{
    font-size:18px;
    margin:0;
    font-weight:700;
  }
  header .badge{
    font-size:12px;
    background:rgba(255,255,255,.15);
    padding:4px 10px;
    border-radius:999px;
  }
  main{
    max-width:880px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  .card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    margin-bottom:18px;
  }
  .card h2{
    font-size:16px;
    color:var(--navy);
    margin:0 0 14px;
    border-left:4px solid var(--green);
    padding-left:10px;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--navy);
    margin:12px 0 6px;
  }
  select, textarea, input[type=text]{
    width:100%;
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    font-family:inherit;
    font-size:14px;
    color:var(--text);
    resize:vertical;
  }
  textarea{min-height:90px;}
  .counter{
    text-align:right;
    font-size:12px;
    color:var(--muted);
    margin-top:4px;
  }
  button{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    border:none;
    border-radius:8px;
    padding:10px 18px;
    cursor:pointer;
  }
  .btn-primary{background:var(--green); color:#fff;}
  .btn-primary:disabled{background:#9db8ad; cursor:not-allowed;}
  .btn-secondary{background:var(--navy-light); color:var(--navy);}
  .btn-danger{background:var(--miss-bg); color:var(--miss);}
  .btn-row{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  .tab{
    padding:8px 14px;
    border-radius:8px 8px 0 0;
    background:var(--navy-light);
    color:var(--navy);
    cursor:pointer;
    font-size:13px;
    font-weight:700;
  }
  .tab.active{background:var(--navy); color:#fff;}
  .status-msg{
    margin-top:14px;
    padding:12px 14px;
    border-radius:8px;
    font-size:13px;
    background:var(--green-light);
    color:var(--green);
    display:none;
  }
  .status-msg.error{background:var(--miss-bg); color:var(--miss);}
  .star-row{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;}
  .star-tag{
    font-size:12px;
    font-weight:700;
    padding:4px 10px;
    border-radius:999px;
  }
  .star-tag.ok{background:var(--ok-bg); color:var(--ok);}
  .star-tag.miss{background:var(--miss-bg); color:var(--miss);}
  .review-item{
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    margin-bottom:14px;
  }
  .review-item .meta{font-size:12px; color:var(--muted); margin-bottom:8px;}
  .field-block{margin-bottom:10px;}
  .field-block .fb-label{font-size:12px; font-weight:700; color:var(--muted); margin-bottom:4px;}
  .preset-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    margin-bottom:8px;
  }
  .link-box{
    display:flex;
    gap:8px;
    align-items:center;
    background:var(--green-light);
    border-radius:8px;
    padding:10px 12px;
    margin-top:10px;
    word-break:break-all;
    font-size:13px;
  }
  .empty{color:var(--muted); font-size:13px; padding:10px 0;}
  .result-block{margin-bottom:18px;}
  .result-block h3{font-size:14px; color:var(--navy); margin:0 0 6px;}
  .result-block p{margin:0; font-size:14px;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161c; --text:#e7e9ee; --muted:#9aa3af;
      --border:#2a2f3a; --green-light:#16261f; --navy-light:#1b2333;
      --ok-bg:#16261f; --miss-bg:#2a1616;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161c; --text:#e7e9ee; --muted:#9aa3af;
    --border:#2a2f3a; --green-light:#16261f; --navy-light:#1b2333;
    --ok-bg:#16261f; --miss-bg:#2a1616;
  }
</style>
</head>
<body>
<header>
  <h1>📝 자소서·이력서 첨삭</h1>
  <span class="badge" id="roleBadge">학생용</span>
</header>
<main id="app"></main>

<script>
const params = new URLSearchParams(location.search);
const isAdmin = params.get('admin') === '1';
document.getElementById('roleBadge').textContent = isAdmin ? '강사용' : '학생용';

const app = document.getElementById('app');

// ---------- 공통 유틸 ----------
async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    const msg = (err.error || ('요청 실패: ' + res.status)) + (err.detail ? ' — 상세: ' + err.detail : '');
    throw new Error(msg);
  }
  return res.json();
}

const FRAMEWORK_LABELS = {
  STAR: { situation: '상황(S)', task: '과제(T)', action: '행동(A)', result: '결과(R)' },
  'STAR-L': { situation: '상황(S)', task: '과제(T)', action: '행동(A)', result: '결과+배움(R-L)' },
  PREP: { point: '주장(P)', reason: '근거(R)', example: '사례(E)', pointAgain: '재강조(P)' }
};

function structureTagsHtml(framework, structure) {
  const labels = FRAMEWORK_LABELS[framework] || FRAMEWORK_LABELS.STAR;
  return Object.keys(labels).map(k => {
    const ok = structure && structure[k];
    return `<span class="star-tag ${ok ? 'ok' : 'miss'}">${labels[k]} ${ok ? '충족' : '보완필요'}</span>`;
  }).join('');
}

function concretenessTagsHtml(c) {
  if (!c) return '';
  const labels = { hasNumber: '숫자 포함', hasProperNoun: '고유명사 포함', hasJobKeyword: '직무 키워드 포함' };
  return Object.keys(labels).map(k => {
    const ok = c[k];
    return `<span class="star-tag ${ok ? 'ok' : 'miss'}">${labels[k]} ${ok ? 'O' : 'X'}</span>`;
  }).join('');
}

function riskFlagsHtml(flags) {
  if (!flags || !flags.length) return '';
  const labelMap = {
    복사붙여넣기형: '복사·붙여넣기형(회사·직무명 오류 의심)',
    완벽한AI스타일형: '완벽한 AI 스타일형(개인 경험 부족)',
    동문서답형: '동문서답형(핵심 키워드·수치 부족)',
    추상적표현남발형: '추상적 표현 남발형',
    근거부족나열형: '근거 부족 주장 나열형'
  };
  return `<div style="margin:10px 0">${flags.map(f =>
    `<span class="star-tag miss" style="background:var(--warn-bg);color:var(--warn)">⚠ ${labelMap[f] || f}</span>`
  ).join(' ')}</div>`;
}

function followUpHtml(fu) {
  if (!fu) return '';
  const labels = { reasonType: '이유형', alternativeType: '대안형', quantifyType: '수치형' };
  return Object.keys(labels).map(k =>
    `<div class="field-block"><div class="fb-label">꼬리질문 · ${labels[k]}</div><p>${escapeHtml(fu[k])}</p></div>`
  ).join('');
}

function escapeHtml(str) {
  return (str || '').replace(/[&<>"']/g, s => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[s]));
}

// ---------- 라우팅 ----------
function route() {
  const hash = location.hash;
  if (hash.indexOf('#result=') === 0) {
    const id = hash.replace('#result=', '');
    renderResultView(id);
  } else if (isAdmin) {
    renderTeacherView();
  } else {
    renderStudentView();
  }
}
window.addEventListener('hashchange', route);

const QUESTION_EXAMPLES = {
  '지원동기': '예) 지원 동기를 본인의 경험과 연결하여 서술하시오. (500자 이내)',
  '성격장점': '예) 본인의 성격상 장점을 서술하시오.',
  '성격단점': '예) 본인의 성격상 단점과 그 개선 노력을 서술하시오.',
  '협업갈등': '예) 팀 프로젝트에서 갈등을 해결했던 경험을 서술하시오.',
  '도전경험': '예) 가장 도전적이었던 경험과 그 결과를 서술하시오.',
  '실패경험': '예) 실패했던 경험과 그로부터 배운 점을 서술하시오.',
  '경력활동': '예) 관련 경력·활동사항을 구체적인 수치와 함께 서술하시오.',
  '입사후포부': '예) 입사 후 포부를 서술하시오.'
};

// ---------- 학생 화면 ----------
async function renderStudentView() {
  app.innerHTML = `
    <div class="card">
      <h2>자소서 문항 첨삭 요청</h2>
      <label>사용할 첨삭 기준 (강사가 미리 설정)</label>
      <select id="presetSelect"><option>불러오는 중...</option></select>

      <label>문항 유형 (진단 기준이 자동으로 적용됩니다)</label>
      <select id="questionTypeSelect">
        <option value="지원동기" data-fw="PREP">지원동기</option>
        <option value="성격장점" data-fw="PREP">성격 장점</option>
        <option value="성격단점" data-fw="STAR">성격 단점</option>
        <option value="협업갈등" data-fw="STAR">협업·갈등 경험</option>
        <option value="도전경험" data-fw="STAR">도전·성과 경험</option>
        <option value="실패경험" data-fw="STAR-L">실패 경험</option>
        <option value="경력활동" data-fw="STAR">경력·활동사항</option>
        <option value="입사후포부" data-fw="PREP">입사 후 포부</option>
      </select>

      <label>자소서 문항</label>
      <textarea id="questionInput"></textarea>

      <label>작성한 답변</label>
      <textarea id="answerInput" style="min-height:160px" placeholder="여기에 자소서 답변을 붙여넣거나 작성해 주세요."></textarea>
      <div class="counter"><span id="charCount">0</span>자 작성됨</div>

      <details style="margin-top:14px">
        <summary style="cursor:pointer;font-weight:700;color:var(--navy);font-size:13px">선택 입력 — 채우면 첨삭이 더 정확해져요</summary>
        <div style="margin-top:10px">
          <label>이 답변으로 보여주고 싶었던 점 (자가진단, 선택)</label>
          <textarea id="selfIntentInput" placeholder="예) 저는 이 답변으로 위기 상황에서도 침착하게 대처하는 모습을 보여주고 싶었습니다."></textarea>

          <label>지원하는 채용공고의 핵심 내용 (선택)</label>
          <textarea id="jobPostingInput" placeholder="예) [○○기관] 사회복지사 채용 — 사례관리 경험자 우대, 공감·소통 역량 중시"></textarea>
        </div>
      </details>

      <div class="btn-row">
        <button class="btn-primary" id="submitBtn">첨삭 요청하기</button>
      </div>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  `;

  const answerInput = document.getElementById('answerInput');
  const charCount = document.getElementById('charCount');
  answerInput.addEventListener('input', () => { charCount.textContent = answerInput.value.length; });

  const questionTypeSelect = document.getElementById('questionTypeSelect');
  const questionInput = document.getElementById('questionInput');
  const updatePlaceholder = () => { questionInput.placeholder = QUESTION_EXAMPLES[questionTypeSelect.value] || ''; };
  updatePlaceholder();
  questionTypeSelect.addEventListener('change', updatePlaceholder);

  const presetSelect = document.getElementById('presetSelect');
  try {
    const { config } = await api('/api/config');
    presetSelect.innerHTML = config.presets.map(p =>
      `<option value="${p.id}" ${p.id === config.activePresetId ? 'selected' : ''}>${escapeHtml(p.name)}</option>`
    ).join('');
  } catch (e) {
    presetSelect.innerHTML = `<option value="default">기본</option>`;
  }

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const question = document.getElementById('questionInput').value.trim();
    const answer = answerInput.value.trim();
    const statusMsg = document.getElementById('statusMsg');
    const submitBtn = document.getElementById('submitBtn');

    if (!question || !answer) {
      statusMsg.textContent = '문항과 답변을 모두 입력해 주세요.';
      statusMsg.className = 'status-msg error';
      statusMsg.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '첨삭 초안 생성 중... (최대 1분)';
    statusMsg.style.display = 'none';

    try {
      const { config } = await api('/api/config').catch(() => ({ config: { presets: [] } }));
      const preset = (config.presets || []).find(p => p.id === presetSelect.value);

      const questionTypeSelect = document.getElementById('questionTypeSelect');
      const questionType = questionTypeSelect.value;
      const framework = questionTypeSelect.selectedOptions[0].dataset.fw;
      const selfIntent = document.getElementById('selfIntentInput').value.trim();
      const jobPosting = document.getElementById('jobPostingInput').value.trim();

      const aiDraft = await api('/api/feedback', {
        method: 'POST',
        body: JSON.stringify({ question, answer, presetPrompt: preset ? preset.prompt : '', framework, questionType, selfIntent, jobPosting })
      });

      await api('/api/reviews', {
        method: 'POST',
        body: JSON.stringify({ question, answer, presetId: presetSelect.value, framework, questionType, selfIntent, jobPosting, aiDraft })
      });

      statusMsg.textContent = '제출이 완료되었습니다. 강사님 검수 후 결과 링크를 보내드립니다.';
      statusMsg.className = 'status-msg';
      statusMsg.style.display = 'block';
      document.getElementById('questionInput').value = '';
      answerInput.value = '';
      document.getElementById('selfIntentInput').value = '';
      document.getElementById('jobPostingInput').value = '';
      charCount.textContent = '0';
    } catch (e) {
      statusMsg.textContent = '오류가 발생했습니다: ' + e.message;
      statusMsg.className = 'status-msg error';
      statusMsg.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '첨삭 요청하기';
    }
  });
}

const PRESET_LIBRARY = [
  { name: '사회복지학과', prompt: '사회복지 직무 특성상 공감·소통 역량, 사례관리·대상자 지원 경험, 윤리의식이 드러나는지 특히 중점적으로 봐 주세요. 대상자와의 관계 형성 경험이 있다면 구체적으로 짚어주세요.' },
  { name: '물리치료과', prompt: '물리치료사 직무 특성상 환자와의 신뢰 형성, 임상실습 경험, 의료진과의 협업·소통 역량이 드러나는지 확인해주세요.' },
  { name: '항공서비스', prompt: '항공서비스직 특성상 이미지메이킹(표정·태도), 위기대응 능력, 고객응대 경험이 구체적으로 드러나는지 확인해주세요.' },
  { name: '사무행정', prompt: '사무행정 직무 특성상 꼼꼼함, 문서작성·데이터 처리 경험, 협업 프로세스 이해도가 드러나는지 확인해주세요.' },
  { name: '직업상담사', prompt: '직업상담사 직무 특성상 상담·경청 역량, 노동시장에 대한 이해, 사례 개입 경험이 드러나는지 확인해주세요.' }
];

// ---------- 강사 화면 ----------
let currentTab = 'reviews';

async function renderTeacherView() {
  app.innerHTML = `
    <div class="tabs">
      <div class="tab" data-tab="reviews">검수 대기함</div>
      <div class="tab" data-tab="presets">첨삭 기준 프리셋</div>
      <div class="tab" data-tab="results">완료된 첨삭</div>
    </div>
    <div id="tabContent"></div>
  `;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === currentTab);
    t.addEventListener('click', () => { currentTab = t.dataset.tab; renderTeacherView(); });
  });

  const content = document.getElementById('tabContent');
  if (currentTab === 'reviews') await renderReviewsTab(content);
  else if (currentTab === 'presets') await renderPresetsTab(content);
  else await renderResultsTab(content);
}

async function renderReviewsTab(content) {
  content.innerHTML = `<div class="card"><h2>검수 대기함</h2><div id="reviewsList" class="empty">불러오는 중...</div></div>`;
  const listEl = document.getElementById('reviewsList');
  try {
    const { items } = await api('/api/reviews');
    if (!items.length) {
      listEl.innerHTML = `<div class="empty">대기 중인 첨삭이 없습니다.</div>`;
      return;
    }
    listEl.innerHTML = '';
    items.forEach(item => listEl.appendChild(buildReviewCard(item)));
  } catch (e) {
    listEl.innerHTML = `<div class="empty">불러오기 실패: ${escapeHtml(e.message)}</div>`;
  }
}

function jobMatchHtml(jm) {
  if (!jm) return '';
  return `<div class="field-block" style="background:var(--green-light);padding:10px 12px;border-radius:8px">
    <div class="fb-label">채용공고 매칭 — 일치도: ${escapeHtml(jm.matchLevel)}</div>
    <div class="star-row">
      ${(jm.matchedKeywords || []).map(k => `<span class="star-tag ok">✓ ${escapeHtml(k)}</span>`).join('')}
      ${(jm.missingKeywords || []).map(k => `<span class="star-tag miss">✗ ${escapeHtml(k)}</span>`).join('')}
    </div>
  </div>`;
}

function buildReviewCard(item) {
  const wrap = document.createElement('div');
  wrap.className = 'review-item';
  const d = item.aiDraft || {};
  const framework = d.frameworkUsed || item.framework || 'STAR';
  wrap.innerHTML = `
    <div class="meta">제출 시각: ${new Date(item.createdAt).toLocaleString('ko-KR')} · 진단 기준: ${framework}</div>
    <div class="field-block">
      <div class="fb-label">자소서 문항</div>
      <p style="white-space:pre-wrap">${escapeHtml(item.question)}</p>
    </div>
    <div class="field-block">
      <div class="fb-label">학생 답변</div>
      <p style="white-space:pre-wrap">${escapeHtml(item.answer)}</p>
    </div>
    <div class="star-row">${structureTagsHtml(framework, d.structure)}</div>
    <div class="star-row">${concretenessTagsHtml(d.concreteness)}</div>
    ${riskFlagsHtml(d.riskFlags)}
    ${jobMatchHtml(d.jobMatch)}
    ${item.selfIntent ? `<div class="field-block"><div class="fb-label">학생 자가진단 — 보여주고 싶었던 점</div><p>${escapeHtml(item.selfIntent)}</p></div>` : ''}
    ${d.intentGapComment ? `<div class="field-block" style="background:var(--warn-bg);padding:10px 12px;border-radius:8px"><div class="fb-label">자가진단 vs 실제 답변 코멘트</div><p>${escapeHtml(d.intentGapComment)}</p></div>` : ''}

    <div class="field-block" style="background:var(--navy-light);padding:10px 12px;border-radius:8px">
      <div class="fb-label">면접관 시점 — 이 답변으로 추론되는 평소 모습</div>
      <p>${escapeHtml(d.interviewerInference)}</p>
    </div>

    <label>강점 (수정 가능)</label>
    <textarea class="edit-strengths">${escapeHtml(d.strengths)}</textarea>
    <label>개선점 (수정 가능)</label>
    <textarea class="edit-improvements">${escapeHtml(d.improvements)}</textarea>
    <label>다듬은 문장 (수정 가능)</label>
    <textarea class="edit-polished" style="min-height:120px">${escapeHtml(d.polishedText)}</textarea>

    <label>예상 꼬리질문 · 이유형 (수정 가능)</label>
    <textarea class="edit-fu-reason">${escapeHtml((d.followUpQuestions || {}).reasonType)}</textarea>
    <label>예상 꼬리질문 · 대안형 (수정 가능)</label>
    <textarea class="edit-fu-alt">${escapeHtml((d.followUpQuestions || {}).alternativeType)}</textarea>
    <label>예상 꼬리질문 · 수치형 (수정 가능)</label>
    <textarea class="edit-fu-quant">${escapeHtml((d.followUpQuestions || {}).quantifyType)}</textarea>

    <div class="btn-row">
      <button class="btn-primary approve-btn">승인 및 링크 생성</button>
      <button class="btn-danger reject-btn">삭제</button>
    </div>
    <div class="link-box" style="display:none"></div>
  `;

  wrap.querySelector('.approve-btn').addEventListener('click', async (e) => {
    const btn = e.target;
    btn.disabled = true;
    btn.textContent = '처리 중...';
    try {
      const payload = {
        question: item.question,
        answer: item.answer,
        frameworkUsed: framework,
        structure: d.structure,
        concreteness: d.concreteness,
        riskFlags: d.riskFlags || [],
        interviewerInference: d.interviewerInference,
        jobMatch: d.jobMatch || null,
        intentGapComment: d.intentGapComment || null,
        missingElements: d.missingElements || [],
        strengths: wrap.querySelector('.edit-strengths').value,
        improvements: wrap.querySelector('.edit-improvements').value,
        polishedText: wrap.querySelector('.edit-polished').value,
        followUpQuestions: {
          reasonType: wrap.querySelector('.edit-fu-reason').value,
          alternativeType: wrap.querySelector('.edit-fu-alt').value,
          quantifyType: wrap.querySelector('.edit-fu-quant').value
        }
      };
      const { id } = await api('/api/results', { method: 'POST', body: JSON.stringify(payload) });
      await api('/api/reviews?id=' + item.id, { method: 'DELETE' });

      const link = location.origin + location.pathname + '#result=' + id;
      const linkBox = wrap.querySelector('.link-box');
      linkBox.style.display = 'flex';
      linkBox.innerHTML = `<span>학생 결과 링크:</span> <a href="${link}" target="_blank">${link}</a>
        <button class="btn-secondary" style="margin-left:auto" onclick="navigator.clipboard.writeText('${link}')">복사</button>`;
      btn.textContent = '승인 완료';
    } catch (err) {
      alert('오류: ' + err.message);
      btn.disabled = false;
      btn.textContent = '승인 및 링크 생성';
    }
  });

  wrap.querySelector('.reject-btn').addEventListener('click', async () => {
    if (!confirm('이 검수 항목을 삭제할까요?')) return;
    await api('/api/reviews?id=' + item.id, { method: 'DELETE' });
    wrap.remove();
  });

  return wrap;
}

async function renderPresetsTab(content) {
  content.innerHTML = `
    <div class="card">
      <h2>추천 프리셋 라이브러리</h2>
      <div style="font-size:13px;color:var(--muted);margin-bottom:10px">자주 쓰이는 직군별 평가기준입니다. 클릭하면 바로 추가됩니다.</div>
      <div id="libraryList"></div>
    </div>
    <div class="card">
      <h2>첨삭 기준 프리셋 관리</h2>
      <div id="presetList" class="empty">불러오는 중...</div>
      <label>새 프리셋 이름</label>
      <input type="text" id="newPresetName" placeholder="예) 사회복지학과, 항공서비스과, 직설적인 톤 등">
      <label>추가 지침 (톤·평가기준·직군 특성 등을 문장으로 작성)</label>
      <textarea id="newPresetPrompt" placeholder="예) 사회복지 직무 특성상 공감·소통 역량이 드러나는지 특히 중점적으로 봐 주세요."></textarea>
      <div class="btn-row"><button class="btn-primary" id="addPresetBtn">프리셋 추가</button></div>
    </div>
  `;

  let config = { presets: [], activePresetId: 'default' };
  try {
    const r = await api('/api/config');
    config = r.config;
  } catch (e) { /* 기본값 사용 */ }

  const libraryEl = document.getElementById('libraryList');
  libraryEl.innerHTML = PRESET_LIBRARY.map((lib, i) => {
    const already = config.presets.some(p => p.name === lib.name);
    return `<div class="preset-item">
      <div><b>${escapeHtml(lib.name)}</b><div style="font-size:12px;color:var(--muted);margin-top:2px">${escapeHtml(lib.prompt)}</div></div>
      <button class="btn-secondary lib-add-btn" data-i="${i}" ${already ? 'disabled' : ''}>${already ? '추가됨' : '추가하기'}</button>
    </div>`;
  }).join('');
  libraryEl.querySelectorAll('.lib-add-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const lib = PRESET_LIBRARY[btn.dataset.i];
      config.presets.push({ id: 'p_' + Date.now(), name: lib.name, prompt: lib.prompt });
      await api('/api/config', { method: 'POST', body: JSON.stringify(config) });
      renderPresetsTab(content);
    });
  });

  renderPresetList(config);

  document.getElementById('addPresetBtn').addEventListener('click', async () => {
    const name = document.getElementById('newPresetName').value.trim();
    const prompt = document.getElementById('newPresetPrompt').value.trim();
    if (!name) { alert('프리셋 이름을 입력해 주세요.'); return; }
    const id = 'p_' + Date.now();
    config.presets.push({ id, name, prompt });
    await api('/api/config', { method: 'POST', body: JSON.stringify(config) });
    renderPresetsTab(content);
  });

  function renderPresetList(cfg) {
    const listEl = document.getElementById('presetList');
    if (!cfg.presets.length) { listEl.innerHTML = `<div class="empty">등록된 프리셋이 없습니다.</div>`; return; }
    listEl.innerHTML = '';
    cfg.presets.forEach(p => {
      const row = document.createElement('div');
      row.className = 'preset-item';
      row.innerHTML = `
        <div><b>${escapeHtml(p.name)}</b>${p.id === cfg.activePresetId ? ' <span class="star-tag ok">기본값</span>' : ''}
          <div style="font-size:12px;color:var(--muted);margin-top:2px">${escapeHtml(p.prompt) || '(추가 지침 없음)'}</div>
        </div>
        <div class="btn-row" style="margin:0">
          <button class="btn-secondary set-default-btn">기본값으로</button>
          <button class="btn-danger delete-btn">삭제</button>
        </div>
      `;
      row.querySelector('.set-default-btn').addEventListener('click', async () => {
        cfg.activePresetId = p.id;
        await api('/api/config', { method: 'POST', body: JSON.stringify(cfg) });
        renderPresetsTab(content);
      });
      row.querySelector('.delete-btn').addEventListener('click', async () => {
        if (p.id === 'default') { alert('기본 프리셋은 삭제할 수 없습니다.'); return; }
        cfg.presets = cfg.presets.filter(x => x.id !== p.id);
        await api('/api/config', { method: 'POST', body: JSON.stringify(cfg) });
        renderPresetsTab(content);
      });
      listEl.appendChild(row);
    });
  }
}

async function renderResultsTab(content) {
  content.innerHTML = `<div class="card"><h2>완료된 첨삭 목록</h2><div id="resultsList" class="empty">불러오는 중...</div></div>`;
  const listEl = document.getElementById('resultsList');
  try {
    const { items } = await api('/api/results?list=1');
    if (!items.length) { listEl.innerHTML = `<div class="empty">완료된 첨삭이 없습니다.</div>`; return; }
    listEl.innerHTML = items.map(it => {
      const link = location.origin + location.pathname + '#result=' + it.id;
      return `<div class="preset-item">
        <div>${escapeHtml(it.question).slice(0, 40)}...<div style="font-size:12px;color:var(--muted)">${new Date(it.approvedAt).toLocaleString('ko-KR')}</div></div>
        <a href="${link}" target="_blank" class="btn-secondary" style="text-decoration:none;padding:8px 14px;border-radius:8px">결과 보기</a>
      </div>`;
    }).join('');
  } catch (e) {
    listEl.innerHTML = `<div class="empty">불러오기 실패: ${escapeHtml(e.message)}</div>`;
  }
}

// ---------- 학생 결과 열람 화면 ----------

  try {
    const { item } = await api('/api/results?id=' + encodeURIComponent(id));
    app.innerHTML = `
      <div class="card">
        <h2>첨삭 결과</h2>
        <div class="result-block">
          <h3>자소서 문항</h3>
          <p style="white-space:pre-wrap">${escapeHtml(item.question)}</p>
        </div>
        <div class="result-block">
          <h3>제출한 답변</h3>
          <p style="white-space:pre-wrap">${escapeHtml(item.answer)}</p>
        </div>
        <div class="result-block">
          <h3>${(item.frameworkUsed || 'STAR')} 구조 진단</h3>
          <div class="star-row">${structureTagsHtml(item.frameworkUsed || 'STAR', item.structure)}</div>
          <div class="star-row">${concretenessTagsHtml(item.concreteness)}</div>
          ${riskFlagsHtml(item.riskFlags)}
        </div>
        ${item.jobMatch ? `<div class="result-block"><h3>채용공고 매칭도</h3>${jobMatchHtml(item.jobMatch)}</div>` : ''}
        ${item.intentGapComment ? `<div class="result-block"><h3>내가 밝힌 의도 vs 실제 답변</h3><p style="white-space:pre-wrap;background:var(--warn-bg);padding:12px;border-radius:8px">${escapeHtml(item.intentGapComment)}</p></div>` : ''}
        <div class="result-block">
          <h3>면접관 시점 — 이 답변으로 추론되는 평소 모습</h3>
          <p style="white-space:pre-wrap;background:var(--navy-light);padding:12px;border-radius:8px">${escapeHtml(item.interviewerInference)}</p>
        </div>
        <div class="result-block">
          <h3>잘된 점</h3>
          <p style="white-space:pre-wrap">${escapeHtml(item.strengths)}</p>
        </div>
        <div class="result-block">
          <h3>개선 방향</h3>
          <p style="white-space:pre-wrap">${escapeHtml(item.improvements)}</p>
        </div>
        <div class="result-block">
          <h3>다듬은 문장 제안</h3>
          <p style="white-space:pre-wrap;background:var(--green-light);padding:12px;border-radius:8px">${escapeHtml(item.polishedText)}</p>
        </div>
        <div class="result-block">
          <h3>예상 꼬리질문 (면접 대비)</h3>
          ${followUpHtml(item.followUpQuestions)}
        </div>
      </div>
    `;
  } catch (e) {
    app.innerHTML = `<div class="card"><div class="empty">결과를 불러올 수 없습니다: ${escapeHtml(e.message)}</div></div>`;
  }
}

route();
</script>
