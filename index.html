<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자소서·이력서 첨삭 — 진로모아커리어센터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#ffffff;
    --text:#1a2130;
    --muted:#6b7280;
    --green:#6338EE;
    --green-light:#EDE8FE;
    --navy:#10288C;
    --navy-light:#E3E9FB;
    --border:#e2e5ea;
    --warn:#b45309;
    --warn-bg:#fef3e2;
    --ok:#1b4332;
    --ok-bg:#e8f0ec;
    --miss:#b91c1c;
    --miss-bg:#fdecec;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard','맑은 고딕','Malgun Gothic',-apple-system,sans-serif;
    line-height:1.6;
  }
  header{
    background:var(--green);
    color:#fff;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  header .header-sub{
    font-size:12px;
    color:rgba(255,255,255,.65);
    margin-bottom:4px;
    letter-spacing:.2px;
    display:flex;
    align-items:center;
    gap:5px;
  }
  header .header-sub .brand-logo{
    width:14px;
    height:14px;
    flex-shrink:0;
  }
  header .header-sub .brand-name{
    color:#B6DB00;
    font-weight:700;
  }
  header h1{
    font-size:20px;
    margin:0;
    font-weight:600;
  }
  header .badge{
    font-size:12px;
    font-weight:700;
    background:#EAF6AD;
    color:#10288C;
    padding:4px 10px;
    border-radius:999px;
  }
  body.role-teacher header .badge{
    background:#B6DB00;
    color:#10288C;
  }
  /* 학생용: 같은 그린 톤이지만 연하게 — 강사용: 원래의 진한 그린 유지 */
  body.role-student header{
    background:var(--green-light);
    color:var(--green);
  }
  body.role-student header .header-sub{
    color:#5b8570;
  }
  body.role-student header .brand-name{
    color:var(--green);
  }
  body.role-student header .brand-logo{
    filter:brightness(0) saturate(100%);
    opacity:0.75;
  }
  main{
    max-width:880px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  .card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    margin-bottom:18px;
  }
  .card h2{
    font-size:16px;
    color:var(--navy);
    margin:0 0 14px;
    border-left:4px solid var(--green);
    padding-left:10px;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--navy);
    margin:12px 0 6px;
  }
  select, textarea, input[type=text]{
    width:100%;
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    font-family:inherit;
    font-size:14px;
    color:#1a2130;
    background:#ffffff;
    resize:vertical;
  }
  textarea{min-height:90px;}
  .counter{
    text-align:right;
    font-size:12px;
    color:var(--muted);
    margin-top:4px;
  }
  button{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    border:none;
    border-radius:8px;
    padding:10px 18px;
    cursor:pointer;
  }
  .btn-primary{background:var(--green); color:#fff;}
  .btn-primary:disabled{background:#9db8ad; cursor:not-allowed;}
  .btn-secondary{background:var(--navy-light); color:var(--navy);}
  .btn-danger{background:var(--miss-bg); color:var(--miss);}
  .btn-row{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  .tab{
    padding:8px 14px;
    border-radius:8px 8px 0 0;
    background:var(--navy-light);
    color:var(--navy);
    cursor:pointer;
    font-size:13px;
    font-weight:700;
  }
  .tab.active{background:var(--navy); color:#fff;}
  .status-msg{
    margin-top:14px;
    padding:12px 14px;
    border-radius:8px;
    font-size:13px;
    background:var(--green-light);
    color:var(--green);
    display:none;
  }
  .status-msg.error{background:var(--miss-bg); color:var(--miss);}
  .star-row{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;}
  .star-tag{
    font-size:12px;
    font-weight:700;
    padding:4px 10px;
    border-radius:999px;
  }
  .star-tag.ok{background:var(--ok-bg); color:var(--ok);}
  .star-tag.miss{background:var(--miss-bg); color:var(--miss);}
  .review-item{
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    margin-bottom:14px;
  }
  .review-item .meta{font-size:12px; color:var(--muted); margin-bottom:8px;}
  .field-block{margin-bottom:10px;}
  .field-block .fb-label{font-size:12px; font-weight:700; color:var(--muted); margin-bottom:4px;}
  .preset-item{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  .preset-item > div:first-child{
    flex:1 1 220px;
    min-width:0;
  }
  .preset-item > .btn-row{
    flex:0 0 auto;
  }
  .link-box{
    display:flex;
    gap:8px;
    align-items:center;
    background:var(--green-light);
    border-radius:8px;
    padding:10px 12px;
    margin-top:10px;
    word-break:break-all;
    font-size:13px;
  }
  .empty{color:var(--muted); font-size:13px; padding:10px 0;}
  .result-block{margin-bottom:18px;}
  .result-block h3{font-size:14px; color:var(--navy); margin:0 0 6px;}
  .result-block p{margin:0; font-size:14px;}
</style>
</head>

<script>
const params = new URLSearchParams(location.search);
const isAdmin = params.get('admin') === '1';
let TEACHER_ID = (params.get('t') || '').trim().toLowerCase().replace(/[^a-z0-9가-힣_-]/g, '').slice(0, 40);
document.getElementById('roleBadge').textContent = (isAdmin ? '강사용' : '학생용') + (TEACHER_ID ? ' · ' + TEACHER_ID : '');
document.body.classList.add(isAdmin ? 'role-teacher' : 'role-student');
document.getElementById('header-title').addEventListener('click', () => {
  location.href = location.pathname + '?t=' + encodeURIComponent(TEACHER_ID) + (isAdmin ? '&admin=1' : '');
});

const app = document.getElementById('app');

// ---------- 공통 유틸 ----------
async function api(path, options = {}) {
  // 강사별 데이터 분리를 위해 /api/config, /api/reviews, /api/results 호출에는
  // 항상 t(강사 코드)를 쿼리 파라미터로 자동 첨부함 (호출부를 일일이 고칠 필요 없게)
  let finalPath = path;
  if (/^\/api\/(config|reviews|results)/.test(path)) {
    const sep = path.includes('?') ? '&' : '?';
    finalPath = path + sep + 't=' + encodeURIComponent(TEACHER_ID);
  }
  const res = await fetch(finalPath, {
    ...options,
    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    const msg = (err.error || ('요청 실패: ' + res.status)) + (err.detail ? ' — 상세: ' + err.detail : '');
    throw new Error(msg);
  }
  return res.json();
}

const FRAMEWORK_LABELS = {
  STAR: { situation: '상황(S)', task: '과제(T)', action: '행동(A)', result: '결과(R)' },
  'STAR-L': { situation: '상황(S)', task: '과제(T)', action: '행동(A)', result: '결과+배움(R-L)' },
  PREP: { point: '주장(P)', reason: '근거(R)', example: '사례(E)', pointAgain: '재강조(P)' },
  RESUME: { actionVerbStart: '행동동사 시작', quantifiedResult: '정량적 성과', concise: '간결성', jobKeyword: '직무 키워드' }
};

function structureTagsHtml(framework, structure) {
  const labels = FRAMEWORK_LABELS[framework] || FRAMEWORK_LABELS.STAR;
  return Object.keys(labels).map(k => {
    const ok = structure && structure[k];
    return `<span class="star-tag ${ok ? 'ok' : 'miss'}">${labels[k]} ${ok ? '충족' : '보완필요'}</span>`;
  }).join('');
}

function concretenessTagsHtml(c) {
  if (!c) return '';
  const labels = { hasNumber: '숫자 포함', hasProperNoun: '고유명사 포함', hasJobKeyword: '직무 키워드 포함' };
  return Object.keys(labels).map(k => {
    const ok = c[k];
    return `<span class="star-tag ${ok ? 'ok' : 'miss'}">${labels[k]} ${ok ? 'O' : 'X'}</span>`;
  }).join('');
}

function riskFlagsHtml(flags) {
  if (!flags || !flags.length) return '';
  const labelMap = {
    복사붙여넣기형: '복사·붙여넣기형(회사·직무명 오류 의심)',
    완벽한AI스타일형: '완벽한 AI 스타일형(개인 경험 부족)',
    동문서답형: '동문서답형(핵심 키워드·수치 부족)',
    추상적표현남발형: '추상적 표현 남발형',
    근거부족나열형: '근거 부족 주장 나열형'
  };
  return `<div style="margin:10px 0">${flags.map(f =>
    `<span class="star-tag miss" style="background:var(--warn-bg);color:var(--warn)">⚠ ${labelMap[f] || f}</span>`
  ).join(' ')}</div>`;
}

function aiTracePhrasesHtml(phrases) {
  if (!phrases || !phrases.length) return '';
  return `<div class="field-block" style="background:var(--miss-bg);padding:10px 12px;border-radius:8px">
    <div class="fb-label">🤖 AI스러운 문구 콕 집어보기</div>
    ${phrases.map(p => `
      <div style="margin-top:8px">
        <span style="text-decoration:underline wavy var(--miss);font-weight:700">"${escapeHtml(p.phrase)}"</span>
        <p style="margin:4px 0 0;font-size:13px">${escapeHtml(p.note)}</p>
      </div>
    `).join('')}
  </div>`;
}

function followUpHtml(fu) {
  if (!fu) return '';
  const labels = { reasonType: '이유형', alternativeType: '대안형', quantifyType: '수치형' };
  return Object.keys(labels).map(k =>
    `<div class="field-block"><div class="fb-label">꼬리질문 · ${labels[k]}</div><p>${escapeHtml(fu[k])}</p></div>`
  ).join('');
}

function escapeHtml(str) {
  return (str || '').replace(/[&<>"']/g, s => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[s]));
}

function extractCharLimit(questionText) {
  const match = (questionText || '').match(/(\d{2,5})\s*자/);
  return match ? parseInt(match[1], 10) : null;
}

// ---------- 라우팅 ----------
function renderTeacherSetup() {
  app.innerHTML = `
    <div class="card">
      <h2>강사 코드 설정</h2>
      <p>여러 강사님이 같은 앱을 함께 쓰기 때문에, 자료가 서로 섞이지 않도록 <b>본인만의 고유 코드</b>가 필요합니다. 영문·숫자로 짧게 만들어 주세요 (예: kimteacher, park01). 한 번 정하시면 계속 같은 코드로 접속하시면 됩니다.</p>
      <label>강사 이름</label>
      <input type="text" id="teacherNameInput" placeholder="예: 김강사">

  `;

    const code = document.getElementById('teacherCodeInput').value.trim().toLowerCase().replace(/[^a-z0-9가-힣_-]/g, '');
    const name = document.getElementById('teacherNameInput').value.trim();
    const inviteCode = document.getElementById('teacherInviteInput').value.trim();
    const errEl = document.getElementById('teacherSetupError');
    const btn = document.getElementById('setTeacherBtn');
    errEl.style.display = 'none';
    if (!code) { errEl.textContent = '코드를 입력해 주세요.'; errEl.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = '확인 중...';
    try {
      const res = await fetch('/api/teacher-registry', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, name, inviteCode, app: '자소서·이력서 첨삭' })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '등록에 실패했습니다.');
      const p = new URLSearchParams(location.search);
      p.set('admin', '1');
      p.set('t', code);
      location.href = location.pathname + '?' + p.toString();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = '시작하기';
    }
  });
}

function route() {
  const params = new URLSearchParams(location.search);
  if (params.get('master') === '1') {
    document.body.classList.add('role-teacher');
    document.getElementById('roleBadge').textContent = '관리자';
    renderMasterTeacherList();
    return;
  }
  const hash = location.hash;
  if (hash.indexOf('#result=') === 0) {
    if (!TEACHER_ID) { renderMissingTeacherNotice(); return; }
    const id = hash.replace('#result=', '');
    renderResultView(id);
  } else if (isAdmin) {
    if (!TEACHER_ID) { renderTeacherSetup(); return; }
    renderTeacherView();
  } else {
    if (!TEACHER_ID) { renderMissingTeacherNotice(); return; }
    renderStudentView();
  }
}
window.addEventListener('hashchange', route);

function wireItemBlock(id, docTypeSelect) {
  const block = document.querySelector(`.item-block[data-item-id="${id}"]`);
  const questionInput = block.querySelector('.item-question');
  const answerInput = block.querySelector('.item-answer');
  const counterBox = block.querySelector('.item-char-counter');
  const questionTypeSelect = block.querySelector('.item-questionType');

  function updateCounter() {
    const len = answerInput.value.length;
    const limit = extractCharLimit(questionInput.value);
    if (limit) {
      const over = len > limit;
      counterBox.innerHTML = `<span class="item-char-count">${len}</span>자 작성됨 / <b>${limit}자 제한</b>${over ? ` <span style="color:var(--miss);font-weight:700">(${len - limit}자 초과!)</span>` : ''}`;
      counterBox.style.color = over ? 'var(--miss)' : '';
    } else {
      counterBox.innerHTML = `<span class="item-char-count">${len}</span>자 작성됨`;
      counterBox.style.color = '';
    }
  }
  answerInput.addEventListener('input', updateCounter);
  questionInput.addEventListener('input', updateCounter);

  const updatePlaceholder = () => { questionInput.placeholder = QUESTION_EXAMPLES[questionTypeSelect.value] || ''; };
  updatePlaceholder();
  questionTypeSelect.addEventListener('change', () => { updatePlaceholder(); updateCounter(); });

  applyDocTypeToBlock(id, docTypeSelect.value);

  block.querySelector('.item-remove-btn').addEventListener('click', () => {
    const allBlocks = document.querySelectorAll('.item-block');
    if (allBlocks.length <= 1) { alert('최소 1개의 문항은 있어야 해요.'); return; }
    block.remove();
  });
}

function applyDocTypeToBlock(id, docTypeVal) {
  const block = document.querySelector(`.item-block[data-item-id="${id}"]`);
  const typeRow = block.querySelector('.item-questionType-row');
  const qLabel = block.querySelector('.item-question-label');
  const aLabel = block.querySelector('.item-answer-label');
  const questionInput = block.querySelector('.item-question');
  const answerInput = block.querySelector('.item-answer');
  const questionTypeSelect = block.querySelector('.item-questionType');
  if (docTypeVal === 'cv') {
    typeRow.style.display = 'none';
    qLabel.textContent = '경력·활동 항목명';
    questionInput.placeholder = '예) 마케팅 서포터즈 활동 (2024.03~2024.08)';
    aLabel.textContent = '작성한 한 줄 소개 (경력기술서 문장)';

  } else {
    typeRow.style.display = '';

    questionInput.placeholder = QUESTION_EXAMPLES[questionTypeSelect.value] || '';
    aLabel.textContent = '작성한 답변';

  }
}

      `<option value="${p.id}" ${p.id === config.activePresetId ? 'selected' : ''}>${escapeHtml(p.name)}</option>`
    ).join('');

    presetSelect.innerHTML = `<option value="default">기본</option>`;
  }

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const studentName = document.getElementById('studentNameInput').value.trim();
    const studentEmail = document.getElementById('studentEmailInput').value.trim();
    const jobPosting = document.getElementById('jobPostingInput').value.trim();
    const statusMsg = document.getElementById('statusMsg');
    const submitBtn = document.getElementById('submitBtn');

    if (!studentName) {
      statusMsg.textContent = '이름을 입력해 주세요.';
      statusMsg.className = 'status-msg error';
      statusMsg.style.display = 'block';
      return;
    }

    const blocks = Array.from(document.querySelectorAll('.item-block'));
    const rawItems = blocks.map(b => ({
      question: b.querySelector('.item-question').value.trim(),
      answer: b.querySelector('.item-answer').value.trim(),
      questionType: isCv ? '이력서항목' : b.querySelector('.item-questionType').value,
      framework: isCv ? 'RESUME' : b.querySelector('.item-questionType').selectedOptions[0].dataset.fw,
      selfIntent: b.querySelector('.item-selfIntent').value.trim(),
      previousAnswer: b.querySelector('.item-prevAnswer').value.trim(),
      charLimit: extractCharLimit(b.querySelector('.item-question').value)
    }));

    if (rawItems.some(it => !it.question || !it.answer)) {
      statusMsg.textContent = '모든 문항에 문항 내용과 답변을 입력해 주세요.';
      statusMsg.className = 'status-msg error';
      statusMsg.style.display = 'block';

    submitBtn.textContent = `첨삭 초안 생성 중... (문항 ${rawItems.length}개, 최대 ${rawItems.length}분)`;

      const { config } = await api('/api/config').catch(() => ({ config: { presets: [] } }));
      const preset = (config.presets || []).find(p => p.id === presetSelect.value);

      const itemsWithDraft = await Promise.all(rawItems.map(async (it) => {
        const aiDraft = await api('/api/feedback', {
          method: 'POST',
          body: JSON.stringify({ ...it, presetPrompt: preset ? preset.prompt : '', jobPosting })
        });
        return { ...it, aiDraft };
      }));

      const reviewRes = await api('/api/reviews', {
        method: 'POST',
        body: JSON.stringify({ studentName, studentEmail, presetId: presetSelect.value, docType: docTypeSelect.value, jobPosting, items: itemsWithDraft })
      });

      localStorage.setItem(countKey, String(usedCount + 1));

      statusMsg.innerHTML = `
        제출이 완료되었습니다. 강사님 검수 후 결과를 확인하실 수 있어요.<br>

function diffWords(oldStr, newStr) {
  const a = (oldStr || '').split(/\s+/).filter(Boolean);
  const b = (newStr || '').split(/\s+/).filter(Boolean);
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) {
    for (let j = n - 1; j >= 0; j--) {
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  let i = 0, j = 0;
  const ops = [];
  while (i < m && j < n) {
    if (a[i] === b[j]) { ops.push({ type: 'same', text: a[i] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ type: 'removed', text: a[i] }); i++; }
    else { ops.push({ type: 'added', text: b[j] }); j++; }
  }
  while (i < m) { ops.push({ type: 'removed', text: a[i] }); i++; }
  while (j < n) { ops.push({ type: 'added', text: b[j] }); j++; }
  return ops;
}

function diffHtml(oldStr, newStr) {
  if (!oldStr) return '';
  return diffWords(oldStr, newStr).map(o => {
    if (o.type === 'same') return escapeHtml(o.text);
    if (o.type === 'removed') return `<span style="text-decoration:line-through;color:var(--miss);background:var(--miss-bg);padding:0 2px;border-radius:3px">${escapeHtml(o.text)}</span>`;
    return `<span style="color:var(--ok);background:var(--ok-bg);padding:0 2px;border-radius:3px;font-weight:700">${escapeHtml(o.text)}</span>`;
  }).join(' ');
}

      <textarea class="edit-strengths" data-idx="${idx}">${escapeHtml(d.strengths)}</textarea>
      <label>개선점 (수정 가능)</label>
      <textarea class="edit-improvements" data-idx="${idx}">${escapeHtml(d.improvements)}</textarea>
      <label>다듬은 문장 (수정 가능)</label>
      <textarea class="edit-polished" data-idx="${idx}" style="min-height:120px">${escapeHtml(d.polishedText)}</textarea>

      <label>예상 꼬리질문 · 이유형 (수정 가능)</label>
      <textarea class="edit-fu-reason" data-idx="${idx}">${escapeHtml((d.followUpQuestions || {}).reasonType)}</textarea>
      <label>예상 꼬리질문 · 대안형 (수정 가능)</label>
      <textarea class="edit-fu-alt" data-idx="${idx}">${escapeHtml((d.followUpQuestions || {}).alternativeType)}</textarea>
      <label>예상 꼬리질문 · 수치형 (수정 가능)</label>
      <textarea class="edit-fu-quant" data-idx="${idx}">${escapeHtml((d.followUpQuestions || {}).quantifyType)}</textarea>
    </div>
  `;
}

function buildReviewCard(record, presetName) {
  const wrap = document.createElement('div');
  wrap.className = 'review-item';
  const items = record.items || [];
  wrap.innerHTML = `
    <details>
      <summary style="cursor:pointer">
        <span style="font-weight:700;color:var(--navy);font-size:15px">${escapeHtml(record.studentName) || '(이름 없음)'}</span>
        <span class="star-tag ok" style="margin-left:6px">${escapeHtml(presetName || '기본')}</span>
        <span style="font-size:12px;color:var(--muted);margin-left:8px">문항 ${items.length}개 · 코드 ${escapeHtml(record.code) || '-'} · ${new Date(record.createdAt).toLocaleString('ko-KR')} · 클릭해서 펼치기</span>
      </summary>
      <div style="margin-top:14px">
        ${record.jobPosting ? `<div class="field-block"><div class="fb-label">지원 채용공고 핵심 내용 (전체 문항 공통)</div><p style="white-space:pre-wrap">${escapeHtml(record.jobPosting)}</p></div>` : ''}
        ${items.map((it, idx) => reviewItemBlockHtml(it, idx)).join('')}
        <div class="btn-row">
          <button class="btn-primary approve-btn">전체 승인 및 링크 생성</button>
          <button class="btn-danger reject-btn">삭제</button>
        </div>
        <div class="link-box" style="display:none"></div>
      </div>
    </details>
  `;

  wrap.querySelector('.approve-btn').addEventListener('click', async (e) => {
    const btn = e.target;
    btn.disabled = true;
    btn.textContent = '처리 중...';
    try {
      const finalItems = items.map((it, idx) => {
        const d = it.aiDraft || {};
        const framework = d.frameworkUsed || it.framework || 'STAR';
        return {
          questionType: it.questionType,
          question: it.question,
          answer: it.answer,
          frameworkUsed: framework,
          structure: d.structure,
          concreteness: d.concreteness,
          riskFlags: d.riskFlags || [],
          aiTracePhrases: d.aiTracePhrases || [],
          interviewerInference: d.interviewerInference,
          jobMatch: d.jobMatch || null,
          intentGapComment: d.intentGapComment || null,
          previousAnswer: it.previousAnswer || null,
          revisionComment: d.revisionComment || null,
          charLimit: it.charLimit || null,
          charLimitNote: d.charLimitNote || null,
          missingElements: d.missingElements || [],
          strengths: wrap.querySelector(`.edit-strengths[data-idx="${idx}"]`).value,
          improvements: wrap.querySelector(`.edit-improvements[data-idx="${idx}"]`).value,
          polishedText: wrap.querySelector(`.edit-polished[data-idx="${idx}"]`).value,
          followUpQuestions: {
            reasonType: wrap.querySelector(`.edit-fu-reason[data-idx="${idx}"]`).value,
            alternativeType: wrap.querySelector(`.edit-fu-alt[data-idx="${idx}"]`).value,
            quantifyType: wrap.querySelector(`.edit-fu-quant[data-idx="${idx}"]`).value
          }
        };
      });

      const payload = {
        studentName: record.studentName || '',
        studentEmail: record.studentEmail || '',
        code: record.code || '',
        presetName: presetName || '기본',
        docType: record.docType || 'resume',
        jobPosting: record.jobPosting || '',
        items: finalItems
      };
      const { id } = await api('/api/results', { method: 'POST', body: JSON.stringify(payload) });
      await api('/api/reviews?id=' + record.id, { method: 'DELETE' });

      const link = location.origin + location.pathname + '?t=' + encodeURIComponent(TEACHER_ID) + '#result=' + id;
      const linkBox = wrap.querySelector('.link-box');
      linkBox.style.display = 'flex';
      linkBox.innerHTML = `<span>학생 결과 링크:</span> <a href="${link}" target="_blank">${link}</a>
        <button class="btn-secondary" style="margin-left:auto" onclick="navigator.clipboard.writeText('${link}')">복사</button>`;
      btn.textContent = '승인 완료';
    } catch (err) {
      alert('오류: ' + err.message);
      btn.disabled = false;
      btn.textContent = '전체 승인 및 링크 생성';
    }
  });

  wrap.querySelector('.reject-btn').addEventListener('click', async () => {
    if (!confirm('이 검수 항목을 삭제할까요?')) return;
    await api('/api/reviews?id=' + record.id, { method: 'DELETE' });
    wrap.remove();
  });

  return wrap;
}

async function renderPresetsTab(content) {
  content.innerHTML = `
    <div class="card">
      <details>
        <summary style="cursor:pointer;font-weight:700;color:var(--navy)">추천 프리셋 라이브러리 (클릭해서 펼치기)</summary>
        <div style="font-size:13px;color:var(--muted);margin:10px 0">자주 쓰이는 직군별 평가기준입니다. 클릭하면 바로 추가됩니다.</div>
        <div id="libraryList"></div>
      </details>
    </div>
    <div class="card">
      <h2>첨삭 기준 프리셋 관리</h2>
      <details open>
        <summary style="cursor:pointer;font-weight:700;color:var(--navy)">등록된 프리셋 목록 (클릭해서 접기/펼치기)</summary>
        <div id="presetList" class="empty" style="margin-top:10px">불러오는 중...</div>
      </details>
      <label>새 프리셋 이름</label>
      <input type="text" id="newPresetName" placeholder="예) 사회복지학과, 항공서비스과, 직설적인 톤 등">
      <label>추가 지침 (톤·평가기준·직군 특성 등을 문장으로 작성)</label>
      <textarea id="newPresetPrompt" placeholder="예) 사회복지 직무 특성상 공감·소통 역량이 드러나는지 특히 중점적으로 봐 주세요."></textarea>
      <div class="btn-row"><button class="btn-primary" id="addPresetBtn">프리셋 추가</button></div>
    </div>
  `;

  let config = { presets: [], activePresetId: 'default' };
  try {
    const r = await api('/api/config');
    config = r.config;
  } catch (e) { /* 기본값 사용 */ }

  const libraryEl = document.getElementById('libraryList');
  libraryEl.innerHTML = PRESET_LIBRARY.map((lib, i) => {
    const already = config.presets.some(p => p.name === lib.name);
    return `<div class="preset-item">
      <div><b>${escapeHtml(lib.name)}</b><div style="font-size:12px;color:var(--muted);margin-top:2px">${escapeHtml(lib.prompt)}</div></div>
      <button class="btn-secondary lib-add-btn" data-i="${i}" ${already ? 'disabled' : ''}>${already ? '추가됨' : '추가하기'}</button>
    </div>`;
  }).join('');
  libraryEl.querySelectorAll('.lib-add-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const lib = PRESET_LIBRARY[btn.dataset.i];
      config.presets.push({ id: 'p_' + Date.now(), name: lib.name, prompt: lib.prompt });
      await api('/api/config', { method: 'POST', body: JSON.stringify(config) });
      renderPresetsTab(content);
    });
  });

  renderPresetList(config);

  document.getElementById('addPresetBtn').addEventListener('click', async () => {
    const name = document.getElementById('newPresetName').value.trim();
    const prompt = document.getElementById('newPresetPrompt').value.trim();
    if (!name) { alert('프리셋 이름을 입력해 주세요.'); return; }
    const id = 'p_' + Date.now();
    config.presets.push({ id, name, prompt });
    await api('/api/config', { method: 'POST', body: JSON.stringify(config) });
    renderPresetsTab(content);
  });

  function renderPresetList(cfg) {
    const listEl = document.getElementById('presetList');
    if (!cfg.presets.length) { listEl.innerHTML = `<div class="empty">등록된 프리셋이 없습니다.</div>`; return; }
    listEl.innerHTML = '';
    cfg.presets.forEach(p => {
      const row = document.createElement('div');
      row.className = 'preset-item';
      row.innerHTML = `
        <div style="flex:1 1 100%;min-width:0">
          <b>${escapeHtml(p.name)}</b>${p.id === cfg.activePresetId ? ' <span class="star-tag ok">기본값</span>' : ''}
          <div class="prompt-display" style="font-size:12px;color:var(--muted);margin-top:2px">${escapeHtml(p.prompt) || '(추가 지침 없음)'}</div>
          <div class="prompt-edit" style="display:none;margin-top:6px">
            <textarea class="prompt-edit-input" style="min-height:70px">${escapeHtml(p.prompt)}</textarea>
            <div class="btn-row" style="margin-top:6px">
              <button class="btn-primary save-prompt-btn">저장</button>
              <button class="btn-secondary cancel-edit-btn">취소</button>
            </div>
          </div>
        </div>
        <div class="btn-row" style="margin:0">
          <button class="btn-secondary edit-prompt-btn">지침 수정</button>
          <button class="btn-secondary set-default-btn">기본값으로</button>
          <button class="btn-danger delete-btn">삭제</button>
        </div>
      `;
      row.querySelector('.edit-prompt-btn').addEventListener('click', () => {
        row.querySelector('.prompt-display').style.display = 'none';
        row.querySelector('.prompt-edit').style.display = 'block';
      });
      row.querySelector('.cancel-edit-btn').addEventListener('click', () => {
        row.querySelector('.prompt-display').style.display = '';
        row.querySelector('.prompt-edit').style.display = 'none';
      });
      row.querySelector('.save-prompt-btn').addEventListener('click', async () => {
        p.prompt = row.querySelector('.prompt-edit-input').value.trim();
        await api('/api/config', { method: 'POST', body: JSON.stringify(cfg) });
        renderPresetsTab(content);
      });
      row.querySelector('.set-default-btn').addEventListener('click', async () => {
        cfg.activePresetId = p.id;
        await api('/api/config', { method: 'POST', body: JSON.stringify(cfg) });
        renderPresetsTab(content);
      });
      row.querySelector('.delete-btn').addEventListener('click', async () => {
        if (p.id === 'default') { alert('기본 프리셋은 삭제할 수 없습니다.'); return; }
        cfg.presets = cfg.presets.filter(x => x.id !== p.id);
        await api('/api/config', { method: 'POST', body: JSON.stringify(cfg) });
        renderPresetsTab(content);
      });
      listEl.appendChild(row);
    });
  }
}

async function renderResultsTab(content) {
  content.innerHTML = `
    <div class="card">
      <h2>완료된 첨삭 목록</h2>
      <div class="btn-row" style="margin-top:0;align-items:center">
        <div style="flex:1;min-width:160px">
          <label style="margin-top:0">전공(첨삭 기준) 필터</label>
          <select id="filterPreset"><option value="__all__">전체 (전공별로 묶어보기)</option></select>
        </div>
        <div style="flex:1;min-width:160px">
          <label style="margin-top:0">정렬</label>
          <select id="sortOrder">
            <option value="recent">최신순</option>
            <option value="oldest">오래된순</option>
            <option value="name">이름 가나다순</option>
          </select>
        </div>
      </div>
      <div id="resultsList" class="empty" style="margin-top:14px">불러오는 중...</div>
    </div>
  `;
  const listEl = document.getElementById('resultsList');
  const filterSelect = document.getElementById('filterPreset');
  const sortSelect = document.getElementById('sortOrder');

  let allItems = [];
  try {
    const { items } = await api('/api/results?list=1');
    allItems = items;
  } catch (e) {
    listEl.innerHTML = `<div class="empty">불러오기 실패: ${escapeHtml(e.message)}</div>`;
    return;
  }

  if (!allItems.length) { listEl.innerHTML = `<div class="empty">완료된 첨삭이 없습니다.</div>`; return; }

  const presetNames = [...new Set(allItems.map(it => it.presetName || '기본'))].sort((a, b) => a.localeCompare(b, 'ko'));
  filterSelect.innerHTML = `<option value="__all__">전체 (전공별로 묶어보기)</option>` +
    presetNames.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');

  function sortItems(items) {
    const sorted = [...items];
    if (sortSelect.value === 'name') {
      sorted.sort((a, b) => (a.studentName || '').localeCompare(b.studentName || '', 'ko'));
    } else if (sortSelect.value === 'oldest') {
      sorted.sort((a, b) => a.approvedAt - b.approvedAt);
    } else {
      sorted.sort((a, b) => b.approvedAt - a.approvedAt);
    }
    return sorted;
  }

  function buildResultRow(it) {
    const link = location.origin + location.pathname + '?t=' + encodeURIComponent(TEACHER_ID) + '#result=' + it.id;
    const row = document.createElement('div');
    row.className = 'preset-item';
    row.innerHTML = `
      <div><b>${escapeHtml(it.studentName) || '(이름 없음)'}</b> — 문항 ${it.itemCount || 1}개<div style="font-size:12px;color:var(--muted)">${new Date(it.approvedAt).toLocaleString('ko-KR')}</div></div>
      <div class="btn-row" style="margin:0">
        <a href="${link}" target="_blank" class="btn-secondary" style="text-decoration:none;padding:8px 14px;border-radius:8px">결과 보기</a>
        <button class="btn-danger delete-result-btn">삭제</button>
      </div>
    `;
    row.querySelector('.delete-result-btn').addEventListener('click', async () => {
      if (!confirm(`${it.studentName || '이름 없음'}님의 첨삭 결과를 삭제할까요? 학생에게 보낸 링크도 더 이상 열리지 않게 됩니다.`)) return;
      try {
        await api('/api/results?id=' + it.id, { method: 'DELETE' });
        renderList();
      } catch (e) {
        alert('삭제 실패: ' + e.message);
      }
    });
    return row;
  }

  function renderList() {
    const filterVal = filterSelect.value;
    listEl.innerHTML = '';

    if (filterVal === '__all__') {
      presetNames.forEach(name => {
        const groupItems = sortItems(allItems.filter(it => (it.presetName || '기본') === name));
        if (!groupItems.length) return;
        const groupWrap = document.createElement('details');
        groupWrap.open = true;
        groupWrap.style.marginBottom = '14px';
        const summary = document.createElement('summary');
        summary.style.cursor = 'pointer';
        summary.innerHTML = `<b style="color:var(--navy)">📁 ${escapeHtml(name)}</b> <span class="star-tag ok">${groupItems.length}명</span>`;
        groupWrap.appendChild(summary);
        const inner = document.createElement('div');
        inner.style.marginTop = '8px';
        groupItems.forEach(it => inner.appendChild(buildResultRow(it)));
        groupWrap.appendChild(inner);
        listEl.appendChild(groupWrap);
      });
    } else {
      const filtered = sortItems(allItems.filter(it => (it.presetName || '기본') === filterVal));
      filtered.forEach(it => listEl.appendChild(buildResultRow(it)));
    }
  }

  filterSelect.addEventListener('change', renderList);
  sortSelect.addEventListener('change', renderList);
  renderList();
}

// ---------- 학생 결과 열람 화면 ----------
function resultItemBlockHtml(item, idx, total) {
  return `
    <div class="result-block" style="${idx > 0 ? 'border-top:2px solid var(--line);padding-top:18px;margin-top:18px' : ''}">
      ${total > 1 ? `<div style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:8px">문항 ${idx + 1} / ${total} · ${escapeHtml(item.questionType || '')}</div>` : ''}
      <h3>${escapeHtml(item.questionType === '이력서항목' ? '경력·활동 항목' : '자소서 문항')}</h3>
      <p style="white-space:pre-wrap">${escapeHtml(item.question)}</p>
    </div>
    <div class="result-block">
      <h3>제출한 답변</h3>
      <p style="white-space:pre-wrap">${escapeHtml(item.answer)}</p>
    </div>
    <div class="result-block">
      <h3>${(item.frameworkUsed || 'STAR')} 구조 진단</h3>
      <div class="star-row">${structureTagsHtml(item.frameworkUsed || 'STAR', item.structure)}</div>
      <div class="star-row">${concretenessTagsHtml(item.concreteness)}</div>
      ${riskFlagsHtml(item.riskFlags)}
      ${aiTracePhrasesHtml(item.aiTracePhrases)}
    </div>
    ${item.jobMatch ? `<div class="result-block"><h3>채용공고 매칭도</h3>${jobMatchHtml(item.jobMatch)}</div>` : ''}
    ${item.intentGapComment ? `<div class="result-block"><h3>내가 밝힌 의도 vs 실제 답변</h3><p style="white-space:pre-wrap;background:var(--warn-bg);padding:12px;border-radius:8px">${escapeHtml(item.intentGapComment)}</p></div>` : ''}
    ${item.previousAnswer ? `<div class="result-block"><h3>Before → After 비교</h3><p style="white-space:pre-wrap;line-height:1.9;background:var(--green-light);padding:12px;border-radius:8px">${diffHtml(item.previousAnswer, item.answer)}</p>${item.revisionComment ? `<p style="margin-top:8px">${escapeHtml(item.revisionComment)}</p>` : ''}</div>` : ''}
    ${item.charLimitNote ? `<div class="result-block"><h3>⚠ 글자수 초과 (제한 ${item.charLimit}자)</h3><p style="white-space:pre-wrap;background:var(--warn-bg);padding:12px;border-radius:8px">${escapeHtml(item.charLimitNote)}</p></div>` : ''}
    <div class="result-block">
      <h3>면접관 시점 — 이 답변으로 추론되는 평소 모습</h3>
      <p style="white-space:pre-wrap;background:var(--navy-light);padding:12px;border-radius:8px">${escapeHtml(item.interviewerInference)}</p>
    </div>
    <div class="result-block">
      <h3>잘된 점</h3>
      <p style="white-space:pre-wrap">${escapeHtml(item.strengths)}</p>
    </div>
    <div class="result-block">
      <h3>개선 방향</h3>
      <p style="white-space:pre-wrap">${escapeHtml(item.improvements)}</p>
    </div>
    <div class="result-block">
      <h3>다듬은 문장 제안</h3>
      <p style="white-space:pre-wrap;background:var(--green-light);padding:12px;border-radius:8px">${escapeHtml(item.polishedText)}</p>
    </div>
    <div class="result-block">
      <h3>예상 꼬리질문 (면접 대비)</h3>
      ${followUpHtml(item.followUpQuestions)}
    </div>
  `;
}

function resultContentHtml(record) {
  const items = record.items || [];
  return `
    <div class="card">
      <h2>첨삭 결과${record.studentName ? ` — ${escapeHtml(record.studentName)}님` : ''}</h2>
      ${items.length > 1 ? `<p style="font-size:13px;color:var(--muted);margin-top:-6px">총 ${items.length}개 문항의 첨삭 결과예요.</p>` : ''}
      ${record.jobPosting ? `<div class="result-block"><h3>지원 채용공고 핵심 내용</h3><p style="white-space:pre-wrap">${escapeHtml(record.jobPosting)}</p></div>` : ''}
      ${items.map((it, idx) => resultItemBlockHtml(it, idx, items.length)).join('')}
    </div>
  `;
}

async function renderResultView(id) {
  app.innerHTML = `<div class="card"><div class="empty">결과를 불러오는 중...</div></div>`;
  try {
    const { item } = await api('/api/results?id=' + encodeURIComponent(id));
    app.innerHTML = resultContentHtml(item);
  } catch (e) {
    app.innerHTML = `<div class="card"><div class="empty">결과를 불러올 수 없습니다: ${escapeHtml(e.message)}</div></div>`;
  }
}

route();
