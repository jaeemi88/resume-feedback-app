<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>
// 네이버 예약 안내 문구는 = 기호를 못 써서, 자동 입장 링크를 /go/키 모양으로 씀 → 앱 안에서는 ?shop=키 로 바꿔 처리
(function(){var m=location.pathname.match(/^\/go\/([A-Za-z0-9_-]{6,40})\/?$/);if(m)history.replaceState(null,'','/?shop='+m[1]);})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자소서·이력서 첨삭 — 진로모아커리어센터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Noto+Serif+KR:wght@400;600&display=swap">
<meta name="theme-color" content="#643DF2">
<style>
  :root{
    --bg:#ffffff;
    --text:#1a2130;
    --muted:#6b7280;
    --green:#643DF2;
    --green-light:#EFEAFE;
    --navy:#3A1F9E;
    --navy-light:#F1EDFE;
    --border:#e2e5ea;
    --line:#e2e5ea;
    --warn:#b45309;
    --warn-bg:#fef3e2;
    --ok:#1b4332;
    --ok-bg:#e8f0ec;
    --miss:#b91c1c;
    --miss-bg:#fdecec;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans KR','맑은 고딕','Malgun Gothic',-apple-system,sans-serif;
    line-height:1.6;
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  header{
    background:var(--green);
    color:#fff;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  header .header-sub{
    font-size:12px;
    color:rgba(255,255,255,.65);
    margin-bottom:4px;
    letter-spacing:.2px;
    display:flex;
    align-items:center;
    gap:5px;
  }
  header .header-sub .brand-logo{
    width:14px;
    height:14px;
    flex-shrink:0;
  }
  header .header-sub .brand-name{
    color:#C0D904;
    font-weight:700;
  }
  header h1{
    font-size:20px;
    margin:0;
    font-weight:600;
  }
  header .badge{
    font-size:12px;
    font-weight:700;
    background:#EAF2AE;
    color:#3A1F9E;
    padding:4px 10px;
    border-radius:999px;
  }
  body.role-teacher header .badge{
    background:#C0D904;
    color:#3A1F9E;
  }
  /* 학생용: 같은 퍼플 톤이지만 연하게 — 강사용: 진한 퍼플 유지 */
  body.role-student header{
    background:var(--green-light);
    color:var(--green);
  }
  body.role-student header .header-sub{
    color:#6b5bb0;
  }
  body.role-student header .brand-name{
    color:var(--green);
  }
  body.role-student header .brand-logo{
    filter:brightness(0) saturate(100%);
    opacity:0.75;
  }
  main{
    max-width:880px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  .card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    margin-bottom:18px;
  }
  .card h2{
    font-size:16px;
    color:var(--navy);
    margin:0 0 14px;
    border-left:4px solid var(--green);
    padding-left:10px;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--navy);
    margin:12px 0 6px;
  }
  select, textarea, input[type=text]{
    width:100%;
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    font-family:inherit;
    font-size:14px;
    color:#1a2130;
    background:#ffffff;
    resize:vertical;
  }
  textarea{min-height:90px;}
  .counter{
    text-align:right;
    font-size:12px;
    color:var(--muted);
    margin-top:4px;
  }
  button{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    border:none;
    border-radius:8px;
    padding:10px 18px;
    cursor:pointer;
  }
  .btn-primary{background:var(--green); color:#fff;}
  .btn-primary:disabled{background:#B7A8F5; cursor:not-allowed;}
  .btn-secondary{background:var(--navy-light); color:var(--navy);}
  .btn-danger{background:var(--miss-bg); color:var(--miss);}
  .btn-row{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  .tab{
    padding:8px 14px;
    border-radius:8px 8px 0 0;
    background:var(--navy-light);
    color:var(--navy);
    cursor:pointer;
    font-size:13px;
    font-weight:700;
  }
  .tab.active{background:var(--navy); color:#fff;}
  .status-msg{
    margin-top:14px;
    padding:12px 14px;
    border-radius:8px;
    font-size:13px;
    background:var(--green-light);
    color:var(--green);
    display:none;
  }
  .status-msg.error{background:var(--miss-bg); color:var(--miss);}
  .star-row{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;}
  .star-tag{
    font-size:12px;
    font-weight:700;
    padding:4px 10px;
    border-radius:999px;
  }
  .star-tag.ok{background:var(--ok-bg); color:var(--ok);}
  .star-tag.miss{background:var(--miss-bg); color:var(--miss);}
  .review-item{
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    margin-bottom:14px;
  }
  .review-item .meta{font-size:12px; color:var(--muted); margin-bottom:8px;}
  .field-block{margin-bottom:10px;}
  .field-block .fb-label{font-size:12px; font-weight:700; color:var(--muted); margin-bottom:4px;}
  .preset-item{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  .preset-item > div:first-child{
    flex:1 1 220px;
    min-width:0;
  }
  .preset-item > .btn-row{
    flex:0 0 auto;
  }
  .link-box{
    display:flex;
    gap:8px;
    align-items:center;
    background:var(--green-light);
    border-radius:8px;
    padding:10px 12px;
    margin-top:10px;
    word-break:break-all;
    font-size:13px;
  }
  .empty{color:var(--muted); font-size:13px; padding:10px 0;}
  .result-block{margin-bottom:18px;}
  .result-block h3{font-size:14px; color:var(--navy); margin:0 0 6px;}
  .result-block p{margin:0; font-size:14px;}
  .moa-q{
    display:inline-flex; align-items:center; justify-content:center;
    width:17px; height:17px; margin-left:5px; vertical-align:middle;
    border-radius:50%; background:#EAF2AE; color:#11308C;
    font-size:11px; font-weight:900; line-height:1; text-decoration:none;
  }
  .moa-q:hover{ background:#C0D904; }

  /* ===== 2026-09-30 디자인 개편: 학생 결과 화면 '교정지' 스타일 ===== */
  .proof-kicker{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--green);margin-bottom:4px}
  .proof-title{font-family:'Noto Serif KR',serif;font-size:26px;font-weight:600;line-height:1.35;margin:0 0 6px;color:var(--text);border:none;padding:0}
  .proof-sub{font-size:14px;color:var(--muted);margin:0}
  .proof-legend{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
  .proof-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:500}
  .proof-chip.p{background:#F3EFFE;color:#3F2799}
  .proof-chip.p i{width:16px;height:3px;border-radius:2px;background:var(--green)}
  .proof-chip.y{background:#F8FAFC;color:#B45309;box-shadow:inset 0 0 0 1px #E2E8F0}
  .proof-chip.y i{width:16px;height:3px;border-radius:2px;background:#D97706}
  .proof-wrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
  @media (max-width:760px){ .proof-wrap{grid-template-columns:1fr} .proof-title{font-size:22px} }
  .proof-paper{border:1px solid var(--border);border-radius:14px;background:#FFFFFF;overflow:hidden}
  .proof-paper-head{padding:11px 18px;border-bottom:1px solid #E2E8F0;background:#F8FAFC;display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--text)}
  .proof-paper-head span:last-child{font-weight:400;color:var(--muted);white-space:nowrap}
  .proof-paper-body{position:relative;padding:16px 18px 18px 34px;font-family:'Noto Serif KR',serif;font-size:16px;line-height:34px;color:#0F172A;white-space:pre-wrap;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,#EEF2F7 33px,#EEF2F7 34px);background-origin:content-box;background-clip:content-box}
  .proof-paper-body::before{content:'';position:absolute;left:20px;top:0;bottom:0;width:1px;background:#E2E8F0}
  .mk-p{background:#F3EFFE;border-bottom:2px solid var(--green);padding:1px 0}
  .mk-y{background:#FFF4E5;border-bottom:2px solid #D97706;padding:1px 0}
  .mk-n{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin:0 3px;border-radius:50%;font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:700;line-height:1;vertical-align:5px}
  .mk-n.p{background:var(--green);color:#fff}
  .mk-n.y{background:#B45309;color:#fff}
  .proof-notes{display:flex;flex-direction:column;gap:10px}
  .proof-notes-label{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
  .proof-note{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:#fff;font-size:13.5px;line-height:1.6}
  .proof-note-head{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;margin-bottom:4px}
  .proof-note.p .proof-note-head{color:#3F2799}
  .proof-note.y .proof-note-head{color:#B45309}
  .proof-note.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
  .proof-note .quote{font-weight:700;margin-bottom:2px}
  .proof-note .fix{margin-top:6px;padding:8px 10px;border-radius:8px}
  .proof-note.p .fix{background:var(--green-light);color:var(--navy)}
  .proof-note.y .fix{background:#F8FAFC;color:#334155;box-shadow:inset 0 0 0 1px #E2E8F0}
  .proof-note .nopos{font-size:11.5px;color:var(--muted);font-weight:400}
  .proof-check{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 16px;border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .pc-item{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text)}
  .pc-item svg{flex-shrink:0}

  /* ---------- 예시로 채운 완성본 (2026-10-02) ---------- */
  .ex-wrap{background:var(--green-light);border-radius:10px;padding:14px}
  .ex-guide{font-size:13px;color:var(--navy);margin:0 0 10px}
  .ex-progress{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
  .ex-bar{flex:1;min-width:120px;height:8px;background:#fff;border-radius:99px;overflow:hidden}
  .ex-bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
  .ex-text{white-space:pre-wrap;line-height:2;margin:0;background:#fff;border-radius:8px;padding:12px}
  .ex-slot{background:#FFF1A8;border-bottom:2px solid #E0B400;border-radius:3px;padding:1px 2px;cursor:pointer}
  .ex-slot.mine{background:#DDF5E6;border-bottom-color:#1F7A4D}
  .ex-slot.open{outline:2px solid var(--green);outline-offset:1px}
  .ex-slot.static{cursor:default}
  .ex-tag{font-size:10px;font-weight:700;color:#8A6D00;margin-left:2px;vertical-align:super}
  .ex-slot.mine .ex-tag{color:#1F7A4D}
  .ex-editor{background:#fff;border:2px solid var(--green);border-radius:10px;padding:12px;margin-top:10px}
  .ex-ed-head{font-weight:700;font-size:14px;color:var(--navy)}
  .ex-ed-sub{font-size:12px;color:var(--muted);margin:2px 0 8px}
  .ex-opts{display:flex;flex-direction:column;gap:6px}
  .ex-opt{text-align:left;background:var(--green-light);border:1px solid transparent;border-radius:8px;padding:9px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--text)}
  .ex-opt:hover,.ex-opt.on{border-color:var(--green)}
  .ex-own{display:flex;gap:6px;margin-top:8px}
  .ex-own input{flex:1;margin:0}
  .ex-ed-foot{display:flex;gap:12px;margin-top:8px;font-size:12px}
  .ex-link{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font:inherit;font-size:12px}
  .ex-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .ex-count{font-size:12px;color:var(--muted)}
  .ex-final{background:#fff;border:2px solid #1F7A4D;border-radius:10px;padding:12px;margin-top:12px}
  .ex-final h4{margin:0 0 6px;color:#1F7A4D;font-size:14px}
  .ex-modal-bg{position:fixed;inset:0;background:rgba(20,20,40,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
  .ex-modal{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:20px}
  .ex-modal h3{margin:0 0 4px;color:var(--navy)}
  .ex-modal .iv-item{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
  .ex-modal .iv-q{font-weight:700;font-size:14px;margin-top:8px}
</style>
</head>

// 기본(기록) 2026.10.26 · week(일정) 2026.10.26(월) · short 10.26(월) · time 2026.10.26 14:00 · stime 10.26(월) 14:00 · ym 2000.03 · formal 2026년 9월 27일
function moaDate(v, kind){
  if(v === null || v === undefined || v === '') return '';
  var d;
  if(typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)){ var p = v.split('-'); d = new Date(+p[0], +p[1]-1, +p[2]); }
  else d = new Date(v);
  if(isNaN(d.getTime())) return String(v);
  var y = d.getFullYear(), m = ('0'+(d.getMonth()+1)).slice(-2), dd = ('0'+d.getDate()).slice(-2), w = '(' + '일월화수목금토'[d.getDay()] + ')';
  var hm = ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
  if(kind === 'week') return y + '.' + m + '.' + dd + w;
  if(kind === 'short') return m + '.' + dd + w;
  if(kind === 'time') return y + '.' + m + '.' + dd + ' ' + hm;
  if(kind === 'stime') return m + '.' + dd + w + ' ' + hm;
  if(kind === 'ym') return y + '.' + m;
  if(kind === 'formal') return y + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일';
  return y + '.' + m + '.' + dd;
}

// ---------- 공통 유틸 ----------
async function api(path, options = {}) {
  // 강사별 데이터 분리를 위해 /api/config, /api/reviews, /api/results 호출에는
  // 항상 t(강사 코드)를 쿼리 파라미터로 자동 첨부함 (호출부를 일일이 고칠 필요 없게)
  let finalPath = path;
  if (/^\/api\/(config|reviews|results)/.test(path)) {
    const sep = path.includes('?') ? '&' : '?';
    finalPath = path + sep + 't=' + encodeURIComponent(TEACHER_ID);
  }
  const res = await fetch(finalPath, {
    ...options,
    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    const msg = (err.error || ('요청 실패: ' + res.status)) + (err.detail ? ' — 상세: ' + err.detail : '');
    const e = new Error(msg);
    if (err.expired) e.expired = true;
    throw e;
  }
  return res.json();
}

const FRAMEWORK_LABELS = {
  STAR: { situation: '상황(S)', task: '과제(T)', action: '행동(A)', result: '결과(R)' },
  'STAR-L': { situation: '상황(S)', task: '과제(T)', action: '행동(A)', result: '결과+배움(R-L)' },
  PREP: { point: '주장(P)', reason: '근거(R)', example: '사례(E)', pointAgain: '재강조(P)' },
  RESUME: { actionVerbStart: '행동동사 시작', quantifiedResult: '정량적 성과', concise: '간결성', jobKeyword: '직무 키워드' }
};

function structureTagsHtml(framework, structure) {
  const labels = FRAMEWORK_LABELS[framework] || FRAMEWORK_LABELS.STAR;
  return Object.keys(labels).map(k => {
    const ok = structure && structure[k];
    return `<span class="star-tag ${ok ? 'ok' : 'miss'}">${labels[k]} ${ok ? '충족' : '보완필요'}</span>`;
  }).join('');
}

function concretenessTagsHtml(c) {
  if (!c) return '';
  const labels = { hasNumber: '숫자 포함', hasProperNoun: '고유명사 포함', hasJobKeyword: '직무 키워드 포함' };
  return Object.keys(labels).map(k => {
    const ok = c[k];
    return `<span class="star-tag ${ok ? 'ok' : 'miss'}">${labels[k]} ${ok ? 'O' : 'X'}</span>`;
  }).join('');
}

function riskFlagsHtml(flags) {

    근거부족나열형: '근거 부족 주장 나열형'

// 2026-09-26 추가: 결격 신호 체크 (redFlags) — 학생 결과 화면용
function redFlagsHtml(flags) {
  if (!Array.isArray(flags)) return ''; // 예전 결과(이 기능 이전)는 아무것도 표시하지 않음
  const list = flags.filter(f => f && (f.quote || f.why));

}

// 강사 검수 화면용 — 체크를 풀면 그 항목은 학생 결과에서 빠짐

// ---------- 내 문장 방어 테스트 (2026-09-26 2단계) ----------
// 학생 결과 화면에서 핵심 문장마다 면접 꼬리질문에 "내 말로" 답해보고, 자소서와 맞는지 AI가 한 줄 판정
// (판정 결과는 저장되지 않고 화면에서만 보여줌 — 몇 번이든 다시 연습 가능)
const DEFENSE_CTX = {};
let defenseSeq = 0;
function defenseHtml(item) {
  const list = Array.isArray(item.defenseQuestions) ? item.defenseQuestions.filter(d => d && d.sentence && d.question) : [];
  if (!list.length) return '';
  return `<div class="result-block">
    <h3>🛡️ 이 문장, 면접에서 말할 수 있나요?</h3>
    <p style="font-size:13px;color:var(--muted);margin:-4px 0 8px">면접관은 자소서 문장을 짚어서 물어봐요. 30초 분량으로 <b>내 말로</b> 답해보세요. 설명하지 못하는 문장은 빼거나 경험을 보충해야 해요.</p>
    ${list.map(d => {
      const key = 'df' + (defenseSeq++);
      DEFENSE_CTX[key] = { sentence: exPlain(d.sentence), question: d.question, essay: exPlain(item.polishedText || item.answer || '') };
      return `<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px">
        <div style="font-weight:700;font-size:14px">📌 "${escapeHtml(exPlain(d.sentence))}"</div>
        <div style="font-size:14px;margin-top:6px;color:var(--navy)">면접관: ${escapeHtml(d.question)}</div>
        <div class="def-interactive">
          <textarea class="def-reply" data-key="${key}" maxlength="800" placeholder="말하듯이 적어보세요 (30초 ≈ 150~200자)" style="margin-top:8px;min-height:80px"></textarea>
          <div class="btn-row" style="margin-top:6px"><button type="button" class="btn-primary def-check-btn" data-key="${key}">판정 받기</button></div>
          <div class="def-result" data-key="${key}"></div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest && e.target.closest('.def-check-btn');
  if (!btn) return;
  const key = btn.dataset.key;
  const ctx = DEFENSE_CTX[key];
  const reply = (document.querySelector(`.def-reply[data-key="${key}"]`) || {}).value || '';
  const out = document.querySelector(`.def-result[data-key="${key}"]`);
  if (!ctx || !out) return;

function followUpHtml(fu) {
  if (!fu) return '';
  const labels = { reasonType: '이유형', alternativeType: '대안형', quantifyType: '수치형' };
  return Object.keys(labels).map(k =>
    `<div class="field-block"><div class="fb-label">꼬리질문 · ${labels[k]}</div><p>${escapeHtml(fu[k])}</p></div>`
  ).join('');
}

function escapeHtml(str) {
  return (str || '').replace(/[&<>"']/g, s => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[s]));
}

function extractCharLimit(questionText) {
  const match = (questionText || '').match(/(\d{2,5})\s*자/);
  return match ? parseInt(match[1], 10) : null;
}

function daysRemainingText(expiresAt) {
  if (!expiresAt) return '무제한';
  const diff = Math.ceil((expiresAt - Date.now()) / (24 * 60 * 60 * 1000));
  if (diff <= 0) return '기간만료';
  return `${diff}일 남음 (${moaDate(expiresAt)}까지)`;
}

// PC: 공유 창에 카톡이 없어서 내용을 복사 → PC 카톡 대화창에 Ctrl+V
// ※ 공유 창은 버튼을 누른 "그 순간"에만 열 수 있어서, 서버 응답을 기다린 뒤에는 버튼을 한 번 더 누르게 함
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
async function moaShare(text) {
  if (IS_MOBILE && navigator.share) {
    try { await navigator.share({ text }); return 'shared'; }
    catch (e) { if (e && e.name === 'AbortError') return 'cancel'; }
  }
  try { await navigator.clipboard.writeText(text); return 'copied'; }
  catch (e) { prompt('아래 내용을 길게 눌러 복사해 주세요', text); return 'copied'; }
}
const SHARE_LABEL = IS_MOBILE ? '💬 카톡으로 보내기' : '💬 카톡용 복사';
function shareResultMsg(r) {
  return r === 'shared' ? '✅ 보냈어요.' : r === 'cancel' ? '보내기를 취소했어요.' : '✅ 복사했어요. PC 카톡 대화창에 Ctrl+V로 붙여넣어 보내 주세요.';
}

    await load();
  }

    const [, cls, label] = statusOf(t);
    const bits = [];
    if (t.lastSeen) bits.push(relDay(t.lastSeen) + ' 접속');
    else if (t.linkSentAt) bits.push('링크 보냄 ' + moaDate(t.linkSentAt));
    if (t.expiresAt) bits.push((t.expired ? '사용 기간 끝남 ' : '사용 기간 ~') + moaDate(t.expiresAt));
    else bits.push('영구');
    bits.push('등록 ' + moaDate(t.approvedAt));
    return `
      <div class="rb-row">
        <div class="rb-top">
          <div class="rb-name">${escapeHtml(t.name)}<span class="rb-code">${escapeHtml(t.code)}</span></div>
          <span class="rb-badge ${cls}">${label}</span>
        </div>
        <div class="rb-sub">${bits.map(escapeHtml).join(' · ')}</div>
        <div class="rb-btns">
          <button class="btn-primary" data-act="send" data-code="${escapeHtml(t.code)}">${t.linkSentAt || t.lastSeen ? '💬 링크 다시 보내기' : SHARE_LABEL}</button>
          <button class="btn-secondary" data-act="expiry" data-code="${escapeHtml(t.code)}">${t.expired ? '⏳ 기간 연장' : t.expiresAt ? '⏳ 기간 변경' : '⏳ 기간 정하기'}</button>
          <details class="rb-more"><summary>⋯</summary><div class="rb-menu">
            ${t.expiresAt ? `<button data-act="perm" data-code="${escapeHtml(t.code)}">♾️ 영구로 바꾸기</button>` : ''}
            ${t.hubKey ? `<button data-act="rekey" data-code="${escapeHtml(t.code)}">🔄 링크 재발급 (옛 링크 막기)</button>` : ''}
            <button class="danger" data-act="del" data-code="${escapeHtml(t.code)}">⛔ 사용 중지</button>
          </div></details>
        </div>
      </div>`;
  }

  function inviteRow(v) {
    return `
      <div class="rb-row" style="background:#FAFBFD">
        <div class="rb-top">
          <div class="rb-name">${escapeHtml(v.label || '이름 메모 없음')}<span class="rb-code">초대코드 ${escapeHtml(v.code)}</span></div>
          <span class="rb-badge b-inv">${v.isExpired ? '✉️ 초대 기간 끝남' : '✉️ 초대만 보냄'}</span>
        </div>
        <div class="rb-sub">예전 방식 초대코드예요. 아직 등록 전이에요 · 발급 ${escapeHtml(moaDate(v.createdAt))}${v.expiresAt ? ' · ~' + escapeHtml(moaDate(v.expiresAt)) : ''}</div>
        <div class="rb-btns">
          ${v.isExpired ? '' : `<button class="btn-secondary" data-act="invcopy" data-inv="${escapeHtml(v.code)}">초대 링크 복사</button>`}
          <button class="btn-danger" data-act="invcancel" data-inv="${escapeHtml(v.code)}">취소</button>
        </div>
      </div>`;
  }

  function render() {
    if (!DATA) return;
    const T = DATA.teachers, R = DATA.removed, I = DATA.invites;
    const cnt = { all: T.length + I.length, active: 0, wait: I.length, temp: 0, off: R.length };
    T.forEach(t => { cnt[statusOf(t)[0]]++; });
    const chips = [['all', '전체'], ['active', '활동'], ['wait', '대기'], ['temp', '임시'], ['off', '중지']];
    $('rbChips').innerHTML = chips.map(([k, n]) => `<button class="rb-chip${FILTER === k ? ' on' : ''}" data-f="${k}">${n} ${cnt[k]}</button>`).join('');

    const q = QUERY.toLowerCase();
    const hit = (...xs) => !q || xs.some(x => String(x || '').toLowerCase().includes(q));
    let html = '';
    if (FILTER !== 'off') {
      const rows = T.filter(t => (FILTER === 'all' || statusOf(t)[0] === FILTER) && hit(t.name, t.code));
      // 조치가 필요한 사람(링크 필요·기간 끝남·접속 전)을 위로
      const order = { 'b-need': 0, 'b-end': 1, 'b-wait': 2, 'b-temp': 3, 'b-active': 4 };
      rows.sort((a, b) => order[statusOf(a)[1]] - order[statusOf(b)[1]]);
      html += rows.map(row).join('');
      if (FILTER === 'all' || FILTER === 'wait') html += I.filter(v => hit(v.label, v.code)).map(inviteRow).join('');
    }
    if (FILTER === 'off') {
      html += R.filter(r => hit(r.name, r.code)).map(r => `
        <div class="rb-row" style="background:#FAFBFD">
          <div class="rb-top"><div class="rb-name">${escapeHtml(r.name)}<span class="rb-code">${escapeHtml(r.code)}</span></div><span class="rb-badge b-inv">⚫ 중지</span></div>
          <div class="rb-sub">중지 ${escapeHtml(moaDate(r.removedAt))} · 기록은 보관 중</div>
          <div class="rb-btns"><button class="btn-secondary" data-act="restore" data-code="${escapeHtml(r.code)}">복구</button></div>
        </div>`).join('');
    }
    $('rbList').innerHTML = html || '<div class="empty">해당하는 강사가 없어요.</div>';

    // 전체 보기에서는 중지된 강사를 맨 아래 접어둠
    $('rbRemoved').innerHTML = (FILTER === 'all' && R.length) ? `
      <details><summary style="cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)">▸ 중지된 강사 ${R.length}명</summary>
        <div style="margin-top:8px">${R.map(r => `
          <div class="rb-row" style="background:#FAFBFD;display:flex;justify-content:space-between;align-items:center;gap:8px">
            <div><b>${escapeHtml(r.name)}</b><span class="rb-code">${escapeHtml(r.code)}</span><div class="rb-sub" style="margin:2px 0 0">중지 ${escapeHtml(moaDate(r.removedAt))}</div></div>
            <button class="btn-secondary" data-act="restore" data-code="${escapeHtml(r.code)}">복구</button>
          </div>`).join('')}</div>
      </details>` : '';
  }

  async function load() {
    const res = await fetch('/api/teacher-registry?list=all&master=' + encodeURIComponent(pw()));
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || '불러오지 못했어요.');
    DATA = data;
    render();
  }

  async function open() {
    const err = $('rbLoginErr');
    err.style.display = 'none';
    if (!pw()) { err.textContent = '비밀번호를 입력해 주세요.'; err.style.display = 'block'; return; }
    $('rbOpenBtn').disabled = true; $('rbOpenBtn').textContent = '여는 중...';
    try {
      await load();
      ssSet(pw());
      $('rbLogin').style.display = 'none';
      $('rbBook').style.display = 'block';
      $('clBook').style.display = 'block';
      initClientManager($('clBook'), pw());
    } catch (e) {
      err.textContent = e.message; err.style.display = 'block';
    }
    $('rbOpenBtn').disabled = false; $('rbOpenBtn').textContent = '명부 열기';
  }

  const find = code => DATA.teachers.find(t => t.code === code);

  async function onAct(btn) {
    const act = btn.dataset.act, code = btn.dataset.code, inv = btn.dataset.inv;
    const t = code ? (find(code) || DATA.removed.find(r => r.code === code)) : null;
    const menu = btn.closest('details.rb-more'); if (menu) menu.open = false;
    const busy = txt => { btn.disabled = true; btn.dataset.orig = btn.textContent; btn.textContent = txt; };
    const done = () => { btn.disabled = false; if (btn.dataset.orig) btn.textContent = btn.dataset.orig; };
    try {
      if (act === 'send') { await sendLink(t); }
      else if (act === 'expiry') {
        const v = prompt(`${t.name} 강사님 사용 기간을 며칠로 할까요?\n\n· 오늘부터 며칠인지 숫자만 (예: 7)\n· 비워두면 영구\n· 기간이 끝나면 승인 링크와 학생 링크가 자동으로 막혀요`, '');
        if (v === null) return;
        const days = parseInt(v, 10) || 0;
        busy('저장 중...');
        await registryPost({ action: 'setExpiry', code, expiryDays: days });
        await load();
        showDone(`✅ <b>${escapeHtml(t.name)}</b> 강사님 사용 기간을 ${days ? days + '일(~' + moaDate(Date.now() + (days - 1) * 86400000) + ')' : '영구'}로 정했어요.`);
      }
      else if (act === 'perm') { busy('저장 중...'); await registryPost({ action: 'setExpiry', code, expiryDays: 0 }); await load(); }
      else if (act === 'rekey') {
        if (!confirm(`${t.name} 강사님 승인 링크를 새로 만들까요?\n\n예전 링크는 바로 막혀요. (링크가 다른 사람에게 퍼졌을 때 사용)\n새 링크가 복사되니 강사님께 다시 보내주세요.`)) return;
        busy('만드는 중...');
        const d = await registryPost({ action: 'makeHubLink', code });
        await sendLink({ ...t, hubKey: d.hubKey });
      }
      else if (act === 'del') {
        if (!confirm(`${t.name}(${code}) 강사님을 사용 중지할까요?\n\n· 승인 링크와 학생 제출 링크가 바로 막혀요.\n· 프리셋·첨삭 기록은 보관되며, "중지된 강사"에서 언제든 복구할 수 있어요.`)) return;
        busy('처리 중...');
        await registryPost({ action: 'deleteTeacher', code });
        await load();
      }
      else if (act === 'restore') {
        if (!confirm(`${t.name}(${code}) 강사님을 복구할까요?\n예전 승인 링크와 기록을 그대로 다시 쓸 수 있어요.`)) return;
        busy('복구 중...');
        await registryPost({ action: 'restoreTeacher', code });
        await load();
      }
      else if (act === 'invcopy') {
        const link = location.origin + location.pathname + '?admin=1&invite=' + encodeURIComponent(inv);
        await copyText(link);
        showDone(`초대 링크를 복사했어요. 강사님이 이 링크로 등록하시면 승인 링크가 바로 나와요.<br><span style="color:var(--muted)">${escapeHtml(link)}</span>`);
      }
      else if (act === 'invcancel') {
        if (!confirm(`초대코드 ${inv}를 취소할까요?\n취소하면 이 코드로는 등록할 수 없어요.`)) return;
        busy('취소 중...');
        await registryPost({ action: 'cancelInvite', inviteCode: inv });
        await load();
      }
    } catch (e) {
      alert(e.message);
      done();
    }
  }

  $('rbOpenBtn').addEventListener('click', open);
  $('masterPasswordInput').addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
  $('rbAddToggle').addEventListener('click', () => {
    const box = $('rbAdd'); const show = box.style.display === 'none';
    box.style.display = show ? 'block' : 'none';
    if (show) setTimeout(() => $('rbAddName').focus(), 50);
  });
  $('rbAddBtn').addEventListener('click', async () => {
    const err = $('rbAddErr'), btn = $('rbAddBtn');
    err.style.display = 'none';
    const name = $('rbAddName').value.trim();
    const typed = $('rbAddCode').value.trim().toLowerCase().replace(/[^a-z0-9가-힣_-]/g, '');
    const days = parseInt($('rbAddDays').value, 10) || 0;
    if (!name) { err.textContent = '강사 이름을 넣어 주세요.'; err.style.display = 'block'; return; }
    // 강사 코드는 강사님이 알 필요 없는 내부 번호 → 비워두면 자동 (예: t4k9xq)
    const autoCode = () => 't' + Array.from(crypto.getRandomValues(new Uint8Array(5)), n => 'abcdefghjkmnpqrstuvwxyz23456789'[n % 31]).join('');
    btn.disabled = true; btn.textContent = '추가 중...';
    try {
      let d = null;
      for (let i = 0; i < (typed ? 1 : 3) && !d; i++) {
        try { d = await registryPost({ action: 'addTeacher', name, code: typed || autoCode(), expiryDays: days }); }
        catch (e2) { if (typed || i === 2 || !/이미/.test(e2.message)) throw e2; }
      }
      ['rbAddName', 'rbAddCode', 'rbAddDays'].forEach(id => { $(id).value = ''; });
      $('rbAdd').style.display = 'none';
      FILTER = 'all';
      await sendLink({ code: d.code, name: d.name, hubKey: d.hubKey }, true);
    } catch (e) {
      err.textContent = e.message; err.style.display = 'block';
    }
    btn.disabled = false; btn.textContent = '추가하기';
  });
  $('rbChips').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; FILTER = b.dataset.f; render(); });
  $('rbSearch').addEventListener('input', e => { QUERY = e.target.value.trim(); render(); });
  $('rbBook').addEventListener('click', e => { const b = e.target.closest('button[data-act]'); if (b) onAct(b); });
  $('rbDone').addEventListener('click', async e => {
    const b = e.target.closest('#rbShareNow'); if (!b || !PENDING_MSG) return;
    const r = await moaShare(PENDING_MSG);
    if (r !== 'cancel') { registryPost({ action: 'markLinkSent', code: b.dataset.code }).catch(() => {}); b.textContent = r === 'shared' ? '✅ 보냈어요' : '✅ 복사됨 — 카톡에 Ctrl+V'; load(); }
  });

  // 같은 창에서 다시 들어오면 비밀번호를 다시 묻지 않음 (창을 닫으면 지워짐)
  const saved = ssGet();
  if (saved) { $('masterPasswordInput').value = saved; open(); }
}

      await loadShops();
    } catch (e) { alert(e.message); }
  });
  // ── 하루 자동 등록 상한 ──
  async function loadLimits(data) {
    if (!data) { const r = await fetch('/api/client-code?limits=1&master=' + encodeURIComponent(masterPw)); data = await r.json().catch(() => ({})); }
    if (!data.limits) return;
    [['resume', 'Resume'], ['interview', 'Interview'], ['set', 'Set']].forEach(([k, K]) => {
      $('lm' + K).value = data.limits[k];

    catch (e) { alert(e.message); }
    b.disabled = false;
  });
  loadLimits();
  loadShops();
  load();
}

async function isTeacherBlocked(code) {
  try {
    const res = await fetch('/api/teacher-registry?check=' + encodeURIComponent(code));
    if (!res.ok) return false;
    const data = await res.json();
    return !!data.blocked;
  } catch (e) {
    return false;
  }
}

function renderBlockedNotice(forTeacher) {
  app.innerHTML = `<div class="card"><div class="empty">${forTeacher
    ? '사용이 중지된 강사 코드예요. 원장님께 문의해 주세요.'
    : '이 링크는 더 이상 사용할 수 없어요. 담당 강사님께 문의해 주세요.'}</div></div>`;
}

// ---------- 라우팅 ----------
async function route() {
  const params = new URLSearchParams(location.search);
  if (params.get('c') && !isAdmin) {
    renderClientEntry(params.get('c'));
    return;
  }
  if (params.get('shop') && !isAdmin) {
    renderShopJoin(params.get('shop'));
    return;
  }
  if (params.get('master') === '1') {
    document.body.classList.add('role-teacher');
    document.getElementById('roleBadge').textContent = '관리자';
    renderMasterTeacherList();
    return;
  }
  const hash = location.hash;
  if (hash.indexOf('#result=') === 0) {
    // 이미 승인된 첨삭 결과는 강사가 삭제돼도 학생이 계속 볼 수 있게 둠
    if (!TEACHER_ID) { renderMissingTeacherNotice(); return; }
    const id = hash.replace('#result=', '');
    renderResultView(id);
  } else if (isAdmin) {
    if (!TEACHER_ID) { renderTeacherSetup(); return; }
    if (await isTeacherBlocked(TEACHER_ID)) { renderBlockedNotice(true); return; }
    renderTeacherView();
  } else {
    if (!TEACHER_ID) { renderMissingTeacherNotice(); return; }
    if (await isTeacherBlocked(TEACHER_ID)) { renderBlockedNotice(false); return; }
    renderStudentView();
  }
}
window.addEventListener('hashchange', route);

1) 문항 먼저 읽기: 정해진 틀이 없는 문항이다. 먼저 [문항]이 무엇을 묻는지(주제, 조건, 글자수)를 파악하고, 그 질문에 정면으로 답했는지부터 평가한다. 질문과 다른 이야기를 하면 동문서답형으로 개선점 첫머리에서 짚는다.

function aspirationExtra(questionType, company) {
  if (TYPE_GUIDES[questionType]) return TYPE_GUIDES[questionType];
  if (questionType !== '입사후포부') return '';
  const companyLine = company
    ? `\n6) 지원 기업: '${company}'. 코멘트와 다듬은 문장에 이 기업명을 넣되, 이 기업의 구체적인 제도명·특허·지사명·수치는 지어내지 말고 일반 표현의 {{ }} 예시로 채운다.`
    : '';
  return ASPIRATION_GUIDE + companyLine;
}

let CLIENT = null;

function clientHoldHtml() {

// 제출 직전에 서버에서 보류가 풀렸는지 다시 확인 (풀렸으면 true)
async function clientHoldCleared() {
  try {
    const r = await fetch('/api/client-code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'verify', code: CLIENT.code }) });
    const d = await r.json();
    if (d && d.client) CLIENT.hold = !!d.client.hold;
  } catch (e) {}
  return !CLIENT.hold;
}

// 제출 전 작성 내용 자동 저장·불러오기 (서버 저장 → 다른 기기에서도 이어서)
function clientCollectResume() {
  const v = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const hire = document.querySelector('input[name="hiringType"]:checked');
  return {
    name: v('studentNameInput'), email: v('studentEmailInput'), hiring: hire ? hire.value : 'general',
    presetId: v('presetSelect'), jobPosting: v('jobPostingInput'), company: v('targetCompanyInput'),
    items: Array.from(document.querySelectorAll('.item-block')).map(b => ({
      type: b.querySelector('.item-questionType').value,
      question: b.querySelector('.item-question').value,
      answer: b.querySelector('.item-answer').value,
      selfIntent: b.querySelector('.item-selfIntent').value,
      prevAnswer: b.querySelector('.item-prevAnswer').value
    }))
  };
}
function clientWireDraft(presetSelect, docTypeSelect) {
  const d = CLIENT_DRAFT;
  const state = document.getElementById('clientSaveState');
  if (d) {
    const set = (id, val) => { const el = document.getElementById(id); if (el && val != null) el.value = val; };
    set('studentNameInput', d.name); set('studentEmailInput', d.email);
    set('jobPostingInput', d.jobPosting); set('targetCompanyInput', d.company);
    if (d.presetId && Array.from(presetSelect.options).some(o => o.value === d.presetId)) presetSelect.value = d.presetId;
    const hr = document.querySelector(`input[name="hiringType"][value="${d.hiring === 'blind' ? 'blind' : 'general'}"]`);
    if (hr) hr.checked = true;
    const items = (d.items || []).slice(0, (CLIENT.maxItems || CLIENT.items.length));
    for (let i = 1; i < items.length; i++) document.getElementById('addItemBtn').click();
    const blocks = document.querySelectorAll('.item-block');
    items.forEach((it, i) => {
      const b = blocks[i]; if (!b) return;
      const sel = b.querySelector('.item-questionType');
      if (CLIENT.items.includes(it.type) && sel.value !== it.type) { sel.value = it.type; sel.dispatchEvent(new Event('change', { bubbles: true })); }
      const put = (cls, val) => { const el = b.querySelector(cls); el.value = val || ''; el.dispatchEvent(new Event('input', { bubbles: true })); };
      put('.item-question', it.question); put('.item-answer', it.answer);
      put('.item-selfIntent', it.selfIntent); put('.item-prevAnswer', it.prevAnswer);
    });
    if (state) state.textContent = '✅ 저장해 둔 내용을 불러왔어요.';
  }
  let timer = null, saving = false;
  const save = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      if (saving) return; saving = true;
      try {
        const r = await fetch('/api/client-code', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'saveDraft', code: CLIENT.code, part: 'resume', data: clientCollectResume() }) });
        if (state) state.textContent = r.ok ? '💾 자동 저장됨 ' + moaDate(Date.now(), 'stime') : '⚠️ 저장하지 못했어요. 인터넷 연결을 확인해 주세요.';
      } catch (e) { if (state) state.textContent = '⚠️ 저장하지 못했어요. 인터넷 연결을 확인해 주세요.'; }
      saving = false;
    }, 1200);
  };
  app.addEventListener('input', save);
  app.addEventListener('change', save);
  app.addEventListener('click', e => { if (e.target.closest('.item-remove-btn, #addItemBtn')) save(); });
}

      const d = await post({ action: 'shopJoin', key, name: v('sjName'), email: v('sjEmail'), bookingNo: v('sjBooking'), job: v('sjJob'), company: v('sjCompany'), agreeRefund: true });

async function renderClientEntry(rawCode) {
  document.body.classList.remove('role-teacher');
  document.body.classList.add('role-student');
  document.getElementById('roleBadge').textContent = '개인 고객';
  document.querySelectorAll('.moa-hubbar a').forEach(a => a.style.display = 'none');
  app.innerHTML = `<div class="card"><div class="empty">입장 확인 중...</div></div>`;
  try {
    const res = await fetch('/api/client-code', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'verify', code: rawCode, part: 'resume' })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error(data.error || '입장 코드를 확인하지 못했어요.');
    CLIENT = data.client;
    CLIENT_DRAFT = data.draft && data.draft.data;
    TEACHER_ID = CLIENT.t;
  } catch (e) {
    app.innerHTML = `<div class="card"><h2>입장할 수 없어요</h2><p style="font-size:14px;color:var(--muted);line-height:1.7">${escapeHtml(e.message)}<br>문의: 진로모아커리어센터</p></div>`;
    return;
  }
  if (CLIENT.product === 'interview') {
    app.innerHTML = `${clientBannerHtml()}<div class="card"><h2>모의면접 상품이에요</h2><p style="font-size:14px;color:var(--muted);line-height:1.7">아래 버튼으로 이동해 주세요.</p><a class="btn-primary" style="display:inline-block;text-decoration:none;padding:10px 18px;border-radius:8px" href="${INTERVIEW_APP_URL}?c=${encodeURIComponent(CLIENT.code)}">모의면접 시작하기 →</a></div>`;
    return;
  }
  if (CLIENT.used && CLIENT.used.resume) {
    renderClientDone(CLIENT.used.resume.reviewCode, false);
    return;
  }
  renderStudentSubmitForm();
}

// 제출 직후 / 이미 제출한 고객이 링크를 다시 열었을 때
async function renderClientDone(reviewCode, justNow) {
  const nextStep = CLIENT.product === 'set'
    ? `<div style="margin-top:12px;padding:12px;background:var(--navy-light);border-radius:8px;font-size:13px;line-height:1.7">다음 단계는 <b>② 모의면접</b>이에요. 같은 코드로 바로 이어서 할 수 있어요.${CLIENT.used && CLIENT.used.interview ? '<br><b>모의면접도 제출을 마치셨어요.</b>' : `<div style="margin-top:10px"><a class="btn-primary" style="display:inline-block;text-decoration:none;padding:10px 18px;border-radius:8px" href="${INTERVIEW_APP_URL}?c=${encodeURIComponent(CLIENT.code)}">② 모의면접 시작하기 →</a></div>`}</div>` : '';
  app.innerHTML = `
    ${clientBannerHtml()}
    <div class="card">
      <h2>${justNow ? '제출이 완료됐어요 ✅' : '이미 제출을 마치셨어요'}</h2>
      <p style="font-size:14px;color:var(--muted);line-height:1.7">강사가 AI 첨삭을 직접 검토하고 코멘트를 더한 뒤 결과를 보내드려요. 결과가 준비되면 이메일로 알려드리고, 이 링크를 다시 열어도 확인할 수 있어요.</p>
      ${reviewCode ? `
      <div style="margin-top:10px;padding:12px;background:#fff;border:2px dashed var(--green);border-radius:8px;text-align:center">
        <div style="font-size:12px;color:var(--muted)">내 확인 코드</div>
        <div style="font-size:24px;font-weight:800;color:var(--green);letter-spacing:2px;margin-top:4px">${escapeHtml(reviewCode)}</div>
      </div>` : ''}
      ${nextStep}
      <div id="clientResultArea" style="margin-top:16px"></div>
    </div>`;
  if (!reviewCode || justNow) return;
  const area = document.getElementById('clientResultArea');
  area.innerHTML = `<div class="empty">결과 확인 중...</div>`;
  try {
    const { item } = await api('/api/results?code=' + encodeURIComponent(reviewCode));
    area.innerHTML = resultContentHtml(item);
  } catch (e) {
    area.innerHTML = e.expired
      ? `<div class="empty">⏰ 결과 조회 기간이 지났어요. 진로모아로 문의해 주세요.</div>`
      : `<div class="empty">⏳ 아직 강사가 검토 중이에요. 조금만 기다려 주세요.</div>`;
  }
}

// ---------- 학생 화면 ----------
let studentTab = 'submit';

async function renderStudentView() {
  if (studentTab === 'lookup') { await renderStudentLookup(); return; }
  await renderStudentSubmitForm();
}

function studentTabsHtml() {
  if (CLIENT) return clientBannerHtml();
  return `
    <div class="tabs" style="margin-bottom:0">
      <div class="tab ${studentTab === 'submit' ? 'active' : ''}" id="tabSubmit">첨삭 요청하기</div>
      <div class="tab ${studentTab === 'lookup' ? 'active' : ''}" id="tabLookup">내 결과 확인</div>
    </div>
  `;
}

function wireStudentTabs() {
  if (CLIENT) return;
  document.getElementById('tabSubmit').addEventListener('click', () => { studentTab = 'submit'; renderStudentView(); });
  document.getElementById('tabLookup').addEventListener('click', () => { studentTab = 'lookup'; renderStudentView(); });
}

async function renderStudentLookup() {
  app.innerHTML = `
    ${studentTabsHtml()}
    <div class="card">
      <h2>내 결과 확인</h2>
      <div style="font-size:13px;color:var(--muted);margin-bottom:10px">첨삭 요청 제출 시 받으신 확인 코드를 입력하세요.</div>
      <label>확인 코드</label>
      <input type="text" id="lookupCodeInput" placeholder="예) 7F3K9Q" style="text-transform:uppercase;letter-spacing:2px;font-weight:700">
      <div class="btn-row"><button class="btn-primary" id="lookupBtn">조회하기</button></div>
      <div id="lookupResultArea" style="margin-top:16px"></div>
    </div>
  `;
  wireStudentTabs();

  document.getElementById('lookupBtn').addEventListener('click', async () => {
    const code = document.getElementById('lookupCodeInput').value.trim().toUpperCase();
    const area = document.getElementById('lookupResultArea');
    if (!code) { area.innerHTML = `<div class="empty">코드를 입력해 주세요.</div>`; return; }
    area.innerHTML = `<div class="empty">조회 중...</div>`;
    try {
      const { item } = await api('/api/results?code=' + encodeURIComponent(code));
      area.innerHTML = resultContentHtml(item);
    } catch (e) {
      if (e.expired) {
        area.innerHTML = `<div class="empty">⏰ 조회 가능한 기간이 지났어요. 결과가 다시 필요하시면 강사님께 문의해 주세요.</div>`;
        return;
      }
      try {
        const pending = await api('/api/reviews?code=' + encodeURIComponent(code));
        area.innerHTML = `<div class="empty">${escapeHtml(pending.studentName) || '학생'}님, 아직 강사님이 검토 중입니다. 잠시 후 다시 확인해 주세요.</div>`;
      } catch (e2) {
        area.innerHTML = `<div class="empty">해당 코드를 찾을 수 없습니다. 코드를 다시 확인해 주세요.</div>`;
      }
    }
  });
}

function collectScaffoldMemo(block, type) {
  const sc = SCAFFOLDS[type];
  if (!sc) return [];
  return Array.from(block.querySelectorAll('.sc-memo')).map(inp => {
    const k = parseInt(inp.dataset.k, 10);
    return { label: sc.rows[k] ? sc.rows[k].label : '', value: inp.value.trim() };
  }).filter(m => m.value);
}

function wireScaffold(block, id) {
  const typeSel = block.querySelector('.item-questionType');
  const panel = block.querySelector('.sc-panel');
  const toggle = block.querySelector('.sc-toggle-btn');

  function render() {
    panel.innerHTML = scaffoldHtml(id, typeSel.value);
    const btn = panel.querySelector('.sc-draft-btn');
    if (!btn) return;
    const refresh = () => { btn.disabled = collectScaffoldMemo(block, typeSel.value).length < 2; };
    panel.querySelectorAll('.sc-memo').forEach(inp => inp.addEventListener('input', refresh));
    btn.addEventListener('click', () => makeDraftFromMemo(block, id));
  }
  block._renderScaffold = () => {
    // 채용 방식이 바뀌면 적어둔 메모는 살리고 안내 문구만 다시 그림
    const kept = Array.from(panel.querySelectorAll('.sc-memo')).map(i => i.value);
    render();
    panel.querySelectorAll('.sc-memo').forEach((i, k) => { if (kept[k]) i.value = kept[k]; });
    const btn = panel.querySelector('.sc-draft-btn');
    if (btn) btn.disabled = collectScaffoldMemo(block, typeSel.value).length < 2;
  };

  toggle.addEventListener('click', () => {
    const open = panel.style.display !== 'none';
    if (open) { panel.style.display = 'none'; toggle.textContent = '💡 막막하면 눌러보세요 — 재료 꺼내기'; return; }
    if (!panel.innerHTML.trim()) render();
    panel.style.display = 'block';
    toggle.textContent = '▲ 재료 꺼내기 접기';
  });
  typeSel.addEventListener('change', () => {
    const hasMemo = Array.from(panel.querySelectorAll('.sc-memo')).some(i => i.value.trim());
    if (hasMemo && !confirm('문항 유형이 바뀌면 적어둔 메모 칸이 새로 바뀌어요. 계속할까요?')) {
      return; // 유형은 바뀌지만 메모 칸은 그대로 둠
    }
    render();
  });
}

async function makeDraftFromMemo(block, id) {
  const type = block.querySelector('.item-questionType').value;
  const memo = collectScaffoldMemo(block, type);
  const statusEl = block.querySelector(`.sc-status[data-item-id="${id}"]`);
  const box = block.querySelector(`.sc-drafts[data-item-id="${id}"]`);
  const btn = block.querySelector('.sc-draft-btn');
  if (memo.length < 2) { statusEl.textContent = '2칸 이상 채워주세요.'; return; }
  btn.disabled = true; btn.textContent = '초안 만드는 중...';
  statusEl.textContent = '내 메모로 초안 3가지를 만들고 있어요. 10~20초 정도 걸려요.';
  box.innerHTML = '';
  try {
    const question = block.querySelector('.item-question').value.trim();
    const data = await api('/api/coach', {
      method: 'POST',
      body: JSON.stringify({
        mode: 'draft',
        questionType: type,
        question,
        memo,
        hiringType: currentHiringType(),
        charLimit: extractCharLimit(question)
      })
    });
    const drafts = Array.isArray(data.drafts) ? data.drafts : [];
    if (!drafts.length) throw new Error('초안을 받지 못했어요. 다시 눌러주세요.');
    statusEl.innerHTML = '마음에 드는 초안을 넣고, <b>꼭 내 말투로 고쳐서</b> 제출하세요. [대괄호] 자리는 직접 채워요.';
    box.innerHTML = drafts.map((d, k) => `
      <div style="background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px">
        <span class="star-tag ok">${escapeHtml(d.opener || '초안 ' + (k + 1))}</span>
        <p style="white-space:pre-wrap;font-size:14px;line-height:1.7;margin:6px 0">${escapeHtml(d.text || '')}</p>
        <button type="button" class="btn-secondary sc-use-btn" data-k="${k}" style="font-size:13px;padding:6px 12px">이 초안 답변 칸에 넣기</button>
      </div>`).join('');
    box.querySelectorAll('.sc-use-btn').forEach(b => b.addEventListener('click', () => {
      const answer = block.querySelector('.item-answer');
      if (answer.value.trim() && !confirm('답변 칸에 이미 적힌 내용이 있어요. 초안으로 바꿀까요?')) return;
      answer.value = drafts[parseInt(b.dataset.k, 10)].text || '';
      answer.dispatchEvent(new Event('input'));
      answer.focus();
    }));
  } catch (e) {
    statusEl.textContent = '초안을 만들지 못했어요: ' + e.message;
  }
  btn.disabled = false; btn.textContent = '✏️ 내 메모로 초안 만들기';
}

function wireItemBlock(id, docTypeSelect) {
  const block = document.querySelector(`.item-block[data-item-id="${id}"]`);
  const questionInput = block.querySelector('.item-question');
  const answerInput = block.querySelector('.item-answer');
  const counterBox = block.querySelector('.item-char-counter');
  const questionTypeSelect = block.querySelector('.item-questionType');

  function updateCounter() {
    const len = answerInput.value.length;
    const limit = extractCharLimit(questionInput.value);
    if (limit) {
      const over = len > limit;
      counterBox.innerHTML = `<span class="item-char-count">${len}</span>자 작성됨 / <b>${limit}자 제한</b>${over ? ` <span style="color:var(--miss);font-weight:700">(${len - limit}자 초과!)</span>` : ''}`;
      counterBox.style.color = over ? 'var(--miss)' : '';
    } else {
      counterBox.innerHTML = `<span class="item-char-count">${len}</span>자 작성됨`;
      counterBox.style.color = '';
    }
  }
  answerInput.addEventListener('input', updateCounter);
  questionInput.addEventListener('input', updateCounter);

  const updatePlaceholder = () => { questionInput.placeholder = QUESTION_EXAMPLES[questionTypeSelect.value] || ''; };
  updatePlaceholder();
  questionTypeSelect.addEventListener('change', () => { updatePlaceholder(); updateCounter(); });

  wireScaffold(block, id);
  applyDocTypeToBlock(id, docTypeSelect.value);

  block.querySelector('.item-remove-btn').addEventListener('click', () => {
    const allBlocks = document.querySelectorAll('.item-block');
    if (allBlocks.length <= 1) { alert('최소 1개의 문항은 있어야 해요.'); return; }
    block.remove();
  });
}

function applyDocTypeToBlock(id, docTypeVal) {
  const block = document.querySelector(`.item-block[data-item-id="${id}"]`);
  const typeRow = block.querySelector('.item-questionType-row');
  const qLabel = block.querySelector('.item-question-label');
  const aLabel = block.querySelector('.item-answer-label');
  const questionInput = block.querySelector('.item-question');
  const answerInput = block.querySelector('.item-answer');
  const questionTypeSelect = block.querySelector('.item-questionType');
  const scToggle = block.querySelector('.sc-toggle-btn');
  const scPanel = block.querySelector('.sc-panel');
  if (scToggle) scToggle.style.display = docTypeVal === 'cv' ? 'none' : '';
  if (scPanel && docTypeVal === 'cv') scPanel.style.display = 'none';
  if (docTypeVal === 'cv') {
    typeRow.style.display = 'none';
    qLabel.textContent = '경력·활동 항목명';
    questionInput.placeholder = '예) 마케팅 서포터즈 활동 (2024.03~2024.08)';
    aLabel.textContent = '작성한 한 줄 소개 (경력기술서 문장)';
    answerInput.placeholder = '예) SNS 콘텐츠 기획 및 운영을 담당하여 팔로워를 6개월간 40% 증가시킴';
  } else {
    typeRow.style.display = '';
    qLabel.textContent = '자소서 문항';
    questionInput.placeholder = QUESTION_EXAMPLES[questionTypeSelect.value] || '';
    aLabel.textContent = '작성한 답변';
    answerInput.placeholder = '여기에 답변을 붙여넣거나 작성해 주세요.';
  }
}

        <div id="clientSaveState" style="color:var(--muted);font-size:12px;margin-top:4px"></div>
      </div>` : ''}
      <div class="btn-row">
        <button class="btn-primary" id="submitBtn">${CLIENT ? (CLIENT.product === 'set' ? '자기소개서 제출하고 ② 모의면접으로' : '최종 제출하기') : '전체 제출하기'}</button>
      </div>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  `;

  wireStudentTabs();

  const docTypeSelect = document.getElementById('docTypeSelect');
  const itemsContainer = document.getElementById('itemsContainer');

  itemsContainer.insertAdjacentHTML('beforeend', itemBlockHtml(firstId));
  wireItemBlock(firstId, docTypeSelect);

  if (CLIENT) {
    if (CLIENT.job) document.getElementById('jobPostingInput').value = CLIENT.job;
    if (CLIENT.name) document.getElementById('studentNameInput').value = CLIENT.name;
    if (CLIENT.company) document.getElementById('targetCompanyInput').value = CLIENT.company;
  }

  document.getElementById('addItemBtn').addEventListener('click', () => {
    if (CLIENT && document.querySelectorAll('.item-block').length >= (CLIENT.maxItems || CLIENT.items.length)) {
      alert(`이 상품은 문항을 최대 ${(CLIENT.maxItems || CLIENT.items.length)}개까지 넣을 수 있어요.`);
      return;
    }
    const id = itemCounter++;
    itemsContainer.insertAdjacentHTML('beforeend', itemBlockHtml(id));
    wireItemBlock(id, docTypeSelect);
  });

  document.querySelectorAll('input[name="hiringType"]').forEach(r => r.addEventListener('change', () => {
    document.querySelectorAll('.item-block').forEach(b => {
      const panel = b.querySelector('.sc-panel');
      if (b._renderScaffold && panel && panel.innerHTML.trim()) b._renderScaffold();
    });
  }));

  docTypeSelect.addEventListener('change', () => {
    document.querySelectorAll('.item-block').forEach(b => {
      applyDocTypeToBlock(parseInt(b.getAttribute('data-item-id'), 10), docTypeSelect.value);
    });
  });

  const presetSelect = document.getElementById('presetSelect');
  try {
    const { config } = await api('/api/config');
    const wantId = CLIENT && CLIENT.presetId && config.presets.some(p => p.id === CLIENT.presetId) ? CLIENT.presetId : config.activePresetId;
    presetSelect.innerHTML = config.presets.map(p =>
      `<option value="${p.id}" ${p.id === wantId ? 'selected' : ''}>${escapeHtml(p.name)}</option>`
    ).join('');
  } catch (e) {
    presetSelect.innerHTML = `<option value="default">기본</option>`;
  }

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const studentName = document.getElementById('studentNameInput').value.trim();
    const studentEmail = document.getElementById('studentEmailInput').value.trim();
    const jobPosting = document.getElementById('jobPostingInput').value.trim();
    const targetCompany = document.getElementById('targetCompanyInput').value.trim();
    const statusMsg = document.getElementById('statusMsg');
    const submitBtn = document.getElementById('submitBtn');
    const isCv = docTypeSelect.value === 'cv';

    if (!studentName) {
      statusMsg.textContent = '이름을 입력해 주세요.';
      statusMsg.className = 'status-msg error';
      statusMsg.style.display = 'block';
      return;
    }

    const blocks = Array.from(document.querySelectorAll('.item-block'));
    const rawItems = blocks.map(b => ({
      question: b.querySelector('.item-question').value.trim(),
      answer: b.querySelector('.item-answer').value.trim(),
      questionType: isCv ? '이력서항목' : b.querySelector('.item-questionType').value,
      framework: isCv ? 'RESUME' : b.querySelector('.item-questionType').selectedOptions[0].dataset.fw,
      selfIntent: b.querySelector('.item-selfIntent').value.trim(),
      previousAnswer: b.querySelector('.item-prevAnswer').value.trim(),
      charLimit: extractCharLimit(b.querySelector('.item-question').value),
      hiringType: currentHiringType(),
      memo: isCv ? [] : collectScaffoldMemo(b, b.querySelector('.item-questionType').value)
    }));

    if (rawItems.some(it => !it.question || !it.answer)) {
      statusMsg.textContent = '모든 문항에 문항 내용과 답변을 입력해 주세요.';
      statusMsg.className = 'status-msg error';
      statusMsg.style.display = 'block';
      return;
    }

    // 재료 인터뷰 (2026-10-02): 답변이 글자수 제한의 절반에 못 미치면 첨삭 전에 짧은 질문 3개
    if (!isCv) {
      const shortOnes = rawItems.map((it, i) => ({ it, i }))
        .filter(({ it }) => it.charLimit && it.answer.length < it.charLimit * 0.5 && (it.memo || []).length < 2 && SCAFFOLDS[it.questionType]);
      if (shortOnes.length) {
        const notes = await askMaterialInterview(shortOnes.map(x => x.it));
        if (notes === null) return; // '답변 더 쓰러 가기' → 제출 멈춤
        notes.forEach((arr, j) => { if (arr.length) rawItems[shortOnes[j].i].interviewNotes = arr; });
      }
    }

    if (CLIENT && CLIENT.hold && !(await clientHoldCleared())) {
      statusMsg.textContent = '⏳ ' + CLIENT_HOLD_MSG;
      statusMsg.className = 'status-msg error';
      statusMsg.style.display = 'block';
      return;
    }
    if (CLIENT && !(await refundSubmitConfirm({ color: '#643DF2', title: `문항 ${rawItems.length}개를 최종 제출할까요?`, body: '제출은 <b>한 번만</b> 가능하고, 제출 후에는 수정할 수 없어요. 빠진 문항이나 고칠 곳이 없는지 한 번 더 확인해 주세요.', setNote: CLIENT.product === 'set' ? '■ 세트 상품: 자소서 제출 후 모의면접 제출 전 취소 시 40,000원 환불 / 두 항목 모두 제출 후 환불 불가' : '' }))) return;

    submitBtn.disabled = true;
    // 개인 고객·수강생 모두 같은 안내 (2026-10-02, 긴 문항은 최대 3분 걸릴 수 있음)
    submitBtn.textContent = `제출하는 중이에요... (1~3분 · 화면을 닫지 마세요)`;
    statusMsg.style.display = 'none';

    try {
      const { config } = await api('/api/config').catch(() => ({ config: { presets: [] } }));
      const preset = (config.presets || []).find(p => p.id === presetSelect.value);

      const itemsWithDraft = await Promise.all(rawItems.map(async (it) => {
        const aiDraft = await api('/api/feedback', {
          method: 'POST',
          body: JSON.stringify({ ...it, presetPrompt: (preset ? preset.prompt : '') + aspirationExtra(it.questionType, targetCompany), jobPosting })
        });
        return { ...it, aiDraft };
      }));

      const studentInstitution = institutions.length ? document.getElementById('institutionSelect').value : '';

      const reviewRes = await api('/api/reviews', {
        method: 'POST',
        body: JSON.stringify({ studentName, studentEmail, presetId: presetSelect.value, docType: docTypeSelect.value, jobPosting, studentInstitution: CLIENT ? '개인 고객' : studentInstitution, items: itemsWithDraft, ...(CLIENT ? { clientCode: CLIENT.code, refundAgreedAt: Date.now() } : {}) })
      });

      if (CLIENT) { renderClientDone(reviewRes.code, true); return; }
      localStorage.setItem(countKey, String(usedCount + 1));

      statusMsg.innerHTML = `
        제출이 완료되었습니다. 강사님 검수 후 결과를 확인하실 수 있어요.<br>
        <div style="margin-top:10px;padding:12px;background:#fff;border:2px dashed var(--green);border-radius:8px;text-align:center">
          <div style="font-size:12px;color:var(--muted)">내 확인 코드 (꼭 저장해두세요!)</div>
          <div style="font-size:24px;font-weight:800;color:var(--green);letter-spacing:2px;margin-top:4px">${reviewRes.code}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px">나중에 이 화면 위쪽 "내 결과 확인"에서 이 코드로 조회하세요.</div>
        </div>
      `;
      statusMsg.className = 'status-msg';
      statusMsg.style.display = 'block';
      document.getElementById('itemsContainer').innerHTML = '';
      document.getElementById('addItemBtn').style.display = 'none';
      submitBtn.style.display = 'none';
    } catch (e) {
      if (CLIENT && !/예약 확인|환불 처리|이미 제출/.test(e.message)) { try { fetch('/api/client-code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'reportError', code: CLIENT.code, where: '자소서 최종 제출', message: e.message }) }); } catch (x) {} }
      statusMsg.textContent = '오류가 발생했습니다: ' + e.message;
      statusMsg.className = 'status-msg error';
      statusMsg.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = CLIENT ? (CLIENT.product === 'set' ? '자기소개서 제출하고 ② 모의면접으로' : '최종 제출하기') : '전체 제출하기';
    }
  });
  if (CLIENT) clientWireDraft(presetSelect, docTypeSelect);
}

        <div style="font-size:13px;color:var(--muted);margin-bottom:8px">학생들에게 이 화면을 보여주거나 프린트해서 교실에 붙여두면, 카메라로 스캔해서 바로 접속할 수 있습니다. QR코드 이미지를 클릭하면 다운로드됩니다.</div>
        <div class="link-box" style="display:flex">
          <span style="word-break:break-all">${studentLink}</span>
          <button class="btn-secondary" style="margin-left:auto" onclick="navigator.clipboard.writeText('${studentLink}')">링크 복사</button>
        </div>
      </div>
    </div>
    <div class="tabs">
      <div class="tab" data-tab="reviews">검수 대기함</div>
      <div class="tab" data-tab="presets">첨삭 기준 프리셋</div>
      <div class="tab" data-tab="results">완료된 첨삭</div>
      <div class="tab" data-tab="notify">알림 설정</div>
      ${isPermanentTeacher ? '<div class="tab" data-tab="guide">기능 안내</div>' : ''}
    </div>
    <div id="tabContent"></div>
  `;

  document.getElementById('qrImage').addEventListener('click', async () => {
    try {
      const res = await fetch(qrUrl);
      const blob = await res.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = '자소서첨삭-학생용-QR코드.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(blobUrl);
    } catch (e) {
      window.open(qrUrl, '_blank');
    }
  });

  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === currentTab);
    t.addEventListener('click', () => { currentTab = t.dataset.tab; renderTeacherView(); });
  });

  const content = document.getElementById('tabContent');
  if (currentTab === 'reviews') await renderReviewsTab(content);
  else if (currentTab === 'presets') await renderPresetsTab(content);
  else if (currentTab === 'notify') await renderNotifyTab(content);
  else if (currentTab === 'guide') renderGuideTab(content);
  else await renderResultsTab(content);
}

  });

async function renderReviewsTab(content) {
  content.innerHTML = `<div class="card"><h2>검수 대기함</h2><div id="reviewsList" class="empty">불러오는 중...</div></div>`;
  const listEl = document.getElementById('reviewsList');
  try {
    const [{ items }, configRes] = await Promise.all([
      api('/api/reviews'),
      api('/api/config').catch(() => ({ config: { presets: [] } }))
    ]);
    const presetNameMap = {};
    (configRes.config.presets || []).forEach(p => { presetNameMap[p.id] = p.name; });

    if (!items.length) {
      listEl.innerHTML = `<div class="empty">대기 중인 첨삭이 없습니다.</div>`;
      return;
    }
    listEl.innerHTML = '';
    items.forEach(item => listEl.appendChild(buildReviewCard(item, presetNameMap[item.presetId] || '기본')));
  } catch (e) {
    listEl.innerHTML = `<div class="empty">불러오기 실패: ${escapeHtml(e.message)}</div>`;
  }
}

function diffWords(oldStr, newStr) {
  const a = (oldStr || '').split(/\s+/).filter(Boolean);
  const b = (newStr || '').split(/\s+/).filter(Boolean);
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) {
    for (let j = n - 1; j >= 0; j--) {
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  let i = 0, j = 0;
  const ops = [];
  while (i < m && j < n) {
    if (a[i] === b[j]) { ops.push({ type: 'same', text: a[i] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ type: 'removed', text: a[i] }); i++; }
    else { ops.push({ type: 'added', text: b[j] }); j++; }
  }
  while (i < m) { ops.push({ type: 'removed', text: a[i] }); i++; }
  while (j < n) { ops.push({ type: 'added', text: b[j] }); j++; }
  return ops;
}

function diffHtml(oldStr, newStr) {
  if (!oldStr) return '';
  return diffWords(oldStr, newStr).map(o => {
    if (o.type === 'same') return escapeHtml(o.text);
    if (o.type === 'removed') return `<span style="text-decoration:line-through;color:var(--miss);background:var(--miss-bg);padding:0 2px;border-radius:3px">${escapeHtml(o.text)}</span>`;
    return `<span style="color:var(--ok);background:var(--ok-bg);padding:0 2px;border-radius:3px;font-weight:700">${escapeHtml(o.text)}</span>`;
  }).join(' ');
}

      </div>
      <div class="star-row">${structureTagsHtml(framework, d.structure)}</div>
      <div class="star-row">${concretenessTagsHtml(d.concreteness)}</div>
      ${riskFlagsHtml(d.riskFlags)}
      ${aiTracePhrasesHtml(d.aiTracePhrases)}

      ${item.previousAnswer ? `<div class="field-block"><div class="fb-label">Before → After 비교</div><p style="white-space:pre-wrap;line-height:1.9">${diffHtml(item.previousAnswer, item.answer)}</p>${d.revisionComment ? `<p style="margin-top:8px;font-size:13px;color:var(--navy)"><b>수정 평가:</b> ${escapeHtml(d.revisionComment)}</p>` : ''}</div>` : ''}

function buildReviewCard(record, presetName) {
  const wrap = document.createElement('div');
  wrap.className = 'review-item';
  const items = record.items || [];
  wrap.innerHTML = `
    <details>
      <summary style="cursor:pointer">
        <span style="font-weight:700;color:var(--navy);font-size:15px">${escapeHtml(record.studentName) || '(이름 없음)'}</span>
        <span class="star-tag ok" style="margin-left:6px">${escapeHtml(presetName || '기본')}</span>
        ${record.studentInstitution ? `<span class="star-tag ok" style="margin-left:4px">${escapeHtml(record.studentInstitution)}</span>` : ''}
        ${record.clientCode ? `<span class="star-tag" style="margin-left:4px;background:#FFF4DC;color:#9A6200">👤 개인 고객 ${escapeHtml(record.clientCode)}${record.clientMemo ? ' · ' + escapeHtml(record.clientMemo) : ''}</span>` : ''}
        <span style="font-size:12px;color:var(--muted);margin-left:8px">문항 ${items.length}개 · 코드 ${escapeHtml(record.code) || '-'} · ${moaDate(record.createdAt, 'time')} · 클릭해서 펼치기</span>
      </summary>
      <div style="margin-top:14px">
        ${record.jobPosting ? `<div class="field-block"><div class="fb-label">지원 채용공고 핵심 내용 (전체 문항 공통)</div><p style="white-space:pre-wrap">${escapeHtml(record.jobPosting)}</p></div>` : ''}
        ${items.map((it, idx) => reviewItemBlockHtml(it, idx)).join('')}
        <div class="btn-row">
          <button class="btn-primary approve-btn">전체 승인 및 링크 생성</button>
          <button class="btn-danger reject-btn">삭제</button>
        </div>
        <div class="link-box" style="display:none"></div>
      </div>
    </details>
  `;

  wrap.querySelector('.approve-btn').addEventListener('click', async (e) => {
    const btn = e.target;
    btn.disabled = true;
    btn.textContent = '처리 중...';
    try {
      const finalItems = items.map((it, idx) => {
        const d = it.aiDraft || {};
        const framework = d.frameworkUsed || it.framework || 'STAR';
        return {
          questionType: it.questionType,
          question: it.question,
          answer: it.answer,
          frameworkUsed: framework,
          structure: d.structure,
          concreteness: d.concreteness,
          riskFlags: d.riskFlags || [],
          aiTracePhrases: d.aiTracePhrases || [],
          redFlags: Array.isArray(d.redFlags)
            ? d.redFlags.filter((_, k) => {
                const cb = wrap.querySelector(`.rf-keep[data-idx="${idx}"][data-k="${k}"]`);
                return !cb || cb.checked;
              })
            : undefined,
          interviewerInference: d.interviewerInference,
          defenseQuestions: (Array.isArray(d.defenseQuestions) ? d.defenseQuestions : []).map((dq, k) => {
            const ta = wrap.querySelector(`.edit-def-q[data-idx="${idx}"][data-k="${k}"]`);
            return { sentence: dq.sentence, question: ta ? ta.value.trim() : dq.question };
          }).filter(dq => dq.sentence && dq.question),
          jobMatch: d.jobMatch || null,
          intentGapComment: d.intentGapComment || null,
          previousAnswer: it.previousAnswer || null,
          revisionComment: d.revisionComment || null,
          charLimit: it.charLimit || null,
          charLimitNote: d.charLimitNote || null,
          missingElements: d.missingElements || [],
          strengths: wrap.querySelector(`.edit-strengths[data-idx="${idx}"]`).value,
          improvements: wrap.querySelector(`.edit-improvements[data-idx="${idx}"]`).value,
          polishedText: wrap.querySelector(`.edit-polished[data-idx="${idx}"]`).value,
          exampleSlots: Array.isArray(d.exampleSlots) ? d.exampleSlots : [],
          followUpQuestions: {
            reasonType: wrap.querySelector(`.edit-fu-reason[data-idx="${idx}"]`).value,
            alternativeType: wrap.querySelector(`.edit-fu-alt[data-idx="${idx}"]`).value,
            quantifyType: wrap.querySelector(`.edit-fu-quant[data-idx="${idx}"]`).value
          }
        };
      });

      const payload = {
        studentName: record.studentName || '',
        studentEmail: record.studentEmail || '',
        code: record.code || '',
        presetName: presetName || '기본',
        docType: record.docType || 'resume',
        jobPosting: record.jobPosting || '',
        studentInstitution: record.studentInstitution || '',
        clientCode: record.clientCode || '',
        items: finalItems
      };
      const { id } = await api('/api/results', { method: 'POST', body: JSON.stringify(payload) });
      await api('/api/reviews?id=' + record.id, { method: 'DELETE' });

      const link = location.origin + location.pathname + '?t=' + encodeURIComponent(TEACHER_ID) + '#result=' + id;
      const linkBox = wrap.querySelector('.link-box');
      linkBox.style.display = 'flex';
      linkBox.innerHTML = `<span>학생 결과 링크:</span> <a href="${link}" target="_blank">${link}</a>
        <button class="btn-secondary" style="margin-left:auto" onclick="navigator.clipboard.writeText('${link}')">복사</button>`;
      btn.textContent = '승인 완료';
    } catch (err) {
      alert('오류: ' + err.message);
      btn.disabled = false;
      btn.textContent = '전체 승인 및 링크 생성';
    }
  });

  wrap.querySelector('.reject-btn').addEventListener('click', async () => {
    if (!confirm('이 검수 항목을 삭제할까요?')) return;
    await api('/api/reviews?id=' + record.id, { method: 'DELETE' });
    wrap.remove();
  });

  return wrap;
}

  content.innerHTML = `
    <div class="card">
      <details>
        <summary style="cursor:pointer;font-weight:700;color:var(--navy)">추천 프리셋 라이브러리 (클릭해서 펼치기)</summary>
        <div style="font-size:13px;color:var(--muted);margin:10px 0">자주 쓰이는 직군별 평가기준입니다. 클릭하면 바로 추가됩니다.</div>
        <div id="libraryList"></div>
      </details>
    </div>
    <div class="card">
      <h2>첨삭 기준 프리셋 관리</h2>
      <details open>
        <summary style="cursor:pointer;font-weight:700;color:var(--navy)">등록된 프리셋 목록 (클릭해서 접기/펼치기)</summary>
        <div id="presetList" class="empty" style="margin-top:10px">불러오는 중...</div>

      <label>새 프리셋 이름</label>
      <input type="text" id="newPresetName" placeholder="예) 사회복지과, 항공서비스과, 직설적인 톤 등">
      <label>추가 지침 (톤·평가기준·직군 특성 등을 문장으로 작성)</label>
      <textarea id="newPresetPrompt" placeholder="예) 사회복지 직무 특성상 공감·소통 역량이 드러나는지 특히 중점적으로 봐 주세요."></textarea>
      <div class="btn-row"><button class="btn-primary" id="addPresetBtn">프리셋 추가</button></div>
    </div>
  `;

  let config = { presets: [], activePresetId: 'default' };
  try {
    const r = await api('/api/config');
    config = r.config;
  } catch (e) { /* 기본값 사용 */ }

  const libraryEl = document.getElementById('libraryList');
  libraryEl.innerHTML = PRESET_LIBRARY.map((lib, i) => {
    const already = config.presets.some(p => p.name === lib.name);
    return `<div class="preset-item">
      <div><b>${escapeHtml(lib.name)}</b>
        <details style="margin-top:4px">
          <summary style="cursor:pointer;font-size:12px;color:var(--navy)">지침 보기</summary>
          <div style="font-size:12px;color:var(--muted);margin-top:6px;white-space:pre-wrap">${escapeHtml(lib.prompt)}</div>
        </details>
      </div>
      <button class="btn-secondary lib-add-btn" data-i="${i}" ${already ? 'disabled' : ''}>${already ? '추가됨' : '추가하기'}</button>
    </div>`;
  }).join('');
  libraryEl.querySelectorAll('.lib-add-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const lib = PRESET_LIBRARY[btn.dataset.i];
      config.presets.push({ id: 'p_' + Date.now(), name: lib.name, prompt: lib.prompt });
      await api('/api/config', { method: 'POST', body: JSON.stringify(config) });
      renderPresetsTab(content);
    });
  });

  renderPresetList(config);

  document.getElementById('addPresetBtn').addEventListener('click', async () => {
    const name = document.getElementById('newPresetName').value.trim();
    const prompt = document.getElementById('newPresetPrompt').value.trim();
    if (!name) { alert('프리셋 이름을 입력해 주세요.'); return; }
    const id = 'p_' + Date.now();
    config.presets.push({ id, name, prompt });
    await api('/api/config', { method: 'POST', body: JSON.stringify(config) });
    renderPresetsTab(content);
  });

  function renderPresetList(cfg) {
    const listEl = document.getElementById('presetList');
    if (!cfg.presets.length) { listEl.innerHTML = `<div class="empty">등록된 프리셋이 없습니다.</div>`; return; }
    listEl.innerHTML = '';
    cfg.presets.forEach(p => {
      const row = document.createElement('div');
      row.className = 'preset-item';
      row.innerHTML = `
        <div style="flex:1 1 100%;min-width:0">
          <b>${escapeHtml(p.name)}</b>${p.id === cfg.activePresetId ? ' <span class="star-tag ok">기본값</span>' : ''}

            <summary style="cursor:pointer;font-size:12px;color:var(--navy)">지침 보기</summary>

          </details>
          <div class="prompt-edit" style="display:none;margin-top:6px">
            <textarea class="prompt-edit-input" style="min-height:240px">${escapeHtml(p.prompt)}</textarea>
            <div class="btn-row" style="margin-top:6px">
              <button class="btn-primary save-prompt-btn">저장</button>
              <button class="btn-secondary cancel-edit-btn">취소</button>
            </div>
          </div>
        </div>
        <div class="btn-row" style="margin:0">
          <button class="btn-secondary edit-prompt-btn">지침 수정</button>
          <button class="btn-secondary set-default-btn">기본값으로</button>
          <button class="btn-danger delete-btn">삭제</button>
        </div>
      `;
      row.querySelector('.edit-prompt-btn').addEventListener('click', () => {
        row.querySelector('.prompt-display').style.display = 'none';
        row.querySelector('.prompt-edit').style.display = 'block';
      });
      row.querySelector('.cancel-edit-btn').addEventListener('click', () => {
        row.querySelector('.prompt-display').style.display = '';
        row.querySelector('.prompt-edit').style.display = 'none';
      });
      row.querySelector('.save-prompt-btn').addEventListener('click', async () => {
        p.prompt = row.querySelector('.prompt-edit-input').value.trim();
        await api('/api/config', { method: 'POST', body: JSON.stringify(cfg) });
        renderPresetsTab(content);
      });
      row.querySelector('.set-default-btn').addEventListener('click', async () => {
        cfg.activePresetId = p.id;
        await api('/api/config', { method: 'POST', body: JSON.stringify(cfg) });
        renderPresetsTab(content);
      });
      row.querySelector('.delete-btn').addEventListener('click', async () => {
        if (p.id === 'default') { alert('기본 프리셋은 삭제할 수 없습니다.'); return; }
        cfg.presets = cfg.presets.filter(x => x.id !== p.id);
        await api('/api/config', { method: 'POST', body: JSON.stringify(cfg) });
        renderPresetsTab(content);
      });
      listEl.appendChild(row);
    });
  }
}

async function renderResultsTab(content) {
  content.innerHTML = `
    <div class="card">
      <h2>완료된 첨삭 목록</h2>
      <div class="btn-row" style="margin-top:0;align-items:center">
        <div style="flex:1;min-width:160px">
          <label style="margin-top:0">전공(첨삭 기준) 필터</label>
          <select id="filterPreset"><option value="__all__">전체 (전공별로 묶어보기)</option></select>
        </div>
        <div style="flex:1;min-width:160px">
          <label style="margin-top:0">정렬</label>
          <select id="sortOrder">
            <option value="recent">최신순</option>
            <option value="oldest">오래된순</option>
            <option value="name">이름 가나다순</option>
          </select>
        </div>
      </div>
      <div id="resultsList" class="empty" style="margin-top:14px">불러오는 중...</div>
    </div>
  `;
  const listEl = document.getElementById('resultsList');
  const filterSelect = document.getElementById('filterPreset');
  const sortSelect = document.getElementById('sortOrder');

  let allItems = [];
  try {
    const { items } = await api('/api/results?list=1');
    allItems = items;
  } catch (e) {
    listEl.innerHTML = `<div class="empty">불러오기 실패: ${escapeHtml(e.message)}</div>`;
    return;
  }

  if (!allItems.length) { listEl.innerHTML = `<div class="empty">완료된 첨삭이 없습니다.</div>`; return; }

  const presetNames = [...new Set(allItems.map(it => it.presetName || '기본'))].sort((a, b) => a.localeCompare(b, 'ko'));
  filterSelect.innerHTML = `<option value="__all__">전체 (전공별로 묶어보기)</option>` +
    presetNames.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');

  function sortItems(items) {
    const sorted = [...items];
    if (sortSelect.value === 'name') {
      sorted.sort((a, b) => (a.studentName || '').localeCompare(b.studentName || '', 'ko'));
    } else if (sortSelect.value === 'oldest') {
      sorted.sort((a, b) => a.approvedAt - b.approvedAt);
    } else {
      sorted.sort((a, b) => b.approvedAt - a.approvedAt);
    }
    return sorted;
  }

  function buildResultRow(it) {
    const link = location.origin + location.pathname + '?t=' + encodeURIComponent(TEACHER_ID) + '&admin=1#result=' + it.id;
    const expiredBadge = it.expiresAt ? (Date.now() > it.expiresAt ? '<span class="star-tag miss" style="margin-left:6px">학생 조회 만료</span>' : `<span class="star-tag ok" style="margin-left:6px">${daysRemainingText(it.expiresAt)}</span>`) : '';
    const row = document.createElement('div');
    row.className = 'preset-item';
    row.innerHTML = `
      <div><b>${escapeHtml(it.studentName) || '(이름 없음)'}</b> — 문항 ${it.itemCount || 1}개${it.clientCode ? '<span class="star-tag" style="margin-left:6px;background:#FFF4DC;color:#9A6200">👤 개인 고객</span>' : ''}${expiredBadge}<div style="font-size:12px;color:var(--muted)">${moaDate(it.approvedAt, 'time')}${it.code ? ' · 확인코드 <b style="color:var(--green);letter-spacing:1px">' + escapeHtml(it.code) + '</b>' : ''}</div></div>

    exCopyText(exCompose(st, false)); return;
  }
  if (t.classList.contains('ex-copy-final')) {
    const left = (st.finalText.match(EX_RE) || []).length;
    if (left && !exLeftWarn(left)) return;
    exCopyText(exPlain(st.finalText)); return;
  }
  if (t.classList.contains('ex-finish')) {
    const left = exLeft(st);
    if (left && !exLeftWarn(left)) return;
    st.busy = true; st.open = -1; exRefresh(st);
    try {
      const r = await api('/api/coach', { method: 'POST', body: JSON.stringify({ mode: 'finish', text: exCompose(st, true), charLimit: st.charLimit }) });
      st.finalText = r.text || '';
      exSave(st);
    } catch (err) { alert('완성하지 못했어요: ' + err.message); }
    st.busy = false; exRefresh(st);
  }
});

function resolveCssVarsForExport(html) {
  const rootStyle = getComputedStyle(document.documentElement);
  return html.replace(/var\((--[a-zA-Z0-9-]+)\)/g, (match, varName) => {

}

  const exLeftCount = Object.values(EX_STATE).reduce((n, st) => n + exLeft(st), 0);
  if (exLeftCount && !exLeftWarn(exLeftCount)) return;
  const styles = Array.from(document.querySelectorAll('style, link[rel="stylesheet"]')).map(el => el.outerHTML).join('');
  const frame = document.createElement('iframe');
  frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(frame);
  const doc = frame.contentWindow.document;
  doc.open();
  doc.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${escapeHtml(resultFileBase(studentName))}</title>${styles}
  <style>
    @page { size:A4; margin:14mm; }
    html,body{background:#fff !important}
    body{padding:0 !important;margin:0 !important}
    *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
    .ex-interactive,.def-interactive,button{display:none !important}
    .result-block,.proof-note,.ex-final,.pc-item{break-inside:avoid;page-break-inside:avoid}
    .ex-slot{cursor:default}
  </style></head><body><div class="card" style="border:none;box-shadow:none;max-width:none;padding:0">
    <div style="font-size:11px;font-weight:800;color:#643DF2;letter-spacing:1px;margin-bottom:6px">MOA FORMULA · 진로모아커리어센터</div>
    ${area.innerHTML}</div></body></html>`);
  doc.close();
  const go = () => { try { frame.contentWindow.focus(); frame.contentWindow.print(); } catch (e) { window.print(); } setTimeout(() => frame.remove(), 60000); };
  // 글꼴이 다 불러와진 뒤 인쇄
  if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(() => setTimeout(go, 300)); else setTimeout(go, 800);
}

async function renderResultView(id) {
  app.innerHTML = `<div class="card"><div class="empty">결과를 불러오는 중...</div></div>`;
  try {
    const { item } = await api('/api/results?id=' + encodeURIComponent(id) + (isAdmin ? '&admin=1' : ''));
    app.innerHTML = resultContentHtml(item);
  } catch (e) {
    if (e.expired) {
      app.innerHTML = `<div class="card"><div class="empty">⏰ 조회 가능한 기간이 지났어요. 결과가 다시 필요하시면 강사님께 문의해 주세요.</div></div>`;
      return;
    }
    app.innerHTML = `<div class="card"><div class="empty">결과를 불러올 수 없습니다: ${escapeHtml(e.message)}</div></div>`;
  }
}

route();
