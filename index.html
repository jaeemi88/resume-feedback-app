<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>
//     =   ,    /go/   →   ?shop=   
(function(){var m=location.pathname.match(/^\/go\/([A-Za-z0-9_-]{6,40})\/?$/);if(m)history.replaceState(null,'','/?shop='+m[1]);})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>·  — </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Noto+Serif+KR:wght@400;600&display=swap">
<meta name="theme-color" content="#643DF2">
<style>
  :root{
    --bg:#ffffff;
    --text:#1a2130;
    --muted:#6b7280;
    --green:#643DF2;
    --green-light:#EFEAFE;
    --navy:#3A1F9E;
    --navy-light:#F1EDFE;
    --border:#e2e5ea;
    --line:#e2e5ea;
    --warn:#b45309;
    --warn-bg:#fef3e2;
    --ok:#1b4332;
    --ok-bg:#e8f0ec;
    --miss:#b91c1c;
    --miss-bg:#fdecec;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans KR',' ','Malgun Gothic',-apple-system,sans-serif;
    line-height:1.6;
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  header{
    background:var(--green);
    color:#fff;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  header .header-sub{
    font-size:12px;
    color:rgba(255,255,255,.65);
    margin-bottom:4px;
    letter-spacing:.2px;
    display:flex;
    align-items:center;
    gap:5px;
  }
  header .header-sub .brand-logo{
    width:14px;
    height:14px;
    flex-shrink:0;
  }
  header .header-sub .brand-name{
    color:#C0D904;
    font-weight:700;
  }
  header h1{
    font-size:20px;
    margin:0;
    font-weight:600;
  }
  header .badge{
    font-size:12px;
    font-weight:700;
    background:#EAF2AE;
    color:#3A1F9E;
    padding:4px 10px;
    border-radius:999px;
  }
  body.role-teacher header .badge{
    background:#C0D904;
    color:#3A1F9E;
  }
  /* :     — :    */
  body.role-student header{
    background:var(--green-light);
    color:var(--green);
  }
  body.role-student header .header-sub{
    color:#6b5bb0;
  }
  body.role-student header .brand-name{
    color:var(--green);
  }
  body.role-student header .brand-logo{
    filter:brightness(0) saturate(100%);
    opacity:0.75;
  }
  main{
    max-width:880px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  .card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    margin-bottom:18px;
  }
  .card h2{
    font-size:16px;
    color:var(--navy);
    margin:0 0 14px;
    border-left:4px solid var(--green);
    padding-left:10px;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--navy);
    margin:12px 0 6px;
  }
  select, textarea, input[type=text]{
    width:100%;
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    font-family:inherit;
    font-size:14px;
    color:#1a2130;
    background:#ffffff;
    resize:vertical;
  }
  textarea{min-height:90px;}
  .counter{
    text-align:right;
    font-size:12px;
    color:var(--muted);
    margin-top:4px;
  }
  button{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    border:none;
    border-radius:8px;
    padding:10px 18px;
    cursor:pointer;
  }
  .btn-primary{background:var(--green); color:#fff;}
  .btn-primary:disabled{background:#B7A8F5; cursor:not-allowed;}
  .btn-secondary{background:var(--navy-light); color:var(--navy);}
  .btn-danger{background:var(--miss-bg); color:var(--miss);}
  .btn-row{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  .tab{
    padding:8px 14px;
    border-radius:8px 8px 0 0;
    background:var(--navy-light);
    color:var(--navy);
    cursor:pointer;
    font-size:13px;
    font-weight:700;
  }
  .tab.active{background:var(--navy); color:#fff;}
  .status-msg{
    margin-top:14px;
    padding:12px 14px;
    border-radius:8px;
    font-size:13px;
    background:var(--green-light);
    color:var(--green);
    display:none;
  }
  .status-msg.error{background:var(--miss-bg); color:var(--miss);}
  .star-row{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;}
  .star-tag{
    font-size:12px;
    font-weight:700;
    padding:4px 10px;
    border-radius:999px;
  }
  .star-tag.ok{background:var(--ok-bg); color:var(--ok);}
  .star-tag.miss{background:var(--miss-bg); color:var(--miss);}
  .review-item{
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    margin-bottom:14px;
  }
  .review-item .meta{font-size:12px; color:var(--muted); margin-bottom:8px;}
  .field-block{margin-bottom:10px;}
  .field-block .fb-label{font-size:12px; font-weight:700; color:var(--muted); margin-bottom:4px;}
  .preset-item{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  .preset-item > div:first-child{
    flex:1 1 220px;
    min-width:0;
  }
  .preset-item > .btn-row{
    flex:0 0 auto;
  }
  .link-box{
    display:flex;
    gap:8px;
    align-items:center;
    background:var(--green-light);
    border-radius:8px;
    padding:10px 12px;
    margin-top:10px;
    word-break:break-all;
    font-size:13px;
  }
  .empty{color:var(--muted); font-size:13px; padding:10px 0;}
  .result-block{margin-bottom:18px;}
  .result-block h3{font-size:14px; color:var(--navy); margin:0 0 6px;}
  .result-block p{margin:0; font-size:14px;}
  .moa-q{
    display:inline-flex; align-items:center; justify-content:center;
    width:17px; height:17px; margin-left:5px; vertical-align:middle;
    border-radius:50%; background:#EAF2AE; color:#11308C;
    font-size:11px; font-weight:900; line-height:1; text-decoration:none;
  }
  .moa-q:hover{ background:#C0D904; }

  /*   :       (2026-10-09) */
  #itemTypeTabs .moa-chip.tab-filled{background:#DDE1E8;border-color:#A3AABA;color:#141A2E;font-weight:700}
  #itemTypeTabs .moa-chip.tab-filled[aria-pressed="true"]{background:#141A2E;border-color:#141A2E;color:#fff}
  #itemTypeTabs .moa-chip.tab-filled[aria-pressed="true"] .tab-done{color:#FFFFFF}
  /* ===== 2026-09-30  :    ''  ===== */
  .proof-kicker{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--green);margin-bottom:4px}
  .proof-title{font-family:'Noto Serif KR',serif;font-size:26px;font-weight:600;line-height:1.35;margin:0 0 6px;color:var(--text);border:none;padding:0}
  .proof-sub{font-size:14px;color:var(--muted);margin:0}
  .proof-legend{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
  .proof-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:500}
  .proof-chip.p{background:#F3EFFE;color:#3F2799}
  .proof-chip.p i{width:16px;height:3px;border-radius:2px;background:var(--green)}
  .proof-chip.y{background:#F8FAFC;color:#B45309;box-shadow:inset 0 0 0 1px #E2E8F0}
  .proof-chip.y i{width:16px;height:3px;border-radius:2px;background:#D97706}
  .proof-chip.a{background:#F1F3F5;color:#4B5563}
  .proof-chip.a i{width:16px;height:0;border-top:2px dotted #6B7280}
  .mk-a{background:#F1F3F5;border-bottom:2px dotted #6B7280;padding:1px 0}
  .mk-n.a{background:#6B7280;color:#fff}
  .proof-note.a .proof-note-head{color:#4B5563}
  .proof-note.a .fix{background:#F8FAFC;color:#334155;box-shadow:inset 0 0 0 1px #E2E8F0}
  /* 2026   (2026-10-05) */
  .write-order{font-size:12.5px;color:var(--muted);background:#F6F7FA;border-radius:8px;padding:8px 10px;margin:2px 0 6px;line-height:1.6}
  .trend-live:empty{display:none}
  .trend-live{margin-top:6px;border:1px solid #E2E5EA;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.65;background:#fff}
  .trend-live .tl-row+.tl-row{margin-top:6px;padding-top:6px;border-top:1px dashed #E2E5EA}
  .trend-live .tl-alt{color:var(--navy);font-weight:700}
  .trend-live .tl-sub{color:var(--muted);font-size:12px}
  .trend-coach{margin-top:12px;border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:#FAFAFD}
  .trend-coach .tc-h{margin:0 0 6px;font-size:13.5px;font-weight:700;color:var(--text)}
  .trend-coach .tc-h span{font-weight:400;color:var(--muted);font-size:12px}
  .trend-coach .tc-q{display:flex;flex-direction:column;gap:2px;font-size:13.5px;line-height:1.6;padding:8px 10px;background:#fff;border-radius:8px;margin-top:6px;box-shadow:inset 0 0 0 1px #ECEEF2}
  .trend-coach .tc-q b{font-size:12px;color:var(--muted)}
  .rs-handoff{display:flex;flex-direction:column;gap:2px;margin-top:12px;padding:12px 14px;border-radius:12px;background:#141A2E;color:#fff;text-decoration:none;font-weight:700;font-size:14.5px}
  .rs-handoff span{font-weight:400;font-size:12px;color:#C9CFDE}
  .rs-handoff:focus-visible{outline:3px solid #C0D904;outline-offset:2px}
  @media print{.rs-handoff,.trend-live{display:none !important}}
  .proof-wrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
  @media (max-width:760px){ .proof-wrap{grid-template-columns:1fr} .proof-title{font-size:22px} }
  /*    (PC   640px )    —      (2026-10-05) */
  .result-block{container-type:inline-size}
  /* PC· (900px )      +     (2026-10-09).   */
  @media (min-width:900px){ body.moa-ui.role-student main{max-width:840px !important} }
  @container (max-width:640px){ .proof-wrap{grid-template-columns:1fr} }
  .proof-paper{border:1px solid var(--border);border-radius:14px;background:#FFFFFF;overflow:hidden}
  .proof-paper-head{padding:11px 18px;border-bottom:1px solid #E2E8F0;background:#F8FAFC;display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--text)}
  .proof-paper-head span:last-child{font-weight:400;color:var(--muted);white-space:nowrap}
  .proof-paper-body{position:relative;padding:16px 18px 18px 34px;font-family:'Noto Serif KR',serif;font-size:16px;line-height:34px;color:#0F172A;white-space:pre-wrap;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,#EEF2F7 33px,#EEF2F7 34px);background-origin:content-box;background-clip:content-box}
  .proof-paper-body::before{content:'';position:absolute;left:20px;top:0;bottom:0;width:1px;background:#E2E8F0}
  .mk-p{background:#F3EFFE;border-bottom:2px solid var(--green);padding:1px 0}
  .mk-y{background:#FFF4E5;border-bottom:2px solid #D97706;padding:1px 0}
  .mk-n{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin:0 3px;border-radius:50%;font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:700;line-height:1;vertical-align:5px}
  .mk-n.p{background:var(--green);color:#fff}
  .mk-n.y{background:#B45309;color:#fff}
  .proof-notes{display:flex;flex-direction:column;gap:10px}
  .proof-notes-label{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
  .proof-note{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:#fff;font-size:13.5px;line-height:1.6}
  .proof-note-head{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;margin-bottom:4px}
  .proof-note.p .proof-note-head{color:#3F2799}
  .proof-note.y .proof-note-head{color:#B45309}
  .proof-note.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
  .proof-note .quote{font-weight:700;margin-bottom:2px}
  .proof-note .fix{margin-top:6px;padding:8px 10px;border-radius:8px}
  .proof-note.p .fix{background:var(--green-light);color:var(--navy)}
  .proof-note.y .fix{background:#F8FAFC;color:#334155;box-shadow:inset 0 0 0 1px #E2E8F0}
  .proof-note .nopos{font-size:11.5px;color:var(--muted);font-weight:400}
  .proof-check{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 16px;border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .pc-item{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text)}
  .pc-item svg{flex-shrink:0}

  /* ----------    (2026-10-02) ---------- */
  .ex-wrap{background:var(--green-light);border-radius:10px;padding:14px}
  .ex-guide{font-size:13px;color:var(--navy);margin:0 0 10px}
  .ex-progress{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
  .ex-bar{flex:1;min-width:120px;height:8px;background:#fff;border-radius:99px;overflow:hidden}
  .ex-bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
  .ex-text{white-space:pre-wrap;line-height:2;margin:0;background:#fff;border-radius:8px;padding:12px}
  .ex-slot{background:#FFF1A8;border-bottom:2px solid #E0B400;border-radius:3px;padding:1px 2px;cursor:pointer}
  .ex-slot.mine{background:#DDF5E6;border-bottom-color:#1F7A4D}
  .ex-slot.open{outline:2px solid var(--green);outline-offset:1px}
  .ex-slot.static{cursor:default}
  .ex-tag{font-size:10px;font-weight:700;color:#8A6D00;margin-left:2px;vertical-align:super}
  .ex-slot.mine .ex-tag{color:#1F7A4D}
  .ex-editor{background:#fff;border:2px solid var(--green);border-radius:10px;padding:12px;margin-top:10px}
  .ex-ed-head{font-weight:700;font-size:14px;color:var(--navy)}
  .ex-ed-sub{font-size:12px;color:var(--muted);margin:2px 0 8px}
  .ex-opts{display:flex;flex-direction:column;gap:6px}
  .ex-opt{text-align:left;background:var(--green-light);border:1px solid transparent;border-radius:8px;padding:9px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--text)}
  .ex-opt:hover,.ex-opt.on{border-color:var(--green)}
  .ex-own{display:flex;gap:6px;margin-top:8px}
  .ex-own input{flex:1;margin:0}
  .ex-ed-foot{display:flex;gap:12px;margin-top:8px;font-size:12px}
  .ex-sheet-bg{position:fixed;inset:0;background:rgba(20,26,46,.28);z-index:900}
  .ex-sheet{position:fixed;left:0;right:0;bottom:0;z-index:901;max-width:640px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);padding:8px 18px calc(16px + env(safe-area-inset-bottom));max-height:72vh;overflow-y:auto;animation:exUp .18s ease-out;font-family:"Noto Sans KR",sans-serif}
  @keyframes exUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .ex-grab{width:40px;height:4px;border-radius:2px;background:#D7DAE2;margin:0 auto 8px}
  .ex-sh-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#6B7080;margin-bottom:4px}
  .ex-sh-x{background:none;border:0;font-size:18px;color:#6B7080;cursor:pointer;padding:4px 6px}
  .ex-now{font-size:13px;line-height:1.7;color:#4A5060;background:#F7F8FA;border-radius:10px;padding:8px 10px;margin:8px 0 6px}
  .ex-now mark{background:#FFF1A8;border-bottom:2px solid #E0B400;padding:0 2px;color:#141A2E;font-weight:700}
  .ex-step{font-size:13px;font-weight:700;color:#141A2E;margin:12px 0 6px}
  .ex-step small{font-weight:400;color:#6B7080}
  .ex-sheet .ex-own{margin-top:0}
  .ex-sheet .ex-own input{font-size:16px;min-height:44px}
  @media print{ #exSheetHost{display:none !important} }
  .ex-link{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font:inherit;font-size:12px}
  .ex-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .ex-count{font-size:12px;color:var(--muted)}
  .ex-final{background:#fff;border:2px solid #1F7A4D;border-radius:10px;padding:12px;margin-top:12px}
  .ex-final h4{margin:0 0 6px;color:#1F7A4D;font-size:14px}
  .ex-final.ex-done{margin-top:0;background:#F7F8FA}
  .ex-final.ex-done h4{font-size:16px;display:flex;flex-direction:column;gap:2px}
  .ex-final.ex-done h4 span{font-size:12.5px;font-weight:400;color:var(--muted)}
  .ex-final.ex-done .ex-text{font-size:15px;line-height:1.9}
  .rs-hero-q{display:inline-flex;align-items:baseline;gap:4px;background:#C0D904;color:#141A2E !important;font-size:14px;font-weight:700;border-radius:999px;padding:4px 12px;white-space:nowrap}
  .rs-hero-q b{font-size:15px;font-weight:800}
  .rs-hero-q i{font-style:normal;font-size:12px;font-weight:600;opacity:.75}
  .ex-before{margin-top:10px;font-size:13px;color:var(--muted)}
  .ex-before summary{cursor:pointer;font-weight:700;padding:6px 2px}
  .ex-before .ex-text{color:var(--muted);font-size:13.5px;line-height:1.8;background:#FAFAFB;border-radius:10px;padding:10px 12px;margin:4px 0 0}
  .ex-modal-bg{position:fixed;inset:0;background:rgba(20,20,40,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
  .ex-modal{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:20px}
  .ex-modal h3{margin:0 0 4px;color:var(--navy)}
  .ex-modal .iv-item{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
  .ex-modal .iv-q{font-weight:700;font-size:14px;margin-top:8px}

  /* ----------    (2026-10-03 B+C+D ) ---------- */
  .rs-card{padding-bottom:0 !important}
  .rs-kicker{margin:0 0 4px;font-size:13px;font-weight:700;color:#5F6678}
  .rs-title{margin:0 0 6px;font-size:24px;line-height:1.4;font-weight:900;letter-spacing:-0.025em;color:#141A2E;border:0;padding:0}
  .rs-sub{margin:0 0 16px;font-size:14px;line-height:1.6;color:#5F6678}
  .rs-jump{display:flex;gap:8px;overflow-x:auto;margin:0 -2px 16px;padding:2px;scrollbar-width:none}
  .rs-jump::-webkit-scrollbar{display:none}
  .rs-jump a{flex-shrink:0;display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:999px;background:#F4F5F7;color:#141A2E;font-size:13px;font-weight:700;text-decoration:none}
  .rs-anchor{position:relative;top:-72px}
  .rs-item.rs-next{margin-top:28px;padding-top:28px;border-top:1px solid #E6E8EE}
  .rs-hero{background:#141A2E;color:#FFFFFF;border-radius:20px;padding:18px 18px 16px;margin-bottom:14px}
  .rs-hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:#AEB4C6}
  .rs-ok{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:#C0D904}
  .rs-hero-head{margin:12px 0 14px;font-size:20px;line-height:1.45;font-weight:900;letter-spacing:-0.02em}
  .rs-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
  .rs-bar i{display:block;height:100%;border-radius:3px;background:#C0D904;transition:width .3s}
  .rs-hero-sub{margin:7px 0 0;font-size:12px;color:#AEB4C6;font-variant-numeric:tabular-nums}
  .rs-q{background:#F4F5F7;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.6;color:#2B3040;margin-bottom:18px;white-space:pre-wrap}
  .rs-q b{display:block;font-size:11px;color:#5F6678;margin-bottom:2px}

function moaDate(v, kind){
  if(v === null || v === undefined || v === '') return '';
  var d;
  if(typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)){ var p = v.split('-'); d = new Date(+p[0], +p[1]-1, +p[2]); }
  else d = new Date(v);
  if(isNaN(d.getTime())) return String(v);
  var y = d.getFullYear(), m = ('0'+(d.getMonth()+1)).slice(-2), dd = ('0'+d.getDate()).slice(-2), w = '(' + ''[d.getDay()] + ')';
  var hm = ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
  if(kind === 'week') return y + '.' + m + '.' + dd + w;
  if(kind === 'short') return m + '.' + dd + w;
  if(kind === 'time') return y + '.' + m + '.' + dd + ' ' + hm;
  if(kind === 'stime') return m + '.' + dd + w + ' ' + hm;
  if(kind === 'ym') return y + '.' + m;
  if(kind === 'formal') return y + ' ' + (d.getMonth()+1) + ' ' + d.getDate() + '';
  return y + '.' + m + '.' + dd;
}

async function api(path, options = {}) {
  //     /api/config, /api/reviews, /api/results

  let finalPath = path;
  if (/^\/api\/(config|reviews|results)/.test(path)) {

  }
  const res = await fetch(finalPath, {
    ...options,
    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    const msg = (err.error || (' : ' + res.status)) + (err.detail ? ' — : ' + err.detail : '');

    if (err.expired) e.expired = true;
    e.fromServer = !!err.error; //     ( submitFailReason    )
    e.status = res.status;
    e.retryable = !!err.retryable || res.status === 429 || res.status >= 500;
    throw e;
  }
  return res.json();
}

function submitFailReason(e) {
  if (!e) return '  .     .';
  if (e instanceof TypeError) return '     .        .';
  if (e.fromServer || !e.status) return e.message;
  if (e.status === 504 || e.status === 502) return '      .    ,     .';
  if (e.status === 413) return '      .       .';
  if (e.status === 429) return '       . 1    .';
  return `     (${e.status}).     ,     .`;
}

const FRAMEWORK_LABELS = {

function structureTagsHtml(framework, structure) {
  const labels = FRAMEWORK_LABELS[framework] || FRAMEWORK_LABELS.STAR;
  return Object.keys(labels).map(k => {
    const ok = structure && structure[k];
    return `<span class="star-tag ${ok ? 'ok' : 'miss'}">${labels[k]} ${ok ? '' : ''}</span>`;
  }).join('');
}

function concretenessTagsHtml(c) {
  if (!c) return '';

function followUpHtml(fu) {
  if (!fu) return '';
  const labels = { reasonType: '', alternativeType: '', quantifyType: '' };
  return Object.keys(labels).map(k =>
    `<div class="field-block"><div class="fb-label"> · ${labels[k]}</div><p>${escapeHtml(fu[k])}</p></div>`
  ).join('');
}

function escapeHtml(str) {
  return (str || '').replace(/[&<>"']/g, s => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[s]));
}

function extractCharLimit(questionText) {
  const match = (questionText || '').match(/(\d{2,5})\s*/);
  return match ? parseInt(match[1], 10) : null;
}

function daysRemainingText(expiresAt) {
  if (!expiresAt) return '';
  const diff = Math.ceil((expiresAt - Date.now()) / (24 * 60 * 60 * 1000));
  if (diff <= 0) return '';
  return `${diff}  (${moaDate(expiresAt)})`;
}

  if (IS_MOBILE && navigator.share) {
    try { await navigator.share({ text }); return 'shared'; }
    catch (e) { if (e && e.name === 'AbortError') return 'cancel'; }
  }
  try { await navigator.clipboard.writeText(text); return 'copied'; }
  catch (e) { prompt('     ', text); return 'copied'; }

      <div id="rbRemoved"></div>
    </div>
    <div class="card" id="clBook" style="display:none"></div>
    <div class="card" id="clicheBook" style="display:none"></div>
    <div class="card" id="freeBook" style="display:none"></div>
  `;

  const $ = id => document.getElementById(id);
  const pw = () => $('masterPasswordInput').value.trim();

  async function registryPost(body) {
    const res = await fetch('/api/teacher-registry', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...body, master: pw() })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ' .');
    return data;
  }

  function relDay(ms) {
    if (!ms) return '';
    const a = new Date(); a.setHours(0, 0, 0, 0);
    const b = new Date(ms); b.setHours(0, 0, 0, 0);
    const n = Math.round((a - b) / 86400000);
    return n <= 0 ? '' : n === 1 ? '' : n + ' ';
  }
  function dLeft(ms) {
    const a = new Date(); a.setHours(0, 0, 0, 0);
    const b = new Date(ms); b.setHours(0, 0, 0, 0);
    return Math.round((b - a) / 86400000);
  }

  //   : [ ,  class,  ]
  function statusOf(t) {
    if (t.expired) return ['temp', 'b-end', '  '];
    if (!t.hubKey) return ['wait', 'b-need', '  '];
    if (!t.lastSeen) return ['wait', 'b-wait', '🟡  '];
    if (t.expiresAt) { const n = dLeft(t.expiresAt); return ['temp', 'b-temp', '  ' + (n <= 0 ? 'D-day' : 'D-' + n)]; }
    return ['active', 'b-active', '🟢 '];
  }

  function hubMsg(name, key) {
    const link = MOA_HUB_URL + '?k=' + encodeURIComponent(key);
    return { link, msg: `[MOA FORMULA] ${name}   .\n      ·     . (  )\n${link}` };
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) { prompt('     ', text); return false; }
  }
  function showDone(html) {
    $('rbDone').innerHTML = `<div class="rb-done">${html}</div>`;
    $('rbDone').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  let PENDING_MSG = '';
  //          ,    " "    
  async function sendLink(t, isNew) {
    let key = t.hubKey;
    if (key && !isNew) {
      const { msg } = hubMsg(t.name, key);
      const r = await moaShare(msg);
      if (r !== 'cancel') registryPost({ action: 'markLinkSent', code: t.code }).catch(() => {});
      showDone(`${shareResultMsg(r)} <b>${escapeHtml(t.name)}</b>   `);
      if (r !== 'cancel') await load();
      return;
    }
    if (!key) key = (await registryPost({ action: 'makeHubLink', code: t.code })).hubKey;
    const { link, msg } = hubMsg(t.name, key);
    PENDING_MSG = msg;
    showDone(` <b>${escapeHtml(t.name)}</b>    .
      <div class="rb-btns" style="margin-top:8px"><button class="btn-primary" id="rbShareNow" data-code="${escapeHtml(t.code)}">${SHARE_LABEL}</button></div>
      <span style="color:var(--muted);font-size:12px">${escapeHtml(link)}</span>`);
    await load();
  }

  function moreMenu(t, withSend) {
    const c = escapeHtml(t.code);
    return `<details class="rb-more"><summary aria-label="">⋯</summary><div class="rb-menu">
            ${withSend ? `<button data-act="send" data-code="${c}">   </button>` : ''}
            <button data-act="expiry" data-code="${c}">${t.expired ? '  ' : t.expiresAt ? '  ' : '  '}</button>
            ${t.expiresAt ? `<button data-act="perm" data-code="${c}">  </button>` : ''}
            ${t.hubKey ? `<button data-act="rekey" data-code="${c}">   (  )</button>` : ''}
            <button class="danger" data-act="del" data-code="${c}">  </button>
          </div></details>`;
  }
  //    —     + ⋯
  function row(t) {
    const [, cls, label] = statusOf(t);
    const bits = [];
    if (t.lastSeen) bits.push(relDay(t.lastSeen) + ' ');
    else if (t.linkSentAt) bits.push('  ' + moaDate(t.linkSentAt));
    if (t.expiresAt) bits.push((t.expired ? '   ' : '  ~') + moaDate(t.expiresAt));
    else bits.push('');
    bits.push(' ' + moaDate(t.approvedAt));
    const c = escapeHtml(t.code);
    const main = t.expired
      ? `<button class="btn-primary rb-main" data-act="expiry" data-code="${c}">  </button>`
      : `<button class="btn-primary rb-main" data-act="send" data-code="${c}">${t.linkSentAt || t.lastSeen ? '   ' : SHARE_LABEL}</button>`;
    return `
      <div class="rb-row">
        <div class="rb-top">
          <div class="rb-name">${escapeHtml(t.name)}<span class="rb-code">${c}</span></div>
          <span class="rb-badge ${cls}">${label}</span>
        </div>
        <div class="rb-sub">${bits.map(escapeHtml).join(' · ')}</div>
        <div class="rb-btns">${main}${moreMenu(t, t.expired)}</div>
      </div>`;
  }
  //     —   +  +   + ⋯
  function line(t) {
    const days = t.lastSeen ? Math.round((Date.now() - t.lastSeen) / 86400000) : 999;
    const dot = days <= 7 ? 'g' : days <= 30 ? 'y' : 'n';
    const tag = t.expiresAt ? `<small>${escapeHtml(statusOf(t)[2].replace(' ', ''))}</small>` : '';
    return `<div class="rb-line">
        <span class="rb-dot ${dot}" aria-hidden="true"></span>
        <div class="nm">${escapeHtml(t.name)}<span class="cd">${escapeHtml(t.code)}</span>${tag}</div>
        <div class="ls">${t.lastSeen ? escapeHtml(relDay(t.lastSeen)) : ''}</div>
        ${moreMenu(t, true)}
      </div>`;
  }

  function inviteRow(v) {
    return `
      <div class="rb-row" style="background:#FAFBFD">
        <div class="rb-top">
          <div class="rb-name">${escapeHtml(v.label || '  ')}<span class="rb-code"> ${escapeHtml(v.code)}</span></div>
          <span class="rb-badge b-inv">${v.isExpired ? '   ' : '  '}</span>
        </div>
        <div class="rb-sub">  .    ·  ${escapeHtml(moaDate(v.createdAt))}${v.expiresAt ? ' · ~' + escapeHtml(moaDate(v.expiresAt)) : ''}</div>
        <div class="rb-btns">
          ${v.isExpired ? '' : `<button class="btn-secondary" data-act="invcopy" data-inv="${escapeHtml(v.code)}">  </button>`}
          <button class="btn-danger" data-act="invcancel" data-inv="${escapeHtml(v.code)}"></button>
        </div>
      </div>`;
  }

  function render() {
    if (!DATA) return;
    const T = DATA.teachers, R = DATA.removed, I = DATA.invites;
    const q = QUERY.toLowerCase();
    const hit = (...xs) => !q || xs.some(x => String(x || '').toLowerCase().includes(q));
    const order = { 'b-need': 0, 'b-end': 1, 'b-wait': 2, 'b-temp': 3, 'b-active': 4 };
    const todoT = T.filter(t => ['b-need', 'b-end', 'b-wait'].includes(statusOf(t)[1]));
    const actT = T.filter(t => ['b-temp', 'b-active'].includes(statusOf(t)[1]));
    const todoN = todoT.length + I.length;
    $('rbChips').innerHTML = `
      <button type="button" class="rb-tile${todoN ? ' hot' : ''}" data-open="todo"><b>${todoN}</b><span> </span></button>
      <button type="button" class="rb-tile" data-open="active"><b>${actT.length}</b><span> </span></button>
      <button type="button" class="rb-tile" data-open="off"><b>${R.length}</b><span></span></button>`;

    const todoRows = todoT.filter(t => hit(t.name, t.code)).sort((a, b) => order[statusOf(a)[1]] - order[statusOf(b)[1]]);
    const invRows = I.filter(v => hit(v.label, v.code));
    const actRows = actT.filter(t => hit(t.name, t.code)).sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0));
    const offRows = R.filter(r => hit(r.name, r.code));
    const isOpen = k => (q ? true : OPEN[k]) ? ' open' : '';

    let html = `
      <details class="rb-sec todo" data-sec="todo"${isOpen('todo')}>
        <summary><span class="t">   <em>${todoRows.length + invRows.length}</em></span><span class="h"></span></summary>
        <div class="rb-body">${todoRows.map(row).join('') + invRows.map(inviteRow).join('') || '<div class="empty">   .</div>'}</div>
      </details>
      <details class="rb-sec" data-sec="active"${isOpen('active')}>
        <summary><span class="t">   ${actRows.length}</span><span class="h"></span></summary>
        <div class="rb-body">
          ${actRows.length ? `<div class="rb-lines">${actRows.map(line).join('')}</div>
          <div class="rb-legend"><span><i class="rb-dot g"></i>7  </span><span><i class="rb-dot y"></i>30 </span><span><i class="rb-dot n"></i>30 </span></div>` : '<div class="empty">  .</div>'}
        </div>
      </details>`;
    $('rbList').innerHTML = html;

    $('rbRemoved').innerHTML = R.length ? `
      <details class="rb-sec off" data-sec="off"${isOpen('off')}>
        <summary><span class="t">   ${offRows.length}</span><span class="h"></span></summary>
        <div class="rb-body">${offRows.map(r => `
          <div class="rb-row" style="background:#FAFBFD;display:flex;justify-content:space-between;align-items:center;gap:8px">
            <div><b>${escapeHtml(r.name)}</b><span class="rb-code">${escapeHtml(r.code)}</span><div class="rb-sub" style="margin:2px 0 0"> ${escapeHtml(moaDate(r.removedAt))} ·   </div></div>
            <button class="btn-secondary" data-act="restore" data-code="${escapeHtml(r.code)}"></button>
          </div>`).join('')}</div>
      </details>` : '';
  }

  async function load() {
    const res = await fetch('/api/teacher-registry?list=all&master=' + encodeURIComponent(pw()));
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ' .');
    DATA = data;
    render();
  }

  async function open() {
    const err = $('rbLoginErr');
    err.style.display = 'none';
    if (!pw()) { err.textContent = '  .'; err.style.display = 'block'; return; }
    $('rbOpenBtn').disabled = true; $('rbOpenBtn').textContent = ' ...';
    try {
      await load();
      ssSet(pw());
      $('rbLogin').style.display = 'none';
      $('rbBook').style.display = 'block';
      $('clBook').style.display = 'block';
      initClientManager($('clBook'), pw());
      $('clicheBook').style.display = 'block';
      initClicheManager($('clicheBook'), pw());
      $('freeBook').style.display = 'block';
      initFreeStats($('freeBook'), pw());
    } catch (e) {
      err.textContent = e.message; err.style.display = 'block';
    }
    $('rbOpenBtn').disabled = false; $('rbOpenBtn').textContent = ' ';
  }

  const find = code => DATA.teachers.find(t => t.code === code);

  async function onAct(btn) {
    const act = btn.dataset.act, code = btn.dataset.code, inv = btn.dataset.inv;
    const t = code ? (find(code) || DATA.removed.find(r => r.code === code)) : null;
    const menu = btn.closest('details.rb-more'); if (menu) menu.open = false;
    const busy = txt => { btn.disabled = true; btn.dataset.orig = btn.textContent; btn.textContent = txt; };
    const done = () => { btn.disabled = false; if (btn.dataset.orig) btn.textContent = btn.dataset.orig; };
    try {
      if (act === 'send') { await sendLink(t); }
      else if (act === 'expiry') {
        const v = prompt(`${t.name}     ?\n\n·    (: 7)\n·  \n·        `, '');
        if (v === null) return;
        const days = parseInt(v, 10) || 0;
        busy(' ...');
        await registryPost({ action: 'setExpiry', code, expiryDays: days });
        await load();
        showDone(` <b>${escapeHtml(t.name)}</b>    ${days ? days + '(~' + moaDate(Date.now() + (days - 1) * 86400000) + ')' : ''} .`);
      }
      else if (act === 'perm') { busy(' ...'); await registryPost({ action: 'setExpiry', code, expiryDays: 0 }); await load(); }
      else if (act === 'rekey') {
        if (!confirm(`${t.name}     ?\n\n   . (     )\n     .`)) return;
        busy(' ...');
        const d = await registryPost({ action: 'makeHubLink', code });
        await sendLink({ ...t, hubKey: d.hubKey });
      }
      else if (act === 'del') {
        if (!confirm(`${t.name}(${code})   ?\n\n·       .\n· ·  , " "    .`)) return;
        busy(' ...');
        await registryPost({ action: 'deleteTeacher', code });
        await load();
      }
      else if (act === 'restore') {
        if (!confirm(`${t.name}(${code})  ?\n        .`)) return;
        busy(' ...');
        await registryPost({ action: 'restoreTeacher', code });
        await load();
      }
      else if (act === 'invcopy') {
        const link = location.origin + location.pathname + '?admin=1&invite=' + encodeURIComponent(inv);
        await copyText(link);
        showDone(`  .        .<br><span style="color:var(--muted)">${escapeHtml(link)}</span>`);
      }
      else if (act === 'invcancel') {
        if (!confirm(` ${inv} ?\n     .`)) return;
        busy(' ...');
        await registryPost({ action: 'cancelInvite', inviteCode: inv });
        await load();
      }
    } catch (e) {
      alert(e.message);
      done();
    }
  }

  $('rbOpenBtn').addEventListener('click', open);
  $('masterPasswordInput').addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
  $('rbAddToggle').addEventListener('click', () => {
    const box = $('rbAdd'); const show = box.style.display === 'none';
    box.style.display = show ? 'block' : 'none';
    if (show) setTimeout(() => $('rbAddName').focus(), 50);
  });
  $('rbAddBtn').addEventListener('click', async () => {
    const err = $('rbAddErr'), btn = $('rbAddBtn');
    err.style.display = 'none';
    const name = $('rbAddName').value.trim();
    const typed = $('rbAddCode').value.trim().toLowerCase().replace(/[^a-z0-9-_-]/g, '');
    const days = parseInt($('rbAddDays').value, 10) || 0;
    if (!name) { err.textContent = '   .'; err.style.display = 'block'; return; }
    //         →   (: t4k9xq)
    const autoCode = () => 't' + Array.from(crypto.getRandomValues(new Uint8Array(5)), n => 'abcdefghjkmnpqrstuvwxyz23456789'[n % 31]).join('');
    btn.disabled = true; btn.textContent = ' ...';
    try {
      let d = null;
      for (let i = 0; i < (typed ? 1 : 3) && !d; i++) {
        try { d = await registryPost({ action: 'addTeacher', name, code: typed || autoCode(), expiryDays: days }); }
        catch (e2) { if (typed || i === 2 || !//.test(e2.message)) throw e2; }
      }
      ['rbAddName', 'rbAddCode', 'rbAddDays'].forEach(id => { $(id).value = ''; });
      $('rbAdd').style.display = 'none';
      FILTER = 'all';
      await sendLink({ code: d.code, name: d.name, hubKey: d.hubKey }, true);
    } catch (e) {
      err.textContent = e.message; err.style.display = 'block';
    }
    btn.disabled = false; btn.textContent = '';
  });
  $('rbChips').addEventListener('click', e => {
    const b = e.target.closest('[data-open]'); if (!b) return;
    OPEN[b.dataset.open] = true; render();
    const sec = document.querySelector(`.rb-sec[data-sec="${b.dataset.open}"]`);
    if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  // ·   (  )
  $('rbBook').addEventListener('toggle', e => {
    const d = e.target; if (d.classList && d.classList.contains('rb-sec') && !QUERY) OPEN[d.dataset.sec] = d.open;
  }, true);
  $('rbSearch').addEventListener('input', e => { QUERY = e.target.value.trim(); render(); });
  $('rbBook').addEventListener('click', e => { const b = e.target.closest('button[data-act]'); if (b) onAct(b); });
  $('rbDone').addEventListener('click', async e => {
    const b = e.target.closest('#rbShareNow'); if (!b || !PENDING_MSG) return;
    const r = await moaShare(PENDING_MSG);
    if (r !== 'cancel') { registryPost({ action: 'markLinkSent', code: b.dataset.code }).catch(() => {}); b.textContent = r === 'shared' ? ' ' : '  —  Ctrl+V'; load(); }
  });

  //         (  )
  const saved = ssGet();
  if (saved) { $('masterPasswordInput').value = saved; open(); }
}

// ----------  AI   ( · 2026-10-05) ----------
//       , AI      .     .
//    (2026-10-15): ·1 ·AI         (·   )
//   api/config?scope=freestats {master} → { stats: {'<>_<>:YYYY-MM-DD': } }
function initFreeStats(box, masterPw) {
  const TOOLS = [['box', ' ', '/blackbox'], ['free', '1 AI ', '/free'], ['check', 'AI  ', '/check']];
  const ROWS = [['view', '  '], ['use', ' '], ['full', ' 30   '], ['cta', '   ']];
  const day = (ms) => new Date(ms + 9 * 3600 * 1000).toISOString().slice(0, 10);
  const now = Date.now(), today = day(now), month = today.slice(0, 7);
  const last7 = Array.from({ length: 7 }, (_, i) => day(now - i * 86400000));
  const draw = (S) => {
    const sum = (tool, row, test) => Object.keys(S).reduce((a, k) => { const [ev, d] = k.split(':'); return ev === tool + '_' + row && test(d) ? a + (+S[k] || 0) : a; }, 0);
    const cols = [['', (d) => d === today], [' 7', (d) => last7.includes(d)], [' ', (d) => d.startsWith(month)], ['', () => true]];
    const fullDays = (tool) => Object.keys(S).filter((k) => k.startsWith(tool + '_full:') && k.slice(-10).startsWith(month) && +S[k] > 0).length;
    box.innerHTML = `
      <h2 style="margin:0">   </h2>
      <p style="font-size:12.5px;color:var(--muted);margin:6px 0 12px;line-height:1.6"> .  ··  . <b style="white-space:nowrap">2026-10-15</b> .</p>
      ${TOOLS.map(([k, name, url]) => `
        <div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px">
            <b style="font-size:14.5px">${name}</b>
            <span style="font-size:12px;color:var(--muted)">${url}${k === 'check' ? ' ·   ' : ` ·     <b style="color:var(--navy)">${fullDays(k)}</b>`}</span>
          </div>
          <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;min-width:300px">
            <thead><tr><th style="text-align:left;padding:6px 4px;border-bottom:1px solid #e5e7eb;font-weight:700"></th>${cols.map((c) => `<th style="text-align:right;padding:6px 4px;border-bottom:1px solid #e5e7eb;font-weight:700;white-space:nowrap">${c[0]}</th>`).join('')}</tr></thead>
            <tbody>${ROWS.filter(([r]) => !(k === 'check' && r === 'full')).map(([r, label]) => `<tr><td style="padding:6px 4px;border-bottom:1px solid #f1f2f4">${label}</td>${cols.map((c) => `<td style="text-align:right;padding:6px 4px;border-bottom:1px solid #f1f2f4;font-variant-numeric:tabular-nums">${sum(k, r, c[1]).toLocaleString()}</td>`).join('')}</tr>`).join('')}</tbody>
          </table></div>
        </div>`).join('')}
      <button type="button" class="btn-secondary" id="fsReload" style="font-size:12.5px;padding:6px 12px"></button>`;
    box.querySelector('#fsReload').onclick = load;
  };
  async function load() {
    box.innerHTML = '<h2 style="margin:0">   </h2><div class="empty"> ...</div>';
    try {
      const r = await fetch('/api/config?scope=freestats', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ master: masterPw }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || ' ');
      draw(d.stats || {});
    } catch (e) { box.innerHTML = `<h2 style="margin:0">   </h2><div class="empty">${escapeHtml(e.message)}</div>`; }
  }
  load();
}

        </div>

    box.querySelector('#ccList').addEventListener('toggle', e => { OPENED = e.target.open; });
    box.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => { LIST.splice(+b.dataset.del, 1); draw(); msg('  .'); }));

      const alt = box.querySelector('#ccAlt').value.split(',').map(x => x.trim()).filter(Boolean).slice(0, 3);
      LIST.unshift({ w, alt }); draw(); msg('  .');

let activeItemType = '';
function blockFilled(b) { return ['.item-question', '.item-answer'].some(c => b.querySelector(c).value.trim()); }
function filledItemBlocks() { return Array.from(document.querySelectorAll('.item-block')).filter(blockFilled); }
function blockTypeLabel(b) { const o = b.querySelector('.item-questionType').selectedOptions[0]; return o ? o.textContent : ''; }
//        (      )
function fillItemBlocks(items) {
  const blocks = Array.from(document.querySelectorAll('.item-block'));
  const used = new Set();
  (items || []).forEach(it => {
    if (!it || !((it.question || '').trim() || (it.answer || '').trim())) return;
    const b = blocks.find(x => !used.has(x) && x.dataset.type === it.type) || blocks.find(x => !used.has(x) && !blockFilled(x));
    if (!b) return;
    used.add(b);
    const put = (cls, val) => { const el = b.querySelector(cls); el.value = val || ''; el.dispatchEvent(new Event('input', { bubbles: true })); };
    put('.item-question', it.question); put('.item-answer', it.answer);
    put('.item-selfIntent', it.selfIntent); put('.item-prevAnswer', it.prevAnswer);
    if ((document.getElementById('docTypeSelect') || {}).value === 'cv') b.dataset.cvOpen = '1';
  });
  const first = filledItemBlocks()[0];
  refreshItemTabs(first ? first.dataset.type : '');
}
function refreshItemTabs(showType) {
  const tabs = document.getElementById('itemTypeTabs');
  if (!tabs) return;
  const blocks = Array.from(document.querySelectorAll('.item-block'));
  const isCv = (document.getElementById('docTypeSelect') || {}).value === 'cv';
  const addBtn = document.getElementById('addItemBtn');
  if (showType) activeItemType = showType;
  if (!blocks.some(b => b.dataset.type === activeItemType)) activeItemType = blocks[0] ? blocks[0].dataset.type : '';
  tabs.style.display = isCv ? 'none' : '';
  if (isCv) {
    // :       , '+  '   
    let shown = 0;
    blocks.forEach((b, i) => { const on = i === 0 || blockFilled(b) || b.dataset.cvOpen === '1'; b.style.display = on ? '' : 'none'; if (on) shown++; });
    if (addBtn) { addBtn.style.display = shown < blocks.length ? '' : 'none'; addBtn.textContent = '+  '; }
  } else {
    blocks.forEach(b => { b.style.display = b.dataset.type === activeItemType ? '' : 'none'; });
    if (addBtn) addBtn.style.display = 'none';
  }
  tabs.querySelectorAll('.moa-chip').forEach(c => {
    const b = blocks.find(x => x.dataset.type === c.dataset.type);
    c.setAttribute('aria-pressed', String(c.dataset.type === activeItemType));
    c.classList.toggle('tab-filled', !!(b && blockFilled(b))); //     (2026-10-09)
    c.querySelector('.tab-done').textContent = b && blockFilled(b) ? ' ' : '';
  });
  const sum = document.getElementById('itemFilledSummary');
  if (sum) {
    const f = filledItemBlocks();
    sum.style.display = isCv ? 'none' : '';
    sum.innerHTML = f.length
      ? `  <b>${f.length}</b> · ${f.map(b => escapeHtml(blockTypeLabel(b))).join(' · ')}<br><span style="color:var(--muted)">     .</span>`
      : '   .       .';
  }
}

function collectScaffoldMemo(block, type) {
  const sc = SCAFFOLDS[type];
  if (!sc) return [];
  return Array.from(block.querySelectorAll('.sc-memo')).map(inp => {
    const k = parseInt(inp.dataset.k, 10);
    return { label: sc.rows[k] ? sc.rows[k].label : '', value: inp.value.trim() };
  }).filter(m => m.value);
}

function wireScaffold(block, id) {
  const typeSel = block.querySelector('.item-questionType');
  const panel = block.querySelector('.sc-panel');
  const toggle = block.querySelector('.sc-toggle-btn');

  function render() {
    panel.innerHTML = scaffoldHtml(id, typeSel.value);
    const btn = panel.querySelector('.sc-draft-btn');
    if (!btn) return;
    const refresh = () => { btn.disabled = collectScaffoldMemo(block, typeSel.value).length < 2; };
    panel.querySelectorAll('.sc-memo').forEach(inp => inp.addEventListener('input', refresh));
    btn.addEventListener('click', () => makeDraftFromMemo(block, id));
  }
  block._renderScaffold = () => {
    //          
    const kept = Array.from(panel.querySelectorAll('.sc-memo')).map(i => i.value);
    render();
    panel.querySelectorAll('.sc-memo').forEach((i, k) => { if (kept[k]) i.value = kept[k]; });
    const btn = panel.querySelector('.sc-draft-btn');
    if (btn) btn.disabled = collectScaffoldMemo(block, typeSel.value).length < 2;
  };

  toggle.addEventListener('click', () => {
    const open = panel.style.display !== 'none';
    if (open) { panel.style.display = 'none'; toggle.textContent = '   —  '; return; }
    if (!panel.innerHTML.trim()) render();
    panel.style.display = 'block';
    toggle.textContent = '   ';
  });
  typeSel.addEventListener('change', () => {
    const hasMemo = Array.from(panel.querySelectorAll('.sc-memo')).some(i => i.value.trim());
    if (hasMemo && !confirm('       . ?')) {
      return; //      
    }
    render();
  });
}

async function makeDraftFromMemo(block, id) {
  const type = block.querySelector('.item-questionType').value;
  const memo = collectScaffoldMemo(block, type);
  const statusEl = block.querySelector(`.sc-status[data-item-id="${id}"]`);
  const box = block.querySelector(`.sc-drafts[data-item-id="${id}"]`);
  const btn = block.querySelector('.sc-draft-btn');
  if (memo.length < 2) { statusEl.textContent = '2  .'; return; }
  moaUse('help'); //  :  
  btn.disabled = true; btn.textContent = '  ...';
  statusEl.textContent = '   3  . 10~20  .';
  box.innerHTML = '';
  try {
    const question = block.querySelector('.item-question').value.trim();
    const data = await api('/api/coach', {
      method: 'POST',
      body: JSON.stringify({
        mode: 'draft',
        questionType: type,
        question,
        memo,
        hiringType: currentHiringType(),
        charLimit: extractCharLimit(question)
      })
    });
    const drafts = Array.isArray(data.drafts) ? data.drafts : [];
    if (!drafts.length) throw new Error('  .  .');
    statusEl.innerHTML = '   , <b>   </b> . []   .';
    box.innerHTML = drafts.map((d, k) => `
      <div style="background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px">
        <span class="star-tag ok">${escapeHtml(d.opener || ' ' + (k + 1))}</span>
        <p style="white-space:pre-wrap;font-size:14px;line-height:1.7;margin:6px 0">${escapeHtml(d.text || '')}</p>
        <button type="button" class="btn-secondary sc-use-btn" data-k="${k}" style="font-size:13px;padding:6px 12px">    </button>
      </div>`).join('');
    box.querySelectorAll('.sc-use-btn').forEach(b => b.addEventListener('click', () => {
      const answer = block.querySelector('.item-answer');
      if (answer.value.trim() && !confirm('     .  ?')) return;
      answer.value = drafts[parseInt(b.dataset.k, 10)].text || '';
      answer.dispatchEvent(new Event('input'));
      answer.focus();
    }));
  } catch (e) {
    statusEl.textContent = '  : ' + e.message;
  }
  btn.disabled = false; btn.textContent = '    ';
}

    const noAnswer = blocks.filter(b => !ansOf(b));

    if (noAnswer.length) {

      if (!(await ask({ title: `  ${names}   ?`, body: '    .      .', stay: '  ', leave: ' ' }))) { goTo(noAnswer[0]); return; }
      blocks = blocks.filter(ansOf);
    }
    const noQuestion = blocks.filter(b => !qOf(b));
    if (noQuestion.length) {
      const names = noQuestion.map(b => `'${nameOf(b)}'`).join(', ');
      const go = await ask(isCv

      if (!go) { goTo(noQuestion[0]); const q = noQuestion[0].querySelector('.item-question'); if (q) q.focus(); return; }

    if (CLIENT && blocks.length > (CLIENT.maxItems || CLIENT.items.length)) { failMsg(`    ${(CLIENT.maxItems || CLIENT.items.length)}   .  ${blocks.length} .     .`); return; }

      //    (2026-10-22):      ,       .
      //            (  ).
      const total = rawItems.length;
      let done = 0;
      const showProgress = () => { submitBtn.textContent = ` ...  ${done}/${total}  (  )`; };
      showProgress();
      const draftKey = it => JSON.stringify([it.question, it.answer, it.questionType, it.charLimit, it.hiringType, presetSelect.value, jobPosting, targetCompany]);
      const draftOne = async (it) => {
        const key = draftKey(it);
        if (AI_DRAFT_KEEP.has(key)) { done++; showProgress(); return { ...it, aiDraft: AI_DRAFT_KEEP.get(key) }; }
        for (let attempt = 1; ; attempt++) {
          const t0 = Date.now();
          try {
            const aiDraft = await api('/api/feedback', {
              method: 'POST',
              body: JSON.stringify({ ...it, presetPrompt: (preset ? preset.prompt : '') + aspirationExtra(it.questionType, targetCompany) + resumeBriefExtra(it.questionType, targetCompany), jobPosting, clicheWords: CLICHES.map(c => c.w) })
            });
            AI_DRAFT_KEEP.set(key, aiDraft);
            done++; showProgress();
            return { ...it, aiDraft };
          } catch (e) {
            // 2    ( · · )   .        
            const quick = Date.now() - t0 < 120000;
            if (attempt >= 2 || !quick || !(e.retryable || e instanceof TypeError)) throw e;
            await new Promise(r => setTimeout(r, e.status === 429 ? 15000 : 4000));
          }
        }
      };
      const settled = await Promise.allSettled(rawItems.map(draftOne));
      const failed = settled.map((r, i) => r.status === 'rejected' ? { i, e: r.reason } : null).filter(Boolean);
      if (failed.length) {
        //       (2026-10-26) — ''       
        const lines = failed.map(f => `· ${f.i + 1} '${rawItems[f.i].question.slice(0, 14)}' — ${submitFailReason(f.e)}`);
        const err = new Error(`${total}  ${failed.length}      .\n${lines.join('\n')}\n\n   .${total - failed.length ? `     ${total - failed.length}    .` : ''}`);
        err.itemized = true;
        throw err;
      }
      const itemsWithDraft = settled.map(r => r.value);
      submitBtn.textContent = '  ...';

      const studentInstitution = institutions.length ? document.getElementById('institutionSelect').value : '';

      //     (2026-10-28):     (ci)      
      let moaCi = ''; try { moaCi = sessionStorage.getItem('moa_ci') || ''; } catch (e) {}
      const reviewRes = await api('/api/reviews', {
        method: 'POST',

      });

      if (CLIENT) { CLIENT.used = Object.assign({}, CLIENT.used, { resume: { at: Date.now(), reviewCode: reviewRes.code || "" } }); renderClientDone(reviewRes.code, true); return; }
      localStorage.setItem(countKey, String(usedCount + 1));
      if (reviewRes.resultId) {
        //    :       
        STUDENT_DRAFT = null; stuDraftClear(); AI_DRAFT_KEEP.clear();
        try { sessionStorage.setItem('moa_direct_code', reviewRes.code || ''); } catch (e) {}
        location.hash = '#result=' + reviewRes.resultId;
        return;
      }

      statusMsg.innerHTML = `
         .       .<br>
        <div style="margin-top:10px;padding:12px;background:#fff;border:2px dashed var(--green);border-radius:8px;text-align:center">
          <div style="font-size:12px;color:var(--muted)">   ( !)</div>

        </div>
      `;

      statusMsg.style.display = 'block';
      document.getElementById('itemsContainer').innerHTML = '';

      stuDraftClear(); AI_DRAFT_KEEP.clear();
      document.getElementById('addItemBtn').style.display = 'none';
      submitBtn.style.display = 'none';
    } catch (e) {
      if (CLIENT && !/ | | /.test(e.message)) { try { fetch('/api/client-code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'reportError', code: CLIENT.code, where: '  ', message: e.message }) }); } catch (x) {} }

    }

async function renderTeacherView() {
  moaUse('teacher');
  const studentLink = location.origin + location.pathname + '?t=' + encodeURIComponent(TEACHER_ID);
  const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=' + encodeURIComponent(studentLink);

  try {
    const r = await fetch('/api/teacher-registry?check=' + encodeURIComponent(TEACHER_ID));
    const d = await r.json();

  } catch (e) { /*       */ }
  if (currentTab === 'guide' && !isPermanentTeacher) currentTab = 'reviews';
  app.innerHTML = `
    <div class="card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      <img id="qrImage" src="${qrUrl}" alt=" QR" title=" " style="width:120px;height:120px;border:1px solid var(--border);border-radius:8px;cursor:pointer">
      <div style="flex:1;min-width:200px">
        <div class="fb-label" style="margin-bottom:6px">  QR</div>

      <div class="tab" data-tab="notify"> </div>
      ${isPermanentTeacher ? '<div class="tab" data-tab="guide"> </div>' : ''}
    </div>
    <div id="tabContent"></div>
  `;

  document.getElementById('qrImage').addEventListener('click', async () => {
    try {
      const res = await fetch(qrUrl);
      const blob = await res.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = '--QR.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(blobUrl);
    } catch (e) {
      window.open(qrUrl, '_blank');
    }
  });

  document.querySelectorAll('.tab').forEach(t => {

  else if (currentTab === 'notify') await renderNotifyTab(content);

}

function diffWords(oldStr, newStr) {
  const a = (oldStr || '').split(/\s+/).filter(Boolean);
  const b = (newStr || '').split(/\s+/).filter(Boolean);
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) {
    for (let j = n - 1; j >= 0; j--) {
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  let i = 0, j = 0;
  const ops = [];
  while (i < m && j < n) {
    if (a[i] === b[j]) { ops.push({ type: 'same', text: a[i] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ type: 'removed', text: a[i] }); i++; }
    else { ops.push({ type: 'added', text: b[j] }); j++; }
  }
  while (i < m) { ops.push({ type: 'removed', text: a[i] }); i++; }
  while (j < n) { ops.push({ type: 'added', text: b[j] }); j++; }
  return ops;
}

function diffHtml(oldStr, newStr) {
  if (!oldStr) return '';
  return diffWords(oldStr, newStr).map(o => {
    if (o.type === 'same') return escapeHtml(o.text);
    if (o.type === 'removed') return `<span style="text-decoration:line-through;color:var(--miss);background:var(--miss-bg);padding:0 2px;border-radius:3px">${escapeHtml(o.text)}</span>`;
    return `<span style="color:var(--ok);background:var(--ok-bg);padding:0 2px;border-radius:3px;font-weight:700">${escapeHtml(o.text)}</span>`;
  }).join(' ');
}

function buildReviewCard(record, presetName) {
  const wrap = document.createElement('div');
  wrap.className = 'review-item';
  const items = record.items || [];
  wrap.innerHTML = `
    <details>
      <summary style="cursor:pointer">
        <span style="font-weight:700;color:var(--navy);font-size:15px">${escapeHtml(record.studentName) || '( )'}</span>
        <span class="star-tag ok" style="margin-left:6px">${escapeHtml(presetName || '')}</span>
        ${record.studentInstitution ? `<span class="star-tag ok" style="margin-left:4px">${escapeHtml(record.studentInstitution)}</span>` : ''}
        ${record.clientCode ? `<span class="star-tag" style="margin-left:4px;background:#FFF4DC;color:#9A6200">   ${escapeHtml(record.clientCode)}${record.clientMemo ? ' · ' + escapeHtml(record.clientMemo) : ''}</span>` : ''}
        <span style="font-size:12px;color:var(--muted);margin-left:8px"> ${items.length} ·  ${escapeHtml(record.code) || '-'} · ${moaDate(record.createdAt, 'time')} ·  </span>
      </summary>
      <div style="margin-top:14px">
        ${record.jobPosting ? `<div class="field-block"><div class="fb-label">    (  )</div><p style="white-space:pre-wrap">${escapeHtml(record.jobPosting)}</p></div>` : ''}
        ${items.map((it, idx) => reviewItemBlockHtml(it, idx, items.length)).join('')}
        <div class="btn-row">
          <button class="btn-primary approve-btn">    </button>
          <button class="btn-danger reject-btn"></button>
        </div>
        <div class="link-box" style="display:none"></div>
      </div>
    </details>
  `;

  wrap.querySelector('.approve-btn').addEventListener('click', async (e) => {
    const btn = e.target;
    btn.disabled = true;
    btn.textContent = ' ...';
    try {
      const finalItems = items.map((it, idx) => {
        const d = it.aiDraft || {};
        const framework = d.frameworkUsed || it.framework || 'STAR';
        return {
          questionType: it.questionType,
          question: it.question,
          answer: it.answer,
          frameworkUsed: framework,
          structure: d.structure,
          concreteness: d.concreteness,
          riskFlags: d.riskFlags || [],
          aiTracePhrases: d.aiTracePhrases || [],
          reflection: Array.isArray(d.reflection) ? d.reflection : [],
          jobEvidence: d.jobEvidence || null,
          redFlags: Array.isArray(d.redFlags)
            ? d.redFlags.filter((_, k) => {
                const cb = wrap.querySelector(`.rf-keep[data-idx="${idx}"][data-k="${k}"]`);
                return !cb || cb.checked;
              })
            : undefined,
          interviewerInference: d.interviewerInference,
          defenseQuestions: (Array.isArray(d.defenseQuestions) ? d.defenseQuestions : []).map((dq, k) => {
            const ta = wrap.querySelector(`.edit-def-q[data-idx="${idx}"][data-k="${k}"]`);
            return { sentence: dq.sentence, question: ta ? ta.value.trim() : dq.question };
          }).filter(dq => dq.sentence && dq.question),
          jobMatch: d.jobMatch || null,
          intentGapComment: d.intentGapComment || null,
          previousAnswer: it.previousAnswer || null,
          revisionComment: d.revisionComment || null,
          charLimit: it.charLimit || null,
          charLimitNote: d.charLimitNote || null,
          missingElements: d.missingElements || [],
          strengths: wrap.querySelector(`.edit-strengths[data-idx="${idx}"]`).value,
          improvements: wrap.querySelector(`.edit-improvements[data-idx="${idx}"]`).value,
          polishedText: wrap.querySelector(`.edit-polished[data-idx="${idx}"]`).value,
          exampleSlots: Array.isArray(d.exampleSlots) ? d.exampleSlots : [],
          followUpQuestions: {
            reasonType: wrap.querySelector(`.edit-fu-reason[data-idx="${idx}"]`).value,
            alternativeType: wrap.querySelector(`.edit-fu-alt[data-idx="${idx}"]`).value,
            quantifyType: wrap.querySelector(`.edit-fu-quant[data-idx="${idx}"]`).value
          }
        };
      });

      const payload = {
        studentName: record.studentName || '',
        studentEmail: record.studentEmail || '',
        code: record.code || '',
        presetName: presetName || '',
        docType: record.docType || 'resume',
        jobPosting: record.jobPosting || '',
        studentInstitution: record.studentInstitution || '',
        clientCode: record.clientCode || '',
        items: finalItems
      };
      const { id } = await api('/api/results', { method: 'POST', body: JSON.stringify(payload) });
      await api('/api/reviews?id=' + record.id, { method: 'DELETE' });

      const link = location.origin + location.pathname + '?t=' + encodeURIComponent(TEACHER_ID) + '#result=' + id;
      const linkBox = wrap.querySelector('.link-box');
      linkBox.style.display = 'flex';
      linkBox.innerHTML = `<span>  :</span> <a href="${link}" target="_blank">${link}</a>
        <button class="btn-secondary" style="margin-left:auto" onclick="navigator.clipboard.writeText('${link}')"></button>`;
      btn.textContent = ' ';
    } catch (err) {
      alert(': ' + err.message);
      btn.disabled = false;
      btn.textContent = '    ';
    }
  });

  wrap.querySelector('.reject-btn').addEventListener('click', async () => {
    if (!confirm('   ?')) return;
    await api('/api/reviews?id=' + record.id, { method: 'DELETE' });
    wrap.remove();
  });

  return wrap;
}

    <div class="card">
      <h2>  </h2>
      <div class="btn-row" style="margin-top:0;align-items:center">
        <div style="flex:1;min-width:160px">
          <label style="margin-top:0">( ) </label>
          <select id="filterPreset"><option value="__all__"> (  )</option></select>
        </div>
        <div style="flex:1;min-width:160px">
          <label style="margin-top:0"></label>
          <select id="sortOrder">
            <option value="recent"></option>
            <option value="oldest"></option>
            <option value="name"> </option>
          </select>
        </div>
      </div>
      <div id="resultsList" class="empty" style="margin-top:14px"> ...</div>
    </div>
  `;
  const listEl = document.getElementById('resultsList');
  const filterSelect = document.getElementById('filterPreset');
  const sortSelect = document.getElementById('sortOrder');

  let allItems = [];
  try {
    const { items } = await api('/api/results?list=1');
    allItems = items;
  } catch (e) {
    listEl.innerHTML = `<div class="empty"> : ${escapeHtml(e.message)}</div>`;
    return;
  }

  if (!allItems.length) { listEl.innerHTML = `<div class="empty">  .</div>`; return; }

  const presetNames = [...new Set(allItems.map(it => it.presetName || ''))].sort((a, b) => a.localeCompare(b, 'ko'));
  filterSelect.innerHTML = `<option value="__all__"> (  )</option><option value="__group__"> ( )</option>` +
    presetNames.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');

  function sortItems(items) {
    const sorted = [...items];
    if (sortSelect.value === 'name') {
      sorted.sort((a, b) => (a.studentName || '').localeCompare(b.studentName || '', 'ko'));
    } else if (sortSelect.value === 'oldest') {
      sorted.sort((a, b) => a.approvedAt - b.approvedAt);
    } else {
      sorted.sort((a, b) => b.approvedAt - a.approvedAt);
    }
    return sorted;
  }

  function buildResultRow(it) {
    const link = location.origin + location.pathname + '?t=' + encodeURIComponent(TEACHER_ID) + '&admin=1#result=' + it.id;
    const expiredBadge = it.expiresAt ? (Date.now() > it.expiresAt ? '<span class="star-tag miss" style="margin-left:6px">  </span>' : `<span class="star-tag ok" style="margin-left:6px">${daysRemainingText(it.expiresAt)}</span>`) : '';
    const row = document.createElement('div');
    row.className = 'preset-item';
    row.innerHTML = `
      <div><b>${escapeHtml(it.studentName) || '( )'}</b> —  ${it.itemCount || 1}${it.direct ? '<span class="star-tag ok" style="margin-left:6px"> </span>' : ''}${it.clientCode ? '<span class="star-tag" style="margin-left:6px;background:#FFF4DC;color:#9A6200">  </span>' : ''}${expiredBadge}<div style="font-size:12px;color:var(--muted)">${moaDate(it.approvedAt, 'time')}${it.code ? ' ·  <b style="color:var(--green);letter-spacing:1px">' + escapeHtml(it.code) + '</b>' : ''}</div></div>
      <div class="btn-row" style="margin:8px 0 0;flex-wrap:wrap;gap:6px;width:100%">
        <a href="${link}" target="_blank" class="btn-secondary" style="text-decoration:none;padding:8px 14px;border-radius:8px"> </a>
        <button class="btn-secondary copy-student-btn" style="padding:8px 12px;font-size:13px">  </button>
        <button class="btn-secondary send-student-btn" style="padding:8px 12px;font-size:13px">  </button>
        ${it.expiresAt ? '<button class="btn-secondary extend-btn" style="padding:8px 12px;font-size:13px">  </button>' : ''}
        <button class="btn-danger delete-result-btn"></button>
      </div>
    `;
    row.style.flexWrap = 'wrap';
    const studentLink = location.origin + location.pathname + '?t=' + encodeURIComponent(TEACHER_ID) + '#result=' + it.id;
    const isExpired = it.expiresAt && Date.now() > it.expiresAt;
    const sendText = '[]\n' + (it.studentName ? it.studentName + ', ' : '') + '   .\n      .\n\n' + studentLink + (it.code ? '\n\n: ' + it.code + '\n(   "  "  )' : '');
    function expiredOk() {
      return !isExpired || confirm('    .        .\n ?');
    }
    async function copyText(txt, doneMsg) {
      try { await navigator.clipboard.writeText(txt); alert(doneMsg); }
      catch (e) { prompt('    ', txt); }
    }
    const extBtn = row.querySelector('.extend-btn');
    if (extBtn) extBtn.addEventListener('click', async () => {
      const v = prompt((it.studentName || '') + '     ?\n . (0 =   )', '7');
      if (v === null) return;
      const days = parseInt(v, 10);
      if (isNaN(days) || days < 0) { alert('0    .'); return; }
      extBtn.disabled = true; extBtn.textContent = ' ...';
      try {
        const r = await api('/api/results?id=' + encodeURIComponent(it.id), { method: 'PATCH', body: JSON.stringify({ days }) });
        it.expiresAt = r.expiresAt;
        alert(days === 0 ? '      .' : '. ' + daysRemainingText(r.expiresAt) + '\n "  "  .');
        renderList();
      } catch (e) {
        alert(' : ' + e.message);
        extBtn.disabled = false; extBtn.textContent = '  ';
      }
    });
    row.querySelector('.copy-student-btn').addEventListener('click', () => {
      if (!expiredOk()) return;
      copyText(studentLink, '   .    .');
    });
    row.querySelector('.send-student-btn').addEventListener('click', async () => {
      if (!expiredOk()) return;
      if (navigator.share) {
        try { await navigator.share({ title: '  ', text: sendText }); return; }
        catch (e) { if (e && e.name === 'AbortError') return; }
      }
      copyText(sendText, '   .    .');
    });
    row.querySelector('.delete-result-btn').addEventListener('click', async () => {
      if (!confirm(`${it.studentName || ' '}   ?        .`)) return;
      try {
        await api('/api/results?id=' + it.id, { method: 'DELETE' });
        allItems = allItems.filter(x => x.id !== it.id);
        renderList();
      } catch (e) {
        alert(' : ' + e.message);
      }
    });
    return row;
  }

  function renderList() {
    const filterVal = filterSelect.value;
    listEl.innerHTML = '';

    if (filterVal === '__all__') {
      sortItems(allItems).forEach(it => listEl.appendChild(buildResultRow(it)));
    } else if (filterVal === '__group__') {
      presetNames.forEach(name => {
        const groupItems = sortItems(allItems.filter(it => (it.presetName || '') === name));
        if (!groupItems.length) return;
        const groupWrap = document.createElement('details');
        groupWrap.open = true;
        groupWrap.style.marginBottom = '14px';
        const summary = document.createElement('summary');
        summary.style.cursor = 'pointer';
        summary.innerHTML = `<b style="color:var(--navy)"> ${escapeHtml(name)}</b> <span class="star-tag ok">${groupItems.length}</span>`;
        groupWrap.appendChild(summary);
        const inner = document.createElement('div');
        inner.style.marginTop = '8px';
        groupItems.forEach(it => inner.appendChild(buildResultRow(it)));
        groupWrap.appendChild(inner);
        listEl.appendChild(groupWrap);
      });
    } else {
      const filtered = sortItems(allItems.filter(it => (it.presetName || '') === filterVal));
      filtered.forEach(it => listEl.appendChild(buildResultRow(it)));
    }
    if (!listEl.children.length) listEl.innerHTML = `<div class="empty">  .</div>`;
  }

  filterSelect.addEventListener('change', renderList);
  sortSelect.addEventListener('change', renderList);
  renderList();
}
